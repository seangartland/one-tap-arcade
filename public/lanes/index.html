<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070f'/%3E%3Cpath d='M11 4 V28 M21 4 V28' stroke='%2301cdfe' stroke-width='2' opacity='.6'/%3E%3Crect x='4' y='6' width='5' height='7' rx='1' fill='%23ffb300'/%3E%3Cpath d='M16 18 L20 27 H12 Z' fill='%2301cdfe'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#020308" />
  <title>Lanes - a three-lane neon dodger</title>
  <link rel="stylesheet" href="/shared/arcade.css" />
  <style>
    canvas { touch-action: none; }
    .mark:has(svg) svg { filter: none; }
  </style>
</head>
<body class="game">
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Three lanes. Tap the left or right half of the screen to switch lanes and dodge the falling blocks."></canvas>
    <div class="hud hud-center" aria-live="polite">
      <div class="score-wrap">
        <span class="score" id="score">0</span>
      </div>
    </div>
    <div class="hint">Tap a side to switch · <span class="key">←</span> <span class="key">→</span></div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 120 68" aria-hidden="true"><path d="M8 8 V60 M112 8 V60" stroke="#01cdfe" stroke-width="6" stroke-linecap="round" opacity=".1" fill="none"/><path d="M8 8 V60 M112 8 V60" stroke="#aaf5ff" stroke-width="1.5" stroke-linecap="round" opacity=".8" fill="none"/><path d="M40 8 V60 M80 8 V60" stroke="#01cdfe" stroke-width="4" stroke-linecap="round" opacity=".14" stroke-dasharray="4 8" fill="none"/><path d="M40 8 V60 M80 8 V60" stroke="#aaf5ff" stroke-width="1.2" stroke-linecap="round" opacity=".55" stroke-dasharray="4 8" fill="none"/><rect x="14" y="14" width="19" height="10" rx="2" fill="#08101f" stroke="#ff2bd6" stroke-width="5" opacity=".16"/><rect x="14" y="14" width="19" height="10" rx="2" fill="#08101f" stroke="#ff7ae0" stroke-width="1.3" opacity=".9"/><rect x="87" y="22" width="19" height="10" rx="2" fill="#08101f" stroke="#ff2bd6" stroke-width="5" opacity=".16"/><rect x="87" y="22" width="19" height="10" rx="2" fill="#08101f" stroke="#ff7ae0" stroke-width="1.3" opacity=".9"/><path d="M38 45 L40 41 L42 45 M78 45 L80 41 L82 45" stroke="#ffd166" stroke-width="3.4" stroke-linecap="round" opacity=".12" fill="none"/><path d="M38 45 L40 41 L42 45 M78 45 L80 41 L82 45" stroke="#ffd166" stroke-width="1.5" stroke-linecap="round" opacity=".85" fill="none"/><path d="M38 56 L40 52 L42 56 M78 56 L80 52 L82 56" stroke="#ffd166" stroke-width="3.4" stroke-linecap="round" opacity=".12" fill="none"/><path d="M38 56 L40 52 L42 56 M78 56 L80 52 L82 56" stroke="#ffd166" stroke-width="1.5" stroke-linecap="round" opacity=".85" fill="none"/><path d="M60 34 L72 50 L60 45 L48 50 Z" fill="#08101f" stroke="#01cdfe" stroke-width="5" stroke-linejoin="round" opacity=".18"/><path d="M60 34 L72 50 L60 45 L48 50 Z" fill="#08101f" stroke="#aaf5ff" stroke-width="1.4" stroke-linejoin="round" opacity=".95"/><circle cx="60" cy="42" r="2.2" fill="#ffffff"/></svg></div>
    </section>
  </main>

  <script>
    window.ARCADE = {
      game: 'lanes',
      title: 'Lanes.',
      tagline: 'Tap left or right to switch lanes. Dodge the blocks.',
      startLabel: 'Start dodging',
      restartLabel: 'Run it back',
      resultLabel: 'Run complete',
      boardHeading: 'Lanes · Global leaders'
    };
  </script>
  <script src="/shared/arcade.js"></script>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = Arcade.gameEl;
      var scoreEl = document.getElementById('score');
      var tone = Arcade.tone;
      var showToast = Arcade.showToast;
      var colors = Arcade.colors;

      // APEX palette: cyan player/track, amber target/score, magenta threat, white hot core
      var C_CYAN = [1, 205, 250];
      var C_ICE = [170, 245, 255];
      var C_AMB = [255, 209, 102];
      var C_MAG = [255, 43, 214];
      var C_WHT = [255, 255, 255];
      function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
      function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t | 0, a[1] + (b[1] - a[1]) * t | 0, a[2] + (b[2] - a[2]) * t | 0]; }

      var state = 'ready';
      var W = 0, H = 0, dpr = 1;
      var bgGrad = null, vigGrad = null;
      var score = 0;
      var elapsed = 0;
      function checkPhase() {
        var n = Math.min(5, 1 + Math.floor(elapsed / 15));
        if (Arcade.setPhase(n)) {
          tone(520, .12, 'sine', .06, 0);
          tone(392, .16, 'sine', .05, .09);
        }
      }
      var last = 0;
      var blocks = [];
      var particles = [];
      var rings = [];
      var stars = [];
      var nebulas = [];
      var trail = [];
      var flash = 0;
      var shake = 0;
      var spawnTimer = 0;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // player + playfield
      var lane = 1, laneF = 1;
      var px = 0, py = 0, tilt = 0;
      var pfX = 0, pfW = 0, laneW = 0;
      var SHIP_R = 13;
      var BLOCK_H = 30;

      function laneCenter(i) { return pfX + laneW * (i + .5); }

      function layout() {
        pfW = Math.min(W * .92, 440);
        pfX = (W - pfW) / 2;
        laneW = pfW / 3;
        py = H * .78;
        px = laneCenter(laneF);
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        bgGrad = ctx.createRadialGradient(W / 2, H * .35, 0, W / 2, H * .35, Math.hypot(W, H) * .8);
        bgGrad.addColorStop(0, '#0a1634'); bgGrad.addColorStop(.55, '#050a1a'); bgGrad.addColorStop(1, '#020308');
        vigGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.min(W, H) * .72);
        vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); vigGrad.addColorStop(1, 'rgba(0,0,0,.62)');
        layout();
        initField();
      }
      window.addEventListener('resize', resize, { passive: true });

      var rand = Arcade.rand;

      function initField() {
        stars = [];
        var n = Math.round(Math.min(150, W * H / 10000));
        for (var i = 0; i < n; i++) {
          stars.push({ x: Math.random() * W, y: Math.random() * H, s: rand(.6, 1.9), spd: rand(10, 42), tw: Math.random() * Math.PI * 2 });
        }
        nebulas = [
          { x: W * .2, y: H * .25, r: Math.max(W, H) * .32, c: '70,120,230', vx: 6, vy: 3, ph: 0 },
          { x: W * .82, y: H * .7, r: Math.max(W, H) * .28, c: '60,190,235', vx: -5, vy: 4, ph: 2 },
          { x: W * .6, y: H * .1, r: Math.max(W, H) * .22, c: '120,150,255', vx: 4, vy: -3, ph: 4 }
        ];
      }

      function shiftSound() {
        tone(620, .07, 'sine', .05, 0);
        tone(820, .08, 'sine', .035, .035);
      }
      function passSound() {
        tone(990, .07, 'sine', .045, 0);
      }
      function deathSound() {
        tone(96, .32, 'sine', .2, 0);
        tone(58, .5, 'triangle', .16, .02);
        tone(180, .18, 'sawtooth', .06, 0);
      }

      function setScore() {
        scoreEl.textContent = String(score);
      }

      function speed() { return Math.min(560, 200 + elapsed * 7); }
      function rowInterval() { return Math.max(.4, .9 - elapsed * .012); }
      function doubleChance() { return Math.min(.68, .12 + elapsed * .014); }

      function blockFor(l, y) {
        return { lane: l, y: y, h: BLOCK_H, scored: false, ph: Math.random() * Math.PI * 2 };
      }

      // Never blocks all three lanes: doubles always leave one lane open.
      function spawnRow(y) {
        if (Math.random() < doubleChance()) {
          var free = Math.floor(Math.random() * 3);
          for (var i = 0; i < 3; i++) if (i !== free) blocks.push(blockFor(i, y));
        } else {
          blocks.push(blockFor(Math.floor(Math.random() * 3), y));
        }
      }

      function startGame() {
        Arcade.startFlow();
        state = 'playing';
        score = 0; elapsed = 0; Arcade.resetPhase();
        blocks = []; particles = []; rings = []; trail = [];
        flash = 0; shake = 0;
        lane = 1; laneF = 1;
        layout();
        spawnTimer = .55;
        setScore();
        gameEl.classList.add('playing');
        tone(440, .09, 'sine', .07, 0);
        tone(660, .13, 'sine', .06, .065);
        canvas.focus({ preventScroll: true });
      }

      function burst(x, y, color, count) {
        if (reduced) count = Math.min(count, 4);
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2;
          var v = rand(55, 190);
          particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, size: rand(2, 5), color: color });
        }
      }

      function die() {
        if (state !== 'playing') return;
        state = 'dying';
        deathSound();
        burst(px, py, C_MAG, 26);
        burst(px, py, C_WHT, 16);
        shake = reduced ? 0 : 13;
        flash = .4;
        setTimeout(endGame, 420);
      }

      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        Arcade.gameOver({
          score: score,
          title: String(score),
          instruction: score === 0 ? 'A wall found you instantly. Tap the open side.' : (score < 15 ? 'Nice weave. The rain gets faster.' : 'Sharp reflexes. Hold the line longer?'),
          restartLabel: 'Run it back'
        });
      }

      function move(dir) {
        if (state !== 'playing') return;
        var n = Math.max(0, Math.min(2, lane + dir));
        if (n === lane) return;
        lane = n;
        shiftSound();
        if (!reduced) {
          rings.push({ x: laneCenter(lane), y: py, r: 6, life: .7, color: C_AMB });
        }
      }

      canvas.addEventListener('pointerdown', function (e) {
        if (e.pointerType === 'touch') return;
        e.preventDefault();
        Arcade.initAudio();
        if (state !== 'playing') return;
        var r = canvas.getBoundingClientRect();
        var left = (e.clientX - r.left) < laneCenter(lane);
        move(left ? -1 : 1);
      });

      canvas.addEventListener('touchstart', function (e) {
        e.preventDefault();
        Arcade.initAudio();
        if (state !== 'playing') return;
        var t = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]);
        if (!t) return;
        var r = canvas.getBoundingClientRect();
        var left = (t.clientX - r.left) < laneCenter(lane);
        move(left ? -1 : 1);
      }, { passive: false });

      document.addEventListener('keydown', function (e) {
        if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') {
          if (state === 'playing') e.preventDefault();
          if (e.repeat) return;
          move(e.code === 'ArrowLeft' ? -1 : 1);
        }
      });

      ARCADE.onStart = startGame;
      ARCADE.onVisibility = function () { last = performance.now(); };

      function update(dt) {
        elapsed += dt;
        checkPhase();

        // lane slide
        var prevF = laneF;
        laneF += (lane - laneF) * Math.min(1, dt * 14);
        if (Math.abs(lane - laneF) < .002) laneF = lane;
        px = laneCenter(laneF);
        tilt = Math.max(-.38, Math.min(.38, (laneF - prevF) / Math.max(dt, .0001) * .0011));

        if (state === 'playing') {
          // thruster
          if (!reduced) {
            particles.push({
              x: px + rand(-4, 4), y: py + 13,
              vx: rand(-14, 14), vy: rand(50, 105),
              life: .5, size: rand(1.4, 3), color: C_CYAN, drag: 0
            });
          }

          // spawn rows
          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawnRow(-BLOCK_H - 4);
            spawnTimer = rowInterval() * rand(.85, 1.15);
          }

          // blocks
          var v = speed();
          for (var i = blocks.length - 1; i >= 0; i--) {
            var b = blocks[i];
            b.y += v * dt;
            b.ph += dt * 3;
            var bx = laneCenter(b.lane);
            var bw = laneW - 14;
            // circle vs rect hit test
            var nx = Math.max(bx - bw / 2, Math.min(px, bx + bw / 2));
            var ny = Math.max(b.y, Math.min(py, b.y + b.h));
            var dx = px - nx, dy = py - ny;
            if (dx * dx + dy * dy < SHIP_R * SHIP_R) { die(); return; }
            if (!b.scored && b.y > py + SHIP_R) {
              b.scored = true;
              score += 1; setScore();
              rings.push({ x: bx, y: b.y, r: 5, life: 1, color: C_AMB });
              if (b.lane === lane) passSound();
            }
            if (b.y > H + 30) blocks.splice(i, 1);
          }
        }

        // effects
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.x += pt.vx * dt; pt.y += pt.vy * dt;
          if (pt.drag) { pt.vx *= pt.drag; pt.vy *= pt.drag; }
          pt.life -= dt * (pt.drag ? 2.6 : 1.9);
          if (pt.life <= 0) particles.splice(p, 1);
        }
        for (var rg = rings.length - 1; rg >= 0; rg--) {
          rings[rg].r += dt * 90; rings[rg].life -= dt * 2.2;
          if (rings[rg].life <= 0) rings.splice(rg, 1);
        }
        flash = Math.max(0, flash - dt * 1.7);
        shake = Math.max(0, shake - dt * 46);
      }

      function driftField(dt) {
        for (var st = 0; st < stars.length; st++) {
          stars[st].y += stars[st].spd * dt; stars[st].tw += dt * 2;
          if (stars[st].y > H + 4) { stars[st].y = -4; stars[st].x = Math.random() * W; }
        }
        for (var nb = 0; nb < nebulas.length; nb++) {
          var neb = nebulas[nb];
          neb.x += neb.vx * dt; neb.y += neb.vy * dt; neb.ph += dt * .3;
          if (neb.x < -neb.r) neb.x = W + neb.r; if (neb.x > W + neb.r) neb.x = -neb.r;
          if (neb.y < -neb.r) neb.y = H + neb.r; if (neb.y > H + neb.r) neb.y = -neb.r;
        }
      }

      function rr(x, y, w, h, r) {
        ctx.beginPath();
        if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
        r = Math.min(r, w / 2, h / 2);
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function drawGrid() {
        var sp = 64;
        var mn = new Path2D(), mj = new Path2D();
        var i, x, y;
        for (i = 0; i <= W / sp + 1; i++) {
          x = i * sp;
          if (i % 5 === 0) { mj.moveTo(x, 0); mj.lineTo(x, H); }
          else { mn.moveTo(x, 0); mn.lineTo(x, H); }
        }
        for (i = 0; i <= H / sp + 1; i++) {
          y = i * sp;
          if (i % 5 === 0) { mj.moveTo(0, y); mj.lineTo(W, y); }
          else { mn.moveTo(0, y); mn.lineTo(W, y); }
        }
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(40,130,255,.06)'; ctx.stroke(mn);
        ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(90,170,255,.12)'; ctx.stroke(mj);
      }

      function drawBackground() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        drawGrid();

        nebulas.forEach(function (neb) {
          var wob = 1 + .06 * Math.sin(neb.ph);
          var g = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.r * wob);
          g.addColorStop(0, 'rgba(' + neb.c + ',.12)');
          g.addColorStop(1, 'rgba(' + neb.c + ',0)');
          ctx.fillStyle = g;
          ctx.fillRect(neb.x - neb.r, neb.y - neb.r, neb.r * 2, neb.r * 2);
        });

        stars.forEach(function (star) {
          ctx.globalAlpha = .35 + .3 * Math.sin(star.tw);
          ctx.fillStyle = colors.ink;
          ctx.fillRect(star.x, star.y, star.s, star.s);
        });
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      function drawRails(t) {
        // near-opaque dark track surface
        ctx.fillStyle = 'rgba(4,8,20,.9)';
        ctx.fillRect(pfX, 0, pfW, H);

        // magenta haze where threats arrive
        var hz = ctx.createLinearGradient(0, 0, 0, H * .16);
        hz.addColorStop(0, 'rgba(255,43,214,.07)');
        hz.addColorStop(1, 'rgba(255,43,214,0)');
        ctx.fillStyle = hz;
        ctx.fillRect(pfX, 0, pfW, H * .16);

        // outer rails: stacked cyan glow
        var rail = new Path2D();
        rail.moveTo(pfX, 0); rail.lineTo(pfX, H);
        rail.moveTo(pfX + pfW, 0); rail.lineTo(pfX + pfW, H);
        ctx.lineWidth = 9; ctx.strokeStyle = rgba(C_CYAN, .07); ctx.stroke(rail);
        ctx.lineWidth = 2.4; ctx.strokeStyle = rgba(C_CYAN, .2); ctx.stroke(rail);
        ctx.lineWidth = 1.2; ctx.strokeStyle = rgba(C_ICE, .85); ctx.stroke(rail);

        // inner dashed dividers, slowly scrolling, stacked glow
        ctx.lineCap = 'round';
        ctx.setLineDash([3, 13]);
        ctx.lineDashOffset = -t * .02;
        var div = new Path2D();
        div.moveTo(pfX + laneW, 0); div.lineTo(pfX + laneW, H);
        div.moveTo(pfX + laneW * 2, 0); div.lineTo(pfX + laneW * 2, H);
        ctx.lineWidth = 6; ctx.strokeStyle = rgba(C_CYAN, .06); ctx.stroke(div);
        ctx.lineWidth = 1.6; ctx.strokeStyle = rgba(C_CYAN, .18); ctx.stroke(div);
        ctx.lineWidth = 1; ctx.strokeStyle = rgba(C_ICE, .5); ctx.stroke(div);
        ctx.setLineDash([]);
        ctx.lineCap = 'butt';
      }

      function drawOpenLane(t) {
        var l0 = pfX + laneF * laneW;
        var l1 = l0 + laneW;
        // soft amber wash lighting the open lane from below
        var wash = ctx.createLinearGradient(0, H, 0, py - laneW * .7);
        wash.addColorStop(0, rgba(C_AMB, .07));
        wash.addColorStop(1, rgba(C_AMB, 0));
        ctx.fillStyle = wash;
        ctx.fillRect(l0, py - laneW * .7, laneW, H - (py - laneW * .7));
      }

      function drawShip(t) {
        var bob = state === 'playing' ? 0 : Math.sin(t * .003) * 3;
        var sx = px, sy = py + bob;
        // floor glow: cyan safe surface beneath the ship
        ctx.save();
        ctx.globalAlpha = .4;
        var fg = ctx.createRadialGradient(sx, py + 30, 0, sx, py + 30, laneW * .45);
        fg.addColorStop(0, rgba(C_CYAN, .3));
        fg.addColorStop(1, rgba(C_CYAN, 0));
        ctx.fillStyle = fg;
        ctx.beginPath(); ctx.arc(sx, py + 30, laneW * .45, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(tilt);
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        var P = new Path2D();
        P.moveTo(0, -17);
        P.lineTo(12, 13);
        P.lineTo(0, 7);
        P.lineTo(-12, 13);
        P.closePath();
        ctx.strokeStyle = rgba(C_CYAN, .08); ctx.lineWidth = 7; ctx.stroke(P);
        ctx.strokeStyle = rgba(C_CYAN, .22); ctx.lineWidth = 2.8; ctx.stroke(P);
        ctx.strokeStyle = rgba(C_ICE, .95); ctx.lineWidth = 1.3; ctx.stroke(P);
        ctx.fillStyle = 'rgba(8,16,31,.9)'; ctx.fill(P);
        ctx.fillStyle = 'rgba(255,255,255,1)';
        ctx.beginPath(); ctx.arc(0, -3, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawGame(t) {
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        drawRails(t);
        drawOpenLane(t);

        // blocks: magenta-edged, stacked-stroke glow
        blocks.forEach(function (b) {
          var cx = laneCenter(b.lane);
          var w = laneW - 14;
          var x = cx - w / 2;
          var pulse = .82 + .18 * Math.sin(b.ph);
          ctx.save();
          ctx.lineJoin = 'round';
          rr(x, b.y, w, b.h, 7);
          ctx.fillStyle = 'rgba(8,16,31,.85)'; ctx.fill();
          ctx.strokeStyle = rgba(C_MAG, .07 * pulse); ctx.lineWidth = w * .5; ctx.stroke();
          ctx.strokeStyle = rgba(C_MAG, .2 * pulse); ctx.lineWidth = 5; ctx.stroke();
          ctx.strokeStyle = rgba(mixc(C_MAG, C_WHT, .35), .95); ctx.lineWidth = 1.5; ctx.stroke();
          // white hot top core
          ctx.globalAlpha = .75;
          ctx.fillStyle = 'rgba(255,255,255,.85)';
          rr(x + 6, b.y + 4, w - 12, 2.5, 1.25);
          ctx.fill();
          ctx.restore();
          ctx.globalAlpha = 1;
        });

        // trail behind the ship: three overlapping passes, brighter toward the head
        for (var pass = 0; pass < 3; pass++) {
          for (var i = 0; i < trail.length; i++) {
            var tp = trail[i];
            var f = trail.length > 1 ? i / (trail.length - 1) : 1;
            if (pass === 0) {
              ctx.globalAlpha = .05 * f; ctx.fillStyle = rgba(C_CYAN, 1);
              ctx.beginPath(); ctx.arc(tp.x, tp.y, 3 + f * 7, 0, Math.PI * 2); ctx.fill();
            } else if (pass === 1) {
              ctx.globalAlpha = .15 * f; ctx.fillStyle = rgba(C_ICE, 1);
              ctx.beginPath(); ctx.arc(tp.x, tp.y, 1.8 + f * 4, 0, Math.PI * 2); ctx.fill();
            } else {
              ctx.globalAlpha = .85 * f; ctx.fillStyle = rgba(mixc(C_ICE, C_WHT, f), 1);
              ctx.beginPath(); ctx.arc(tp.x, tp.y, .9 + f * 2.2, 0, Math.PI * 2); ctx.fill();
            }
          }
        }
        ctx.globalAlpha = 1;
        trail.length = 0;

        if (state !== 'over' && state !== 'dying') drawShip(t);

        particles.forEach(function (p) {
          ctx.globalAlpha = Math.max(0, p.life);
          var s = Math.max(.6, p.size * p.life);
          ctx.fillStyle = rgba(p.color, Math.max(0, p.life));
          ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
        });
        rings.forEach(function (r) {
          ctx.globalAlpha = Math.max(0, r.life);
          ctx.setLineDash([5, 7]);
          ctx.lineWidth = 2.4 * r.life + .4;
          ctx.strokeStyle = rgba(r.color, .9);
          ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
        });
        ctx.globalAlpha = 1;
        ctx.restore();

        // black edge vignette
        ctx.fillStyle = vigGrad;
        ctx.fillRect(0, 0, W, H);
        if (flash > 0) {
          ctx.globalAlpha = flash * .22;
          ctx.fillStyle = 'rgba(255,43,214,1)';
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
      }

      function loop(t) {
        var dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
        if (state === 'playing' || state === 'dying') {
          update(dt);
          driftField(dt);
          if (state === 'playing') trail.push({ x: px, y: py });
          if (trail.length > 20) trail.shift();
        } else {
          driftField(dt * .4);
          flash = Math.max(0, flash - dt * 1.7);
          shake = Math.max(0, shake - dt * 46);
        }
        drawBackground();
        drawGame(t);
        requestAnimationFrame(loop);
      }

      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
