<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f4f1ea'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e07856'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070f" />
  <title>Pulse - a one-tap orbit game</title>
  <link rel="stylesheet" href="/shared/arcade.css" />
  <style>.mark:has(svg) svg { filter: none; }</style>
</head>
<body class="game">
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Orbit timing game. Tap or press space when the moving dot reaches the highlighted arc."></canvas>
    <div class="hud" aria-live="polite">
      <div class="score-wrap">
        <span class="score" id="score">0</span>
        <span class="multiplier" id="multiplier">×2</span>
      </div>
      <div class="lives" aria-label="3 lives remaining">
        <span class="life"></span><span class="life"></span><span class="life"></span>
      </div>
    </div>
    <div class="hint">Tap anywhere · Space</div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 120 68" aria-hidden="true"><circle cx="60" cy="34" r="22" fill="none" stroke="rgba(4,8,20,.85)" stroke-width="11"/><circle cx="60" cy="34" r="16.5" fill="none" stroke="rgba(170,245,255,.07)" stroke-width="6"/><circle cx="60" cy="34" r="16.5" fill="none" stroke="rgba(170,245,255,.2)" stroke-width="3"/><circle cx="60" cy="34" r="16.5" fill="none" stroke="#aaf5ff" stroke-width="1.5"/><circle cx="60" cy="34" r="27.5" fill="none" stroke="rgba(170,245,255,.07)" stroke-width="6"/><circle cx="60" cy="34" r="27.5" fill="none" stroke="rgba(170,245,255,.2)" stroke-width="3"/><circle cx="60" cy="34" r="27.5" fill="none" stroke="#aaf5ff" stroke-width="1.5"/><path d="M72.8 16.1 A22 22 0 0 1 72.8 51.9" fill="none" stroke="rgba(255,209,102,.07)" stroke-width="14"/><path d="M72.8 16.1 A22 22 0 0 1 72.8 51.9" fill="none" stroke="rgba(255,209,102,.2)" stroke-width="8"/><path d="M72.8 16.1 A22 22 0 0 1 72.8 51.9" fill="none" stroke="rgba(255,209,102,.55)" stroke-width="5.5" stroke-dasharray="1 4" stroke-linecap="round"/><path d="M72.8 16.1 A22 22 0 0 1 72.8 51.9" fill="none" stroke="#ffd166" stroke-width="2.8"/><circle cx="82" cy="34" r="7" fill="rgba(255,209,102,.16)"/><circle cx="82" cy="34" r="3" fill="#ffd166"/><path d="M46.18 16.88 A22 22 0 0 1 56.08 12.35" fill="none" stroke="rgba(170,245,255,.08)" stroke-width="2.4" stroke-linecap="round"/><path d="M56.08 12.35 A22 22 0 0 1 64.16 12.4" fill="none" stroke="rgba(170,245,255,.22)" stroke-width="3.4" stroke-linecap="round"/><path d="M64.16 12.4 A22 22 0 0 1 68.98 13.91" fill="none" stroke="rgba(170,245,255,.65)" stroke-width="5" stroke-linecap="round"/><circle cx="69" cy="13.9" r="6.5" fill="rgba(170,245,255,.14)"/><circle cx="69" cy="13.9" r="4.4" fill="rgba(170,245,255,.4)"/><circle cx="69" cy="13.9" r="2.4" fill="#f4fdff"/></svg></div>
    </section>
  </main>

  <script>
    window.ARCADE = {
      game: 'pulse',
      title: 'Catch the pulse.',
      tagline: 'Tap when the moving spark reaches the bright arc. Keep the streak alive.',
      startLabel: 'Start orbit',
      restartLabel: 'Run it back',
      resultLabel: 'Run complete',
      boardHeading: 'Pulse · Global leaders'
    };
  </script>
  <script src="/shared/arcade.js"></script>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = Arcade.gameEl;
      var scoreEl = document.getElementById('score');
      var multEl = document.getElementById('multiplier');
      var livesEls = Array.prototype.slice.call(document.querySelectorAll('.life'));
      var livesLabel = document.querySelector('.lives');
      var tone = Arcade.tone;
      var showToast = Arcade.showToast;
      var C_CYAN = '#aaf5ff';
      var C_AMBER = '#ffd166';
      var C_MAGENTA = '#ff5fa2';
      var C_WHITE = '#f4fdff';
      var C_MUTED = '#66879f';


      var state = 'ready';
      var W = 0, H = 0, dpr = 1, cx = 0, cy = 0, radius = 130;
      var angle = -Math.PI / 2;
      var target = Math.PI / 2;
      var direction = 1;
      var speed = 2.3;
      var score = 0;
      var streak = 0;
      var lives = 3;
      var last = 0;
      var particles = [];
      var rings = [];
      var flash = 0;
      var flashColor = C_AMBER;
      var shake = 0;
      var targetWidth = .68;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var hits = 0;
      var PHASE_HITS = [18, 40, 65, 95]; // successful taps where phases 2..5 begin
      function checkPhase() {
        Arcade.setPhase(Arcade.phaseAt(hits, PHASE_HITS));
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = W / 2; cy = H / 2 + Math.min(24, H * .03);
        radius = Math.min(W * .31, H * .255, 190);
      }
      window.addEventListener('resize', resize, {passive:true});
      resize();

      function norm(a) {
        while (a > Math.PI) a -= Math.PI * 2;
        while (a < -Math.PI) a += Math.PI * 2;
        return a;
      }
      function distance(a, b) { return Math.abs(norm(a - b)); }
      var rand = Arcade.rand;

      function hitSound(perfect) {
        tone(perfect ? 690 : 520, .13, 'sine', .11, 0);
        tone(perfect ? 1035 : 780, .16, 'sine', .075, .055);
      }
      function missSound() { tone(220, .2, 'triangle', .12, 0); }

      function setLives() {
        livesEls.forEach(function (el, i) { el.classList.toggle('lost', i >= lives); });
        livesLabel.setAttribute('aria-label', lives + (lives === 1 ? ' life remaining' : ' lives remaining'));
      }
      function setScore() {
        scoreEl.textContent = String(score);
        var multi = Math.min(5, 1 + Math.floor(streak / 5));
        multEl.textContent = '×' + multi;
        multEl.classList.toggle('show', multi > 1);
        checkPhase();
      }
      function newTarget() {
        var next;
        do { next = Math.random() * Math.PI * 2; } while (distance(next, angle) < .92);
        target = next;
        targetWidth = Math.max(.28, .68 - score * .008);
      }
      function startGame() {
        Arcade.startFlow();
        state = 'playing'; score = 0; hits = 0; streak = 0; lives = 3; Arcade.resetPhase();
        angle = -Math.PI / 2; direction = Math.random() > .5 ? 1 : -1; speed = 3.2;
        particles = []; rings = []; flash = 0; shake = 0;
        newTarget(); setScore(); setLives();
        gameEl.classList.add('playing');
        tone(440, .09, 'sine', .07, 0);
        tone(660, .13, 'sine', .06, .065);
        canvas.focus({preventScroll:true});
      }
      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        Arcade.gameOver({
          score: score,
          title: String(score),
          instruction: score === 0 ? 'The orbit got away. Find the arc and tap right as the spark enters it.' : (score < 12 ? 'Nice start. The arc gets tighter as your score climbs.' : 'Sharp timing. One more run?'),
          restartLabel: 'Run it back'
        });
      }
      function burst(x, y, color, count) {
        if (reduced) count = Math.min(count, 4);
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2;
          var v = rand(55, 170);
          particles.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, size:rand(2,5), color:color});
        }
      }
      function attempt() {
        if (state !== 'playing') return;
        Arcade.initAudio();
        var d = distance(angle, target);
        var allowance = targetWidth * .57 + .10;
        if (d <= allowance) {
          var perfect = d < targetWidth * .19;
          streak++; hits++;
          var multi = Math.min(5, 1 + Math.floor(streak / 5));
          score += (perfect ? 2 : 1) * multi;
          speed = Math.min(4.45, speed + .10);
          direction *= -1;
          var x = cx + Math.cos(angle) * radius;
          var y = cy + Math.sin(angle) * radius;
          burst(x, y, perfect ? C_WHITE : C_AMBER, perfect ? 18 : 11);
          rings.push({x:x,y:y,r:9,life:1,color:perfect?C_WHITE:C_AMBER});
          flash = perfect ? .32 : .16;
          flashColor = perfect ? C_WHITE : C_AMBER;
          hitSound(perfect);
          showToast(perfect ? 'Perfect +'+(2*multi) : 'Hit +'+multi, perfect ? C_WHITE : C_AMBER);
          newTarget(); setScore();
        } else {
          lives--; streak = 0; speed = Math.max(2.0, speed - .16); shake = reduced ? 0 : 9;
          missSound(); showToast('Miss', C_MAGENTA); setScore(); setLives();
          burst(cx + Math.cos(angle)*radius, cy + Math.sin(angle)*radius, C_MAGENTA, 8);
          if (lives <= 0) setTimeout(endGame, 280);
        }
      }

      ARCADE.onStart = startGame;
      ARCADE.onVisibility = function(){ last = performance.now(); };
      canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); attempt(); });
      document.addEventListener('keydown', function(e){
        if ((e.code === 'Space' || e.code === 'Enter') && state === 'playing') { e.preventDefault(); attempt(); }
      });

      function strokeArc(context, x, y, r, a0, a1, width, color, alpha, ccw) {
        context.lineCap = 'round';
        context.globalAlpha = alpha;
        context.strokeStyle = color;
        context.lineWidth = width;
        context.beginPath(); context.arc(x, y, r, a0, a1, !!ccw); context.stroke();
        context.globalAlpha = 1;
      }
      function glowArc(context, x, y, r, a0, a1, core, haloW, midW, coreW) {
        context.lineCap = 'round';
        var passes = [[haloW, .07], [midW, .2]];
        for (var p = 0; p < passes.length; p++) {
          context.globalAlpha = passes[p][1];
          context.strokeStyle = core;
          context.lineWidth = passes[p][0];
          context.beginPath(); context.arc(x, y, r, a0, a1); context.stroke();
        }
        context.globalAlpha = 1;
        context.strokeStyle = core;
        context.lineWidth = coreW;
        context.beginPath(); context.arc(x, y, r, a0, a1); context.stroke();
      }
      function drawBackground(t) {
        ctx.clearRect(-16, -16, W + 32, H + 32);
        ctx.save();
        ctx.translate(shake ? rand(-shake, shake) : 0, shake ? rand(-shake, shake) : 0);

        // phase-driven radial gradient background
        var bgR = Math.max(W, H) * .72;
        ctx.fillStyle = Arcade.bgGradient(ctx, cx, cy, bgR);
        ctx.fillRect(-bgR, -bgR, W + bgR * 2, H + bgR * 2);

        // faint blue grid, one brighter major line each way
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(120,170,230,.05)';
        ctx.beginPath();
        for (var gx = Math.ceil(-16 / 34) * 34; gx <= W + 16; gx += 34) { ctx.moveTo(gx, -16); ctx.lineTo(gx, H + 16); }
        for (var gy = Math.ceil(-16 / 34) * 34; gy <= H + 16; gy += 34) { ctx.moveTo(-16, gy); ctx.lineTo(W + 16, gy); }
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(cx, -16); ctx.lineTo(cx, H + 16);
        ctx.moveTo(-16, cy); ctx.lineTo(W + 16, cy);
        ctx.strokeStyle = 'rgba(120,170,230,.11)';
        ctx.stroke();

        // black edge vignette
        var vg = ctx.createRadialGradient(cx, cy, bgR * .5, cx, cy, bgR);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,.62)');
        ctx.fillStyle = vg;
        ctx.fillRect(-bgR, -bgR, W + bgR * 2, H + bgR * 2);

        // ring track: dark surface with glowing cyan walls
        ctx.strokeStyle = 'rgba(4,8,20,.9)';
        ctx.lineWidth = 26;
        ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.stroke();
        glowArc(ctx, cx, cy, radius - 13.5, 0, Math.PI * 2, C_CYAN, 7, 3, 1.5);
        glowArc(ctx, cx, cy, radius + 13.5, 0, Math.PI * 2, C_CYAN, 7, 3, 1.5);

        // faint orbit ticks between the track walls
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = C_CYAN;
        for (var i = 0; i < 12; i++) {
          var a = i * Math.PI / 6;
          var x1 = cx + Math.cos(a) * (radius - 9), y1 = cy + Math.sin(a) * (radius - 9);
          var x2 = cx + Math.cos(a) * (radius + 9), y2 = cy + Math.sin(a) * (radius + 9);
          ctx.globalAlpha = .1;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        }
        ctx.globalAlpha = 1;

        // amber target arc: stacked glow, apex dot
        var t0 = target - targetWidth / 2 - .055, t1 = target + targetWidth / 2 + .055;
        glowArc(ctx, cx, cy, radius, t0, t1, C_AMBER, 26, 15, 6);
        var ax = cx + Math.cos(target) * radius, ay = cy + Math.sin(target) * radius;
        ctx.globalAlpha = .15; ctx.fillStyle = C_AMBER;
        ctx.beginPath(); ctx.arc(ax, ay, 8, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = C_AMBER;
        ctx.beginPath(); ctx.arc(ax, ay, 3, 0, Math.PI * 2); ctx.fill();

        // spark trail: three overlapping segments, brighter toward the head
        var trails = [[.5, .26, .06, 2.2], [.26, .09, .18, 3.2], [.09, 0, .5, 4.6]];
        for (var k = 0; k < trails.length; k++) {
          strokeArc(ctx, cx, cy, radius, angle - direction * trails[k][0], angle - direction * trails[k][1], trails[k][3], C_CYAN, trails[k][2], direction === -1);
        }

        // spark: cyan body, white-hot core
        var ox = cx + Math.cos(angle) * radius, oy = cy + Math.sin(angle) * radius;
        var pulse = .5 + .5 * Math.sin(t / 160);
        ctx.globalAlpha = .1 + .08 * pulse; ctx.fillStyle = C_CYAN;
        ctx.beginPath(); ctx.arc(ox, oy, 10, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = .55; ctx.fillStyle = C_CYAN;
        ctx.beginPath(); ctx.arc(ox, oy, 5, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1; ctx.fillStyle = C_WHITE;
        ctx.beginPath(); ctx.arc(ox, oy, 2.4, 0, Math.PI * 2); ctx.fill();

        // center streak readout
        if (state === 'playing') {
          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          if (streak >= 1) {
            var numberSize = 30 + Math.min(streak, 20) * 1.2;
            ctx.font = '700 ' + numberSize + 'px DM Mono, monospace';
            ctx.globalAlpha = .06; ctx.strokeStyle = C_AMBER; ctx.lineWidth = 9;
            ctx.strokeText(String(streak), cx, cy - 6);
            ctx.globalAlpha = .18; ctx.lineWidth = 5;
            ctx.strokeText(String(streak), cx, cy - 6);
            ctx.globalAlpha = 1; ctx.fillStyle = C_AMBER;
            ctx.fillText(String(streak), cx, cy - 6);
            ctx.fillStyle = C_MUTED;
            ctx.font = '500 10px DM Mono, monospace';
            ctx.fillText('STREAK', cx, cy + 26);
          } else {
            ctx.fillStyle = C_MUTED;
            ctx.font = '500 11px DM Mono, monospace';
            ctx.fillText('FIND THE ARC', cx, cy);
          }
        }
        ctx.restore();
      }
      function updateEffects(dt) {
        for (var i=particles.length-1;i>=0;i--) {
          var p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=.975; p.vy*=.975; p.life-=dt*1.9;
          if (p.life<=0) particles.splice(i,1);
        }
        for (var j=rings.length-1;j>=0;j--) { rings[j].r+=dt*75; rings[j].life-=dt*2; if(rings[j].life<=0)rings.splice(j,1); }
        flash=Math.max(0,flash-dt*1.7); shake=Math.max(0,shake-dt*45);
      }
      function drawEffects() {
        ctx.save();
        particles.forEach(function(p){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color; ctx.beginPath();ctx.rect(p.x-p.size*p.life/2,p.y-p.size*p.life/2,p.size*p.life,p.size*p.life);ctx.fill(); });
        rings.forEach(function(r){ ctx.globalAlpha=Math.max(0,r.life);ctx.strokeStyle=r.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke(); });
        if(flash){ctx.globalAlpha=flash*.16;ctx.fillStyle=flashColor;ctx.fillRect(-15,-15,W+30,H+30);}
        ctx.restore();
      }
      function loop(t) {
        var dt=Math.min(.033,(t-last)/1000 || 0); last=t;
        if(state==='playing') angle=norm(angle+speed*direction*dt);
        updateEffects(dt); drawBackground(t); drawEffects();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
