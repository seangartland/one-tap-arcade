<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f4f1ea'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e07856'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="icon" href="data:," />
  <title>Wave — hold to rise, release to fall</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;650;750&display=swap');

    :root {
      color-scheme: light dark;
      --paper: #f4f1ea;
      --ink: #151718;
      --muted: #6d716e;
      --line: rgba(21,23,24,.14);
      --cyan: #087f8c;
      --coral: #e95d45;
      --lime: #bbda45;
      --panel: rgba(244,241,234,.82);
      --shadow: rgba(32,30,25,.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111416;
        --ink: #f2f0e9;
        --muted: #a7aaa7;
        --line: rgba(242,240,233,.15);
        --cyan: #4bc7cf;
        --coral: #ff765f;
        --lime: #cde85a;
        --panel: rgba(17,20,22,.82);
        --shadow: rgba(0,0,0,.35);
      }
      meta[name="theme-color"] { content: #111416; }
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; }
    body {
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: Manrope, ui-sans-serif, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      user-select: none;
    }
    button { font: inherit; }

    .game {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 480px;
      isolation: isolate;
      background:
        radial-gradient(circle at 22% 14%, color-mix(in srgb, var(--lime) 16%, transparent), transparent 31%),
        radial-gradient(circle at 82% 83%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 34%),
        var(--paper);
    }
    .grain {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: .15;
      z-index: 4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }
    @media (prefers-color-scheme: dark) { .grain { mix-blend-mode: screen; opacity: .09; } }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
      outline: none;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      right: max(24px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 3;
    }
    .score-wrap { display: flex; align-items: baseline; gap: 10px; }
    .score {
      font: 500 clamp(30px, 5vw, 48px)/1 DM Mono, monospace;
      letter-spacing: -.06em;
      min-width: 2ch;
    }
    .multiplier {
      color: var(--coral);
      font: 500 13px/1 DM Mono, monospace;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .18s, transform .18s;
    }
    .multiplier.show { opacity: 1; transform: translateY(0); }
    .lives { display: flex; gap: 8px; padding-top: 8px; }
    .life {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      border: 1.5px solid var(--ink);
      background: var(--ink);
      transition: transform .2s, background .2s;
    }
    .life.lost { background: transparent; transform: scale(.68); }

    .sound {
      position: absolute;
      z-index: 6;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 78%, transparent);
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .sound svg { width: 18px; height: 18px; }
    .sound .off { display: none; }
    .sound[aria-pressed="false"] .on { display: none; }
    .sound[aria-pressed="false"] .off { display: block; }
    .sound:focus-visible, .primary:focus-visible, .linklike:focus-visible, .home:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 28px;
      background: color-mix(in srgb, var(--paper) 48%, transparent);
      backdrop-filter: blur(7px);
      transition: opacity .3s ease, visibility .3s;
    }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .card {
      width: min(430px, 100%);
      text-align: center;
      padding: 34px 28px 30px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px var(--shadow);
      border-radius: 28px 28px 10px 28px;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 50%;
    }
    .mark::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: 50%;
      top: -6px;
      margin-left: -6px;
      background: var(--coral);
      border-radius: 50%;
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--coral) 20%, transparent);
    }
    .mark::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 8px;
      left: 50%;
      bottom: -5px;
      margin-left: -10px;
      background: var(--lime);
      border-radius: 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 54px);
      letter-spacing: -.055em;
      line-height: .96;
      font-weight: 750;
    }
    .instruction {
      margin: 18px auto 26px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 16px;
      max-width: 28ch;
    }
    .key {
      display: inline-block;
      padding: 1px 6px 2px;
      margin: 0 1px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 6px;
      color: var(--ink);
      font: 500 12px/1.45 DM Mono, monospace;
      vertical-align: 1px;
    }
    .primary {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 20px 16px;
      color: #101312;
      background: var(--lime);
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 5px 0 color-mix(in srgb, var(--lime) 55%, #59601d);
      transform: translateY(0);
      transition: transform .1s, box-shadow .1s;
    }
    .primary:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--lime) 55%, #59601d); }
    .result-label {
      display: none;
      color: var(--coral);
      font: 500 12px/1 DM Mono, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .overlay.over .mark { display: none; }
    .overlay.over .result-label { display: block; }
    .overlay.over h1 { font-family: DM Mono, monospace; letter-spacing: -.075em; }
    .overlay.over .instruction { margin-bottom: 9px; }
    .session-best {
      display: none;
      margin: 0 0 26px;
      color: var(--muted);
      font: 400 12px/1.4 DM Mono, monospace;
    }
    .overlay.over .session-best { display: block; }
    #entry, #board { display: none; margin: 0 0 22px; }
    .overlay.over.entry-on #entry { display: block; }
    .overlay.over.board-on #board { display: block; }
    #entry label {
      display: block;
      margin: 0 0 10px;
      color: var(--muted);
      font: 500 11px/1 DM Mono, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .entry-row { display: flex; gap: 10px; align-items: stretch; }
    #initials {
      width: 4.8ch;
      padding: 10px 4px;
      text-align: center;
      font: 500 24px/1.2 DM Mono, monospace;
      letter-spacing: .22em;
      text-indent: .22em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    #initials:focus { outline: 3px solid var(--cyan); outline-offset: 2px; }
    #initials.shake { animation: ishake .32s; border-color: var(--coral); }
    @keyframes ishake {
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }
    .entry-row .primary { flex: 1; width: auto; }
    #saveScore:disabled { opacity: .55; cursor: default; }
    #board h2 {
      margin: 0 0 10px;
      color: var(--muted);
      font: 500 11px/1 DM Mono, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    #boardList {
      list-style: none;
      margin: 0;
      padding: 0;
      font: 400 13px/2 DM Mono, monospace;
      color: var(--muted);
    }
    #boardList li { display: flex; justify-content: space-between; gap: 12px; }
    #boardList li.me { color: var(--coral); }
    #boardList li.empty { justify-content: center; }
    .linklike {
      background: transparent;
      border: 0;
      padding: 6px 8px;
      color: var(--muted);
      font: 500 12px/1.6 DM Mono, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .linklike:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    #skipSave { margin-top: 12px; }
    .card-foot { margin-top: 18px; }
    #boardBack { display: none; margin-top: 14px; }
    .overlay.over .card-foot { display: none; }
    .overlay.leaders-on #entry { display: none !important; }
    .overlay.leaders-on .card-foot { display: none; }
    .overlay.leaders-on #board { display: block; }
    .overlay.leaders-on #boardBack { display: inline-block; }
    .home {
      position: absolute;
      z-index: 6;
      top: max(70px, calc(env(safe-area-inset-top) + 46px));
      right: max(20px, env(safe-area-inset-right));
      padding: 8px 4px;
      color: var(--muted);
      font: 500 12px/1 DM Mono, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .home:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

    .toast {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 18%;
      transform: translate(-50%, 8px);
      opacity: 0;
      color: var(--ink);
      font: 500 13px/1 DM Mono, monospace;
      letter-spacing: .09em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .toast.pop { animation: toast .55s ease-out; }
    @keyframes toast {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); }
      25% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      70% { opacity: 1; transform: translate(-50%, -4px); }
      100% { opacity: 0; transform: translate(-50%, -13px); }
    }
    .hint {
      position: absolute;
      z-index: 3;
      bottom: max(27px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font: 400 11px/1 DM Mono, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: .78;
      transition: opacity .3s;
    }
    .playing .hint { opacity: 0; }

    @media (max-width: 520px) {
      .game { min-height: 420px; }
      .hud { top: max(18px, env(safe-area-inset-top)); left: 19px; right: 19px; }
      .sound { right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 42px; height: 42px; }
      .card { padding: 29px 22px 24px; border-radius: 24px 24px 8px 24px; }
      .hint { bottom: max(28px, env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .overlay, .multiplier, .life, .primary { transition: none; }
      .toast.pop { animation-duration: .01ms; }
    }

    /* wave tweaks */
    canvas { touch-action: none; -webkit-touch-callout: none; }
    .hud { justify-content: center; }
  </style>
</head>
<body>
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Wave. Hold anywhere to rise, release to fall. Steer the glowing ship through the gates."></canvas>
    <div class="hud" aria-live="polite">
      <div class="score-wrap">
        <span class="score" id="score">0</span>
      </div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="hint">Hold to rise &middot; release to fall</div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="card">
        <div class="mark" aria-hidden="true"></div>
        <div class="result-label">Flight over</div>
        <h1 id="title">Wave.</h1>
        <p class="instruction" id="instruction">Hold to rise, release to fall. Thread the gates.</p>
        <p class="session-best" id="sessionBest">Session best · 0</p>
        <div id="entry">
          <label for="initials">Enter your initials</label>
          <div class="entry-row">
            <input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your initials" />
            <button id="saveScore" class="primary" type="button">Save score</button>
          </div>
          <button class="linklike" id="skipSave" type="button">Skip</button>
        </div>
        <div id="board" aria-live="polite">
          <h2>Wave · Global leaders</h2>
          <ol id="boardList"></ol>
          <button class="linklike" id="boardBack" type="button">Back</button>
        </div>
        <button class="primary" id="start">Start flight</button>
        <div class="card-foot"><button class="linklike" id="viewLeaders" type="button">Leaderboard</button></div>
      </div>
    </section>

    <button class="sound" id="sound" type="button" aria-label="Mute sound" aria-pressed="true">
      <svg class="on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z" fill="currentColor"/><path d="M17 9.2c.7.7 1 1.6 1 2.8s-.3 2.1-1 2.8M19.5 6.8c1.4 1.4 2.1 3.1 2.1 5.2s-.7 3.8-2.1 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z" fill="currentColor"/><path d="m17.5 9 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <a class="home" href="../">Arcade</a>
    <div class="grain" aria-hidden="true"></div>
  </main>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = document.getElementById('game');
      var overlay = document.getElementById('overlay');
      var startBtn = document.getElementById('start');
      var scoreEl = document.getElementById('score');
      var toast = document.getElementById('toast');
      var soundBtn = document.getElementById('sound');
      var instructionEl = document.getElementById('instruction');
      var sessionBestEl = document.getElementById('sessionBest');
      var entryEl = document.getElementById('entry');
      var boardEl = document.getElementById('board');
      var boardList = document.getElementById('boardList');
      var initialsEl = document.getElementById('initials');
      var saveBtn = document.getElementById('saveScore');
      var GAME = 'wave';
      var boardCache = null;

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function fetchBoard() {
        boardCache = fetch('/api/scores?game=' + GAME + '&_=' + Date.now())
          .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
          .then(function (d) { return (d && d.scores) || []; })
          .catch(function () { return null; });
        return boardCache;
      }
      function renderBoard(scores, highlightKey, force) {
        if ((!scores || !scores.length) && !force) { overlay.classList.remove('board-on'); return; }
        var html = '';
        if (scores && scores.length) {
          var done = false;
          scores.slice(0, 10).forEach(function (s, i) {
            var key = s.name + '|' + s.score;
            var me = highlightKey && !done && key === highlightKey;
            if (me) done = true;
            html += '<li' + (me ? ' class="me"' : '') + '><span>' + (i + 1) + '. ' + esc(s.name) + '</span><span>' + esc(s.score) + '</span></li>';
          });
        } else {
          html = '<li class="empty"><span>No scores yet — be the first.</span></li>';
        }
        boardList.innerHTML = html;
        overlay.classList.add('board-on');
      }
      saveBtn.addEventListener('click', function () {
        var name = (initialsEl.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
        if (!name) {
          initialsEl.classList.remove('shake'); void initialsEl.offsetWidth; initialsEl.classList.add('shake');
          showToast('Enter initials', colors.coral);
          return;
        }
        try { localStorage.setItem('arcade-initials', name); } catch (e) {}
        saveBtn.disabled = true;
        var label = saveBtn.textContent;
        saveBtn.textContent = 'Saving…';
        fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ game: GAME, name: name, score: score })
        }).then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
          .then(function () {
            overlay.classList.remove('entry-on');
            var key = name + '|' + score;
            return boardCache.then(function (scores) {
              var list = (scores || []).slice();
              list.push({ name: name, score: score });
              list.sort(function (a, b) { return b.score - a.score; });
              list = list.slice(0, 10);
              boardCache = Promise.resolve(list);
              renderBoard(list, key);
            });
          })
          .catch(function () { showToast("Couldn't save — offline?", colors.coral); })
          .then(function () { saveBtn.disabled = false; saveBtn.textContent = label; });
      });
      var viewLeadersBtn = document.getElementById('viewLeaders');
      var boardBackBtn = document.getElementById('boardBack');
      var skipBtn = document.getElementById('skipSave');
      function showLeaders() {
        overlay.classList.add('leaders-on');
        fetchBoard().then(function (scores) { renderBoard(scores, null, true); });
        setTimeout(function(){ boardBackBtn.focus({preventScroll:true}); }, 120);
      }
      function hideLeaders() {
        overlay.classList.remove('leaders-on');
        setTimeout(function(){ viewLeadersBtn.focus({preventScroll:true}); }, 120);
      }
      viewLeadersBtn.addEventListener('click', showLeaders);
      boardBackBtn.addEventListener('click', hideLeaders);
      skipBtn.addEventListener('click', function () {
        overlay.classList.remove('entry-on');
        fetchBoard().then(function (scores) { renderBoard(scores, null); });
      });

      var state = 'ready'; // ready | playing | dying | over
      var W = 0, H = 0, dpr = 1;
      var shipX = 0, shipY = 0, shipVY = 0;
      var holding = false, pressId = null;
      var gates = [];
      var trail = [];
      var dots = [];
      var score = 0, combo = 0;
      var sessionBest = 0;
      var last = 0, idleT = 0, spawnT = 0, dieT = 0;
      var particles = [];
      var flash = 0, shake = 0;
      var muted = false;
      var audio = null;
      var audioOut = null;
      var colors = {};
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var SHIP_R = 9;
      var GATE_W = 54;
      var GRAVITY = 2500, THRUST = 3700, MAX_FALL = 950, MAX_RISE = -780;

      function css(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }
      function refreshColors() {
        colors.paper = css('--paper'); colors.ink = css('--ink'); colors.muted = css('--muted');
        colors.line = css('--line'); colors.cyan = css('--cyan'); colors.coral = css('--coral'); colors.lime = css('--lime');
      }
      refreshColors();
      var schemeMQ = window.matchMedia('(prefers-color-scheme: dark)');
      var PHASES = [
        { name: 'Phase 1',
          light: { cyan: '#087f8c', coral: '#e95d45', lime: '#bbda45' },
          dark:  { cyan: '#4bc7cf', coral: '#ff765f', lime: '#cde85a' } },
        { name: 'Phase 2',
          light: { cyan: '#5a4fcf', coral: '#e8933c', lime: '#2fa37c' },
          dark:  { cyan: '#9a8ff5', coral: '#f2b25c', lime: '#57d6a0' } },
        { name: 'Phase 3',
          light: { cyan: '#9a3412', coral: '#dc2626', lime: '#d97706' },
          dark:  { cyan: '#fb923c', coral: '#f87171', lime: '#fbbf24' } },
        { name: 'Phase 4',
          light: { cyan: '#0e7490', coral: '#2563eb', lime: '#0d9e6f' },
          dark:  { cyan: '#22d3ee', coral: '#60a5fa', lime: '#34d399' } },
        { name: 'Phase 5',
          light: { cyan: '#52525b', coral: '#db2777', lime: '#a3a3a3' },
          dark:  { cyan: '#a1a1aa', coral: '#f472b6', lime: '#d4d4d8' } }
      ];
      var phase = 1;
      function applyPhase(n, silent) {
        phase = n;
        var trio = schemeMQ.matches ? PHASES[n - 1].dark : PHASES[n - 1].light;
        var root = document.documentElement.style;
        root.setProperty('--cyan', trio.cyan);
        root.setProperty('--coral', trio.coral);
        root.setProperty('--lime', trio.lime);
        refreshColors();
        if (n > 1 && !silent) showToast(PHASES[n - 1].name, colors.cyan);
      }
      function checkPhase() {
        var n = Math.min(5, 1 + Math.floor(score / 10));
        if (n !== phase) applyPhase(n);
      }
      schemeMQ.addEventListener('change', function(){ applyPhase(phase, true); });

      function rand(min, max) { return min + Math.random() * (max - min); }
      function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        shipX = Math.round(W * 0.35);
        shipY = clamp(shipY || H * 0.42, SHIP_R + 4, H - SHIP_R - 4);
        initDots();
      }
      function initDots() {
        dots = [];
        for (var i = 0; i < 34; i++) dots.push({ x: Math.random() * W, y: Math.random() * H, s: rand(1, 2.4) });
      }
      window.addEventListener('resize', resize, {passive:true});

      function initAudio(onReady) {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audio) {
          audio = new AudioContext();
          audioOut = audio.createGain();
          audioOut.gain.value = .9;
          audioOut.connect(audio.destination);
        }
        if (audio.state === 'suspended') {
          audio.resume().then(function () { if (onReady) onReady(); }).catch(function () {});
        } else if (onReady) {
          onReady();
        }
      }
      function tone(freq, duration, type, volume, delay) {
        if (muted) return;
        initAudio(function () {
          var when = audio.currentTime + (delay || 0);
          var o = audio.createOscillator();
          var g = audio.createGain();
          o.type = type || 'sine'; o.frequency.setValueAtTime(freq, when);
          g.gain.setValueAtTime(.0001, when);
          g.gain.exponentialRampToValueAtTime(volume || .09, when + .012);
          g.gain.exponentialRampToValueAtTime(.0001, when + duration);
          o.connect(g); g.connect(audioOut);
          o.start(when); o.stop(when + duration + .03);
        });
      }
      function gateChime(n) {
        var semis = Math.min(n, 14) * 1.5;
        var f = 523.25 * Math.pow(2, semis / 12);
        tone(f, .12, 'sine', .1, 0);
        tone(f * 1.5, .16, 'sine', .06, .05);
      }
      function thudSound() {
        tone(120, .25, 'triangle', .16, 0);
        tone(68, .38, 'sine', .15, .02);
      }
      function startChime() {
        tone(440, .09, 'sine', .07, 0);
        tone(660, .13, 'sine', .06, .065);
      }

      function setScore() {
        scoreEl.textContent = String(score);
        checkPhase();
      }
      function showToast(text, color) {
        toast.textContent = text;
        toast.style.color = color || colors.ink;
        toast.classList.remove('pop'); void toast.offsetWidth; toast.classList.add('pop');
      }
      function burst(x, y, color, count) {
        if (reduced) count = Math.min(count, 4);
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2;
          var v = rand(60, 260);
          particles.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, size:rand(2,5), color:color});
        }
      }

      function scrollSpeed() { return Math.min(560, 235 + score * 7); }
      function gapHeight() { return Math.max(118, Math.min(H * 0.30, 230) - score * 2.4); }
      function spawnInterval() { return Math.max(1.05, 1.5 - score * 0.008); }
      function spawnGate() {
        var gh = gapHeight();
        var margin = 84;
        var minY = margin + gh / 2, maxY = H - margin - gh / 2;
        if (minY > maxY) minY = maxY = H / 2;
        var y = rand(minY, maxY);
        if (gates.length) {
          var prev = gates[gates.length - 1].gapY;
          y = clamp(prev + rand(-H * 0.42, H * 0.42), minY, maxY);
        }
        gates.push({ x: W + 60, gapY: y, gapH: gh, passed: false });
      }

      function startGame() {
        initAudio();
        state = 'playing'; score = 0; combo = 0; phase = 0;
        shipY = H * 0.42; shipVY = 0; holding = false; pressId = null;
        gates = []; trail = []; particles = [];
        flash = 0; shake = 0; spawnT = 1.1; dieT = 0;
        setScore();
        overlay.classList.add('hidden'); overlay.classList.remove('over');
        gameEl.classList.add('playing');
        startChime();
        canvas.focus({preventScroll:true});
      }
      function die() {
        if (state !== 'playing') return;
        state = 'dying'; dieT = 0; holding = false; pressId = null; combo = 0;
        burst(shipX, shipY, colors.coral, 30);
        burst(shipX, shipY, colors.lime, 14);
        flash = .5; shake = reduced ? 0 : 13;
        thudSound();
      }
      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        sessionBest = Math.max(sessionBest, score);
        document.getElementById('title').textContent = String(score);
        instructionEl.textContent = score === 0 ? 'The gates got you. Hold to rise, release to fall — thread the ship through the gaps.' : (score < 10 ? 'Nice flight. The gates get faster and tighter.' : 'Smooth flying. One more ride?');
        sessionBestEl.textContent = 'Session best · ' + sessionBest;
        startBtn.textContent = 'Ride again';
        overlay.classList.add('over'); overlay.classList.remove('hidden');
        overlay.classList.remove('entry-on', 'board-on', 'leaders-on');
        boardList.innerHTML = '';
        if (score > 0) {
          try { initialsEl.value = localStorage.getItem('arcade-initials') || ''; } catch (e) {}
          overlay.classList.add('entry-on');
        }
        fetchBoard();
        setTimeout(function(){ startBtn.focus({preventScroll:true}); }, 320);
      }

      function step(dt) {
        var sp = scrollSpeed();
        // ship physics
        shipVY += (holding ? -THRUST : GRAVITY) * dt;
        shipVY = clamp(shipVY, MAX_RISE, MAX_FALL);
        shipY += shipVY * dt;
        // trail
        trail.push({ x: shipX, y: shipY });
        if (trail.length > 44) trail.shift();
        // gates
        for (var i = 0; i < gates.length; i++) gates[i].x -= sp * dt;
        spawnT -= dt;
        if (spawnT <= 0) { spawnGate(); spawnT = spawnInterval(); }
        while (gates.length && gates[0].x < -GATE_W - 60) gates.shift();
        // ceiling / floor
        if (shipY - SHIP_R <= 2 || shipY + SHIP_R >= H - 2) { die(); return; }
        // gate pass + collision
        for (var j = 0; j < gates.length; j++) {
          var g = gates[j];
          if (!g.passed && g.x + GATE_W < shipX - SHIP_R) {
            g.passed = true; score++; combo++;
            gateChime(combo); setScore();
          }
          if (shipX + SHIP_R > g.x && shipX - SHIP_R < g.x + GATE_W) {
            var gt = g.gapY - g.gapH / 2, gb = g.gapY + g.gapH / 2;
            if (shipY - SHIP_R < gt || shipY + SHIP_R > gb) { die(); return; }
          }
        }
        // background drift
        for (var k = 0; k < dots.length; k++) {
          dots[k].x -= sp * 0.35 * dt;
          if (dots[k].x < -10) { dots[k].x = W + 10; dots[k].y = Math.random() * H; }
        }
      }

      function rr(x, y, w, h, r) {
        if (w <= 0 || h <= 0) return;
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function drawGates() {
        for (var i = 0; i < gates.length; i++) {
          var g = gates[i];
          var gt = g.gapY - g.gapH / 2, gb = g.gapY + g.gapH / 2;
          ctx.globalAlpha = .92;
          ctx.fillStyle = colors.cyan;
          rr(g.x, -10, GATE_W, gt + 10, 7); ctx.fill();
          rr(g.x, gb, GATE_W, H - gb + 10, 7); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.save();
          ctx.shadowColor = colors.lime; ctx.shadowBlur = 14;
          ctx.fillStyle = colors.lime;
          rr(g.x - 3, gt - 4, GATE_W + 6, 7, 3.5); ctx.fill();
          rr(g.x - 3, gb - 3, GATE_W + 6, 7, 3.5); ctx.fill();
          ctx.restore();
        }
      }
      function drawTrail() {
        var n = trail.length;
        if (n < 2) return;
        ctx.save();
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        for (var pass = 0; pass < 2; pass++) {
          for (var i = 1; i < n; i++) {
            var f = i / n;
            ctx.strokeStyle = pass === 0 ? colors.lime : colors.cyan;
            ctx.globalAlpha = (pass === 0 ? .30 : .85) * f;
            ctx.lineWidth = (pass === 0 ? 13 : 4.5) * (0.25 + 0.75 * f);
            ctx.beginPath();
            ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
            ctx.lineTo(trail[i].x, trail[i].y);
            ctx.stroke();
          }
        }
        ctx.restore();
      }
      function drawShip() {
        ctx.save();
        ctx.shadowColor = colors.cyan; ctx.shadowBlur = 20;
        ctx.fillStyle = colors.cyan;
        ctx.beginPath(); ctx.arc(shipX, shipY, SHIP_R, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.85)';
        ctx.beginPath(); ctx.arc(shipX - 2.5, shipY - 2.5, 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        // background dots
        ctx.fillStyle = colors.line;
        for (var i = 0; i < dots.length; i++) {
          ctx.beginPath(); ctx.arc(dots[i].x, dots[i].y, dots[i].s, 0, Math.PI * 2); ctx.fill();
        }

        // danger lines at ceiling and floor
        ctx.globalAlpha = .45;
        ctx.fillStyle = colors.coral;
        ctx.fillRect(0, 0, W, 2);
        ctx.fillRect(0, H - 2, W, 2);
        ctx.globalAlpha = 1;

        drawGates();
        if (state === 'playing' || state === 'ready') {
          drawTrail();
          drawShip();
        }

        // particles
        ctx.save();
        for (var p = 0; p < particles.length; p++) {
          var pt = particles[p];
          ctx.globalAlpha = Math.max(0, pt.life);
          ctx.fillStyle = pt.color;
          ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * pt.life, 0, Math.PI * 2); ctx.fill();
        }
        if (flash) { ctx.globalAlpha = flash * .18; ctx.fillStyle = colors.lime; ctx.fillRect(0, 0, W, H); }
        ctx.restore();

        ctx.restore();
      }
      function updateEffects(dt) {
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .975; p.vy *= .975; p.life -= dt * 1.9;
          if (p.life <= 0) particles.splice(i, 1);
        }
        flash = Math.max(0, flash - dt * 1.7);
        shake = Math.max(0, shake - dt * 45);
      }

      function press(e) {
        if (state !== 'playing' || pressId !== null) return;
        e.preventDefault();
        initAudio();
        pressId = e.pointerId;
        holding = true;
      }
      function release(e) {
        if (pressId !== null && e && e.pointerId !== undefined && e.pointerId !== pressId) return;
        pressId = null;
        holding = false;
      }
      canvas.addEventListener('pointerdown', press);
      window.addEventListener('pointerup', release);
      window.addEventListener('pointercancel', release);
      canvas.addEventListener('pointerleave', function () { pressId = null; holding = false; });
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('keydown', function (e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && state === 'playing' && !e.repeat) {
          e.preventDefault(); initAudio(); holding = true;
        }
      });
      document.addEventListener('keyup', function (e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') holding = false;
      });

      startBtn.addEventListener('click', startGame);
      if (window.location.hash === '#leaders') { showLeaders(); }
      soundBtn.addEventListener('click', function(e){
        e.stopPropagation(); muted = !muted;
        soundBtn.setAttribute('aria-pressed', String(!muted));
        soundBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Mute sound');
        if (!muted) { initAudio(); tone(620,.1,'sine',.04,0); }
      });
      document.addEventListener('visibilitychange', function(){ last = performance.now(); });
      document.addEventListener('pointerdown', function(){ initAudio(); }, {once:true});

      function loop(t) {
        var dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
        if (state === 'playing') {
          step(dt);
        } else if (state === 'dying') {
          dieT += dt;
          if (dieT > 0.8) endGame();
        } else if (state === 'ready') {
          idleT += dt;
          shipY = H * 0.42 + Math.sin(idleT * 1.6) * 22;
          trail.push({ x: shipX, y: shipY });
          if (trail.length > 44) trail.shift();
          for (var i = 0; i < dots.length; i++) {
            dots[i].x -= 26 * dt;
            if (dots[i].x < -10) { dots[i].x = W + 10; dots[i].y = Math.random() * H; }
          }
        }
        updateEffects(dt);
        draw(t);
        requestAnimationFrame(loop);
      }
      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
