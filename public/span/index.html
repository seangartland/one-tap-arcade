<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070f'/%3E%3Cpath d='M6 30 V12 M11 30 V12' stroke='%2301cdfe' stroke-width='2' opacity='.6'/%3E%3Cpath d='M6 16 H22' stroke='%23ffb300' stroke-width='2'/%3E%3Crect x='24' y='12' width='5' height='6' fill='%23ffb300'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070f" />
  <title>Span - grow the beam and cross the gap</title>
  <link rel="stylesheet" href="/shared/arcade.css" />
  <style>
    canvas { touch-action: none; }
    #score { color: #ffd166; text-shadow: 0 0 14px rgba(255,209,102,.5); }
    .mark:has(svg) svg { filter: none; }
  </style>
</head>
<body class="game">
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Grow a beam between towers. Hold to extend it, release to tip it over the gap, then land on the next pillar."></canvas>
    <div class="hud hud-center" aria-live="polite">
      <div class="score-wrap">
        <span class="score" id="score"></span>
      </div>
    </div>
    <div class="hint">Hold to grow · release to tip</div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 120 68" aria-hidden="true"><defs><radialGradient id="spanMarkBg" cx=".45" cy=".32" r=".82"><stop offset="0" stop-color="#0a1634"/><stop offset=".58" stop-color="#050a1a"/><stop offset="1" stop-color="#020308"/></radialGradient><linearGradient id="spanMarkVoid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050a1a" stop-opacity="0"/><stop offset="1" stop-color="#ff2bd6" stop-opacity=".16"/></linearGradient></defs><rect width="120" height="68" fill="url(#spanMarkBg)"/><g stroke="#3c86ff" stroke-width=".45" opacity=".14"><path d="M0 14H120M0 34H120M0 54H120M20 0V68M60 0V68M100 0V68"/></g><rect x="34" y="27" width="52" height="29" fill="url(#spanMarkVoid)"/><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M37 50 C43 37 48 54 54 43 S66 35 72 44 S81 52 87 42" stroke="#ff2bd6" stroke-width="8" opacity=".07"/><path d="M37 50 C43 37 48 54 54 43 S66 35 72 44 S81 52 87 42" stroke="#ff2bd6" stroke-width="4" opacity=".2"/><path d="M37 50 C43 37 48 54 54 43 S66 35 72 44 S81 52 87 42" stroke="#ff7ae0" stroke-width="1.4" opacity=".9"/></g><g fill="#ff2bd6"><rect x="47" y="28" width="3" height="3" opacity=".22"/><rect x="62" y="25" width="2.5" height="2.5" opacity=".7"/><rect x="77" y="31" width="3" height="3" opacity=".5"/></g><g fill="#040814"><path d="M5 50H37V65H5Z"/><path d="M83 50H115V65H83Z"/></g><g fill="none" stroke="#01cdfe" stroke-linecap="round"><path d="M5 50H37M83 50H115" stroke-width="10" opacity=".07"/><path d="M5 50H37M83 50H115" stroke-width="5" opacity=".2"/><path d="M5 50H37M83 50H115" stroke="#aaf5ff" stroke-width="1.6"/></g><g fill="none" stroke="#01cdfe" stroke-linecap="round" stroke-linejoin="round"><path d="M37 14Q61-2 87 50" stroke="#ffd166" stroke-width="6" stroke-dasharray="5 6" opacity=".07"/><path d="M37 14Q61-2 87 50" stroke="#ffd166" stroke-width="3" stroke-dasharray="5 6" opacity=".2"/><path d="M37 14Q61-2 87 50" stroke="#ffd166" stroke-width="1.3" stroke-dasharray="5 6" opacity=".95"/></g><g fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M37 50V14" stroke="#01cdfe" stroke-width="8" opacity=".07"/><path d="M37 50V14" stroke="#01cdfe" stroke-width="4" opacity=".2"/><path d="M37 50V14" stroke="#aaf5ff" stroke-width="2.4"/><path d="M37 50V14" stroke="#ffffff" stroke-width="1.4"/></g><circle cx="37" cy="14" r="5" fill="#ff2bd6" opacity=".1"/><circle cx="37" cy="14" r="2.2" fill="#ffd166" opacity=".9"/><circle cx="37" cy="14" r="1" fill="#ffffff"/><g fill="none" stroke="#ffd166" stroke-linecap="round" stroke-linejoin="round"><path d="M31 10L37 4L43 10M31 5L37-1L43 5" stroke-width="6" opacity=".07"/><path d="M31 10L37 4L43 10M31 5L37-1L43 5" stroke-width="3" opacity=".2"/><path d="M31 10L37 4L43 10M31 5L37-1L43 5" stroke-width="1.4"/></g><g><rect x="87" y="46" width="22" height="4" rx="2" fill="#ffd166" opacity=".12"/><rect x="87" y="46" width="22" height="4" rx="2" fill="none" stroke="#ffd166" stroke-width="6" opacity=".07"/><rect x="87" y="46" width="22" height="4" rx="2" fill="none" stroke="#ffd166" stroke-width="2.6" opacity=".2"/><rect x="87" y="46" width="22" height="4" rx="2" fill="none" stroke="#ffe9bd" stroke-width="1.4"/><circle cx="98" cy="44" r="3.5" fill="#ffd166" opacity=".25"/><circle cx="98" cy="44" r="1.8" fill="#ffd166"/><circle cx="98" cy="44" r=".8" fill="#ffffff"/></g><g fill="#08101f" stroke="#01cdfe" stroke-linecap="round" stroke-linejoin="round"><path d="M24 40H32V50H24Z" stroke-width="6" opacity=".16"/><path d="M24 40H32V50H24Z" stroke="#aaf5ff" stroke-width="1.4"/><rect x="26" y="43" width="4" height="3" fill="#aaf5ff" stroke="none"/></g></svg></div>
    </section>
  </main>

  <script>
    window.ARCADE = {
      game: 'span',
      title: 'Span.',
      tagline: 'Hold to grow the beam. Release to tip it over the gap. Land on the next pillar.',
      startLabel: 'Start growing',
      restartLabel: 'Run it back',
      resultLabel: 'Run complete',
      boardHeading: 'Span · Global leaders'
    };
  </script>
  <script src="/shared/arcade.js"></script>

  <script>
    'use strict';
    const cv=document.getElementById('canvas'),cx=cv.getContext('2d');
    const gameEl=Arcade.gameEl,scoreEl=document.getElementById('score');
    const tone=Arcade.tone;
    const TWO=Math.PI*2;
    const rand=Arcade.rand;
    const C_CYAN=[1,205,254],C_ICE=[170,245,255],C_AMB=[255,209,102],C_MAG=[255,43,214],C_WHT=[255,255,255];
    function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
    function mixc(a,b,t){return [a[0]+(b[0]-a[0])*t|0,a[1]+(b[1]-a[1])*t|0,a[2]+(b[2]-a[2])*t|0];}
    let W=0,H=0,GY=0,bgGrad=null,vigGrad=null;
    function resize(){
      const d=Math.min(window.devicePixelRatio||1,2);
      W=innerWidth;H=innerHeight;
      cv.width=W*d;cv.height=H*d;
      cx.setTransform(d,0,0,d,0,0);GY=H*.64;
      bgGrad=cx.createRadialGradient(W/2,H*.38,0,W/2,H*.38,Math.hypot(W,H)*.78);
      bgGrad.addColorStop(0,'#0a1634');bgGrad.addColorStop(.55,'#050a1a');bgGrad.addColorStop(1,'#020308');
      vigGrad=cx.createRadialGradient(W/2,H/2,Math.min(W,H)*.34,W/2,H/2,Math.hypot(W,H)*.66);
      vigGrad.addColorStop(0,'rgba(0,0,0,0)');vigGrad.addColorStop(1,'rgba(0,0,0,.64)');
    }
    addEventListener('resize',resize);
    // grow hum (the one continuous sound with no tone() equivalent)
    let hum=null;
    function humOn(){
      if(Arcade.isMuted())return;
      const n=Arcade.audioNodes();if(!n)return;
      const o=n.ctx.createOscillator(),g=n.ctx.createGain();
      o.type='triangle';o.frequency.value=180;g.gain.setValueAtTime(0,n.ctx.currentTime);g.gain.linearRampToValueAtTime(.035,n.ctx.currentTime+.04);
      o.connect(g);g.connect(n.out);o.start();hum={o,g};
    }
    function humSet(f){
      if(!hum)return;
      const n=Arcade.audioNodes();if(!n)return;
      hum.o.frequency.setTargetAtTime(f,n.ctx.currentTime,.02);
    }
    function humOff(){
      if(!hum)return;
      const n=Arcade.audioNodes();if(!n){hum=null;return;}
      const t=n.ctx.currentTime;
      hum.g.gain.cancelScheduledValues(t);hum.g.gain.setValueAtTime(hum.g.gain.value,t);hum.g.gain.linearRampToValueAtTime(0,t+.05);
      hum.o.stop(t+.07);hum=null;
    }
    // state
    let pillars=[],beams=[],beam=null,cur=0,cam=0,camT=0,st='idle',score=0;
    let px=0,py=0,pvy=0,target=0,fail=false,failT=0,shake=0,pops=[],bob=0,stars=[],bonus=0,texts=[];
    function newPillar(){
      const p=pillars[pillars.length-1],hard=Math.min(score/10,1);
      const w=rand(62-hard*26,110-hard*40);
      let gap=rand(W*.08+hard*W*.06,W*.36+hard*W*.12);
      gap=Math.min(gap,W*.66-w);
      pillars.push({x:p.x+p.w+gap,w});
    }
    function reset(){
      pillars=[{x:0,w:W*.3}];beams=[];beam=null;cur=0;score=0;fail=false;failT=0;pops=[];bonus=0;texts=[];
      newPillar();
      cam=pillars[0].x+pillars[0].w-W*.3;camT=cam;
      px=pillars[0].x+pillars[0].w-12;py=0;pvy=0;st='ready';
      if(!stars.length)for(let i=0;i<60;i++)stars.push({x:rand(0,1),y:rand(0,1),s:rand(.5,1.6),d:rand(.1,.4)});
    }
    function checkPhase(){
      Arcade.setPhase(Math.min(5,1+Math.floor(score/8)));
    }
    function startGame(){
      Arcade.startFlow();humOff();Arcade.resetPhase();reset();gameEl.classList.add('playing');
      scoreEl.textContent=score;
      checkPhase();
      tone(440,.12,'sine',.04,0);
      cv.focus({preventScroll:true});
    }
    function end(){
      st='over';humOff();gameEl.classList.remove('playing');
      Arcade.gameOver({
        score:score,
        title:String(score),
        instruction:score===0?'The gap won this time. Release the beam right above the pillar.':(score<8?'Nice crossing. The pillars spread apart fast.':'Clean strides. Keep the beam true?'),
        restartLabel:'Run it back'
      });
    }
    ARCADE.onStart=startGame;
    ARCADE.onMute=function(m){if(m)humOff();};
    ARCADE.onVisibility=function(){last=performance.now();};
    function press(){
      if(st!=='ready')return;
      Arcade.initAudio();
      const p=pillars[cur];beam={x:p.x+p.w,len:0,ang:-Math.PI/2,av:0};st='grow';humOn();
    }
    function release(){
      if(st!=='grow')return;st='tip';humOff();tone(300,.06,'triangle',.03,0);
    }
    function update(dt){
      bob+=dt;
      cam+=(camT-cam)*Math.min(1,dt*9);
      if(st==='grow'){
        beam.len=Math.min(beam.len+1.6*(260+beam.len*.5)*dt,W*1.1);humSet(170+beam.len*2.2);
      }else if(st==='tip'){
        beam.av+=24*dt;beam.ang+=beam.av*dt;
        if(beam.ang>=0){
          beam.ang=0;shake=5;tone(90,.16,'sine',.09,0);
          const n=pillars[cur+1],tip=beam.x+beam.len,tol=12,edgeOff=Math.abs(tip-n.x);
          fail=!(tip>=n.x-tol&&tip<=n.x+n.w+tol);
          bonus=fail?0:(edgeOff<=6?3:edgeOff<=14?2:0);
          target=fail?tip:n.x+n.w-12;
          st='walk';
        }
      }else if(st==='walk'){
        px=Math.min(target,px+340*dt);
        if(px>=target){
          if(fail){st='drop';failT=0;pvy=0;beam.av=2;tone(260,.5,'sawtooth',.05,0);}
          else{
            const n=pillars[cur+1];
            score+=1+bonus;
            if(bonus){pops.push({x:n.x,r:4,a:1});texts.push({x:n.x,y:GY,t:0,g:bonus});tone(1320,.16,'triangle',.05,.06);}
            bonus=0;
            cur++;beams.push(beam);beam=null;
            const m=pillars[cur];
            pops.push({x:m.x+m.w/2,r:4,a:1});
            tone(660,.08,'triangle',.05,0);tone(990,.12,'triangle',.045,.07);
            newPillar();camT=m.x+m.w-W*.3;st='pan';
            checkPhase();
          }
        }
      }else if(st==='pan'){
        if(Math.abs(camT-cam)<1.5){cam=camT;st='ready';}
      }else if(st==='drop'){
        failT+=dt;pvy+=1800*dt;py+=pvy*dt;
        const n=pillars[cur+1];
        if(beam.x+beam.len<n.x&&beam.ang<Math.PI/2){beam.av+=18*dt;beam.ang=Math.min(Math.PI/2,beam.ang+beam.av*dt);}
        if(failT>.85)end();
      }
      for(const p of pops){p.r+=180*dt;p.a-=dt*2;}
      pops=pops.filter(p=>p.a>0);
      for(const t of texts)t.t+=dt;
      texts=texts.filter(t=>t.t<1);
    }
    function stackPath(path,col,w,core,alpha){
      const a=alpha==null?1:Math.max(0,alpha),coreCol=core||mixc(col,C_WHT,.3);
      cx.lineCap='round';cx.lineJoin='round';
      cx.strokeStyle=rgba(col,.07*a);cx.lineWidth=w*6;cx.stroke(path);
      cx.strokeStyle=rgba(col,.2*a);cx.lineWidth=w*2.6;cx.stroke(path);
      cx.strokeStyle=rgba(coreCol,.98*a);cx.lineWidth=Math.max(1.3,w);cx.stroke(path);
    }
    function linePath(x0,y0,x1,y1){
      const path=new Path2D();path.moveTo(x0,y0);path.lineTo(x1,y1);return path;
    }
    function glowLine(x0,y0,x1,y1,col,w,core,alpha){
      stackPath(linePath(x0,y0,x1,y1),col,w,core,alpha);
    }
    function drawGrid(){
      const sp=56,minor=new Path2D(),major=new Path2D();
      for(let i=-1;i<=Math.ceil(W/sp)+1;i++){
        const x=i*sp;
        if(i%5===0){major.moveTo(x,0);major.lineTo(x,H);}else{minor.moveTo(x,0);minor.lineTo(x,H);}
      }
      for(let j=-1;j<=Math.ceil(H/sp)+1;j++){
        const y=j*sp;
        if(j%5===0){major.moveTo(0,y);major.lineTo(W,y);}else{minor.moveTo(0,y);minor.lineTo(W,y);}
      }
      cx.lineWidth=1;cx.strokeStyle='rgba(40,130,255,.065)';cx.stroke(minor);
      cx.lineWidth=1.4;cx.strokeStyle='rgba(90,170,255,.13)';cx.stroke(major);
    }
    function drawStars(){
      for(const s of stars){
        const x=((s.x*W-cam*s.d)%W+W)%W,y=s.y*GY*.92,a=.12+s.d*.3;
        cx.globalAlpha=a;cx.fillStyle=rgba(C_ICE,1);cx.fillRect(x,y,s.s,s.s);
      }
      cx.globalAlpha=1;
    }
    function drawPlatforms(){
      for(let i=0;i<pillars.length;i++){
        const p=pillars[i];
        if(p.x-cam>W+20||p.x+p.w-cam<-20)continue;
        cx.fillStyle='#040814';cx.fillRect(p.x,GY,p.w,H-GY);
        cx.fillStyle='rgba(8,16,31,.7)';cx.fillRect(p.x+1,GY+1,p.w-2,H-GY-1);
        glowLine(p.x,GY,p.x+p.w,GY,C_CYAN,1.5,C_ICE);
        cx.strokeStyle=rgba(C_CYAN,.2);cx.lineWidth=1;
        cx.beginPath();cx.moveTo(p.x+.5,GY);cx.lineTo(p.x+.5,H);cx.moveTo(p.x+p.w-.5,GY);cx.lineTo(p.x+p.w-.5,H);cx.stroke();
      }
    }
    function drawTarget(){
      const n=pillars[cur+1];
      if(!n)return;
      const x=n.x+n.w-12;
      const pulse=1+.1*Math.sin(bob*5);
      cx.fillStyle=rgba(C_AMB,.12*pulse);cx.fillRect(x-10,GY-2,20,4);
      glowLine(x-10,GY,x+10,GY,C_AMB,1.4,C_AMB,.95);
      const dot=new Path2D();dot.arc(x,GY,5.5*pulse,0,TWO);
      stackPath(dot,C_AMB,1.4,mixc(C_AMB,C_WHT,.35));
      cx.fillStyle=rgba(C_WHT,1);cx.beginPath();cx.arc(x,GY,1.5,0,TWO);cx.fill();
    }
    function drawChevrons(x,y){
      for(let i=0;i<3;i++){
        const cy=y-9-i*5,path=new Path2D();
        path.moveTo(x-6,cy+3);path.lineTo(x,cy-3);path.lineTo(x+6,cy+3);
        stackPath(path,C_AMB,1.4,C_AMB,.9-i*.12);
      }
    }
    function drawHotPoint(x,y,col,scale){
      const r=3*scale;
      cx.fillStyle=rgba(col,.07);cx.beginPath();cx.arc(x,y,r*2.8,0,TWO);cx.fill();
      cx.fillStyle=rgba(col,.2);cx.beginPath();cx.arc(x,y,r*1.7,0,TWO);cx.fill();
      cx.fillStyle=rgba(mixc(col,C_WHT,.55),1);cx.beginPath();cx.arc(x,y,r,0,TWO);cx.fill();
      cx.fillStyle=rgba(C_WHT,1);cx.beginPath();cx.arc(x-.6,y-.6,Math.max(1,r*.42),0,TWO);cx.fill();
    }
    function drawBeams(){
      for(const b of beams){
        const ex=b.x+Math.cos(b.ang)*b.len,ey=GY+Math.sin(b.ang)*b.len;
        glowLine(b.x,GY,ex,ey,C_CYAN,1.5,C_WHT,.9);
        drawHotPoint(ex,ey,C_CYAN,.7);
      }
    }
    function drawActiveBeam(){
      if(!beam)return;
      const threat=st==='drop',ex=beam.x+Math.cos(beam.ang)*beam.len,ey=GY+Math.sin(beam.ang)*beam.len,col=threat?C_MAG:C_CYAN;
      glowLine(beam.x,GY,ex,ey,col,1.6,threat?mixc(C_MAG,C_WHT,.35):C_WHT);
      drawHotPoint(ex,ey,col,1.1);
      if(!threat)drawChevrons(ex,ey);
    }
    function drawPops(){
      for(const p of pops){
        const path=new Path2D();path.arc(p.x,GY,p.r,Math.PI,TWO);
        stackPath(path,C_AMB,1.4,mixc(C_AMB,C_WHT,.35),p.a);
      }
    }
    function drawTexts(){
      for(const t of texts){
        const e=1-(1-t.t)*(1-t.t),a=t.t<.6?1:1-(t.t-.6)/.4,big=t.g===3,label='PERFECT +'+(big?4:3);
        cx.save();cx.globalAlpha=a;cx.textAlign='center';cx.textBaseline='middle';
        cx.font='700 '+(big?26:20)+'px "DM Mono",ui-monospace,Menlo,monospace';
        cx.strokeStyle=rgba(C_AMB,.08);cx.lineWidth=big?10:8;cx.strokeText(label,t.x,t.y-54-e*36);
        cx.fillStyle=rgba(mixc(C_AMB,C_WHT,.5),1);cx.fillText(label,t.x,t.y-54-e*36);
        cx.restore();
      }
    }
    function drawRunner(){
      if(st==='idle')return;
      const walking=st==='walk',hop=walking?Math.abs(Math.sin(bob*18))*3:0,x=px,y=GY+py-hop,sz=14,threat=st==='drop',col=threat?C_MAG:C_CYAN;
      if(walking){
        for(let pass=0;pass<3;pass++){
          cx.globalAlpha=[.06,.15,.45][pass];cx.strokeStyle=rgba(pass===2?mixc(col,C_WHT,.3):col,1);cx.lineWidth=[9,4,1.5][pass];
          cx.beginPath();cx.moveTo(x-18-pass*8,y+2+pass*2);cx.lineTo(x-3,y);cx.stroke();
        }
        cx.globalAlpha=1;
      }
      cx.fillStyle=rgba(col,.07);cx.fillRect(x-sz*.95,y-sz-10,sz*1.9,sz+10);
      cx.fillStyle=rgba(col,.2);cx.fillRect(x-sz*.7,y-sz-7,sz*1.4,sz+7);
      const body=new Path2D();body.rect(x-sz/2,y-sz-4,sz,sz+4);
      cx.fillStyle='#08101f';cx.fillRect(x-sz/2,y-sz-4,sz,sz+4);
      stackPath(body,col,1.4,threat?mixc(col,C_WHT,.25):C_ICE);
      cx.fillStyle=rgba(threat?mixc(col,C_WHT,.25):C_ICE,.95);cx.fillRect(x-sz/2+1,y-sz-3,sz-2,sz+2);
      cx.fillStyle=rgba(C_WHT,1);cx.fillRect(x+1,y-sz+1,4,3);
    }
    function draw(){
      const sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake)*.5:0;shake=Math.max(0,shake*.85-.1);
      cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.setLineDash([]);cx.lineCap='round';cx.lineJoin='round';
      cx.fillStyle=bgGrad;cx.fillRect(0,0,W,H);
      drawGrid();drawStars();
      cx.save();cx.translate(-cam+sx,sy);
      drawPlatforms();drawBeams();drawTarget();drawActiveBeam();drawPops();drawTexts();drawRunner();
      cx.restore();
      cx.globalAlpha=1;cx.fillStyle=vigGrad;cx.fillRect(0,0,W,H);
    }
    let last=performance.now();
    function frame(t){
      const dt=Math.min((t-last)/1000,.05);last=t;
      update(dt);draw();
      scoreEl.textContent=st==='idle'?'':score;
      requestAnimationFrame(frame);
    }
    cv.addEventListener('touchstart',e=>{e.preventDefault();press();},{passive:false});
    cv.addEventListener('touchend',e=>{e.preventDefault();release();},{passive:false});
    cv.addEventListener('touchcancel',e=>{e.preventDefault();release();},{passive:false});
    cv.addEventListener('mousedown',e=>{e.preventDefault();press();});
    addEventListener('mouseup',release);
    cv.addEventListener('contextmenu',e=>e.preventDefault());
    resize();reset();st='idle';
    requestAnimationFrame(frame);
  </script>
</body>
</html>
