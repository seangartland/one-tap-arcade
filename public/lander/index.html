<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101828'/%3E%3Cpath d='M16 7 L23 19 L9 19 Z' fill='%23f5b942'/%3E%3Crect x='7' y='21.5' width='18' height='2.5' rx='1.25' fill='%239aa7bd'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070f" />
  <title>Lander - a one-button lunar lander</title>
  <link rel="stylesheet" href="/shared/arcade.css" />
  <style>
    canvas { touch-action: none; }
  </style>
</head>
<body class="game">
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Lunar lander game. Press and hold anywhere, or hold space, to fire the thruster. Land softly on the glowing pad."></canvas>
    <div class="hud" aria-live="polite">
      <div class="score-wrap">
        <span class="score" id="score">0</span>
        <span class="multiplier" id="multiplier">R1</span>
      </div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="hint">Hold anywhere · Space</div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="card">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 120 68" aria-hidden="true"><path d="M8 58 H44 L52 50 H68 L76 58 H112" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".6"/><g fill="currentColor"><rect x="52" y="26" width="16" height="11" rx="3"/><circle cx="60" cy="21" r="4"/></g><path d="M54 37 L48 48 M66 37 L72 48" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></svg></div>
        <div class="result-label">Crashed</div>
        <h1 id="title">Lander.</h1>
        <p class="instruction" id="instruction">Hold to slow your fall. Touch down soft on the glowing pad.</p>
        <p class="session-best" id="sessionBest">Session best · 0</p>
        <p class="run-pct" id="runPct" hidden></p>
        <div id="entry">
          <div id="claimWrap">
            <label for="username">Claim your username</label>
            <div class="entry-row">
              <input id="username" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your username" />
              <button id="claimBtn" class="claim" type="button">Claim</button>
            </div>
          </div>
          <button class="linklike" id="skipSave" type="button">Skip</button>
        </div>
        <div id="board" aria-live="polite">
          <h2>Lander · Global leaders</h2>
          <ol id="boardList"></ol>
          <button class="linklike" id="boardBack" type="button">Back</button>
        </div>
        <button class="primary" id="start">Start descent</button>
        <div class="card-foot"><button class="linklike" id="viewLeaders" type="button">Leaderboard</button></div>
      </div>
    </section>

    <button class="sound" id="sound" type="button" aria-label="Mute sound" aria-pressed="true">
      <svg class="on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z" fill="currentColor"/><path d="M17 9.2c.7.7 1 1.6 1 2.8s-.3 2.1-1 2.8M19.5 6.8c1.4 1.4 2.1 3.1 2.1 5.2s-.7 3.8-2.1 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z" fill="currentColor"/><path d="m17.5 9 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <a class="home" href="../">Arcade</a>
    <div class="grain" aria-hidden="true"></div>
  </main>

  <script>
    window.ARCADE = {
      game: 'lander',
      tagline: 'Hold to slow your fall. Touch down soft on the glowing pad.',
      startLabel: 'Start descent',
      restartLabel: 'Fly again',
      resultLabel: 'Crashed',
      boardHeading: 'Lander · Global leaders'
    };
  </script>
  <script src="/shared/arcade.js"></script>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = Arcade.gameEl;
      var scoreEl = document.getElementById('score');
      var multEl = document.getElementById('multiplier');
      var tone = Arcade.tone;
      var showToast = Arcade.showToast;
      var colors = Arcade.colors;


      var state = 'ready';
      var W = 0, H = 0, dpr = 1;
      var score = 0;
      var round = 1;
      var impactV = 0;
      var last = 0;
      var particles = [];
      var rings = [];
      var flash = 0;
      var shake = 0;
      var thrustOsc = null;
      var thrustGain = null;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var GRAVITY0 = 300, THRUST = 780, SAFE_V = 105, MAX_V = 420;
      var gravity = GRAVITY0;
      var thrusting = false;
      var lander = { x: 0, y: 0, vy: 0 };
      var pad = { x: 0, w: 120, dir: 1, speed: 130 };
      var terrainY = 0;
      var stars = [];
      var PAD_H = 10;
      function padTopY() { return terrainY - PAD_H; }
      function surfaceY(x) {
        return Math.abs(x - pad.x) <= pad.w / 2 - 6 ? padTopY() : terrainY;
      }

      var schemeMQ = { matches: true, addEventListener: function () {} }; // Tron theme: dark-only
      var PHASES = [
        { name: 'Daybreak',
          light: { cyan: '#087f8c', coral: '#e95d45', lime: '#bbda45' },
          dark:  { cyan: '#4bc7cf', coral: '#ff765f', lime: '#cde85a' } },
        { name: 'Dusk',
          light: { cyan: '#5a4fcf', coral: '#e8933c', lime: '#2fa37c' },
          dark:  { cyan: '#9a8ff5', coral: '#f2b25c', lime: '#57d6a0' } },
        { name: 'Ember',
          light: { cyan: '#9a3412', coral: '#dc2626', lime: '#d97706' },
          dark:  { cyan: '#fb923c', coral: '#f87171', lime: '#fbbf24' } },
        { name: 'Tide',
          light: { cyan: '#0e7490', coral: '#2563eb', lime: '#0d9e6f' },
          dark:  { cyan: '#22d3ee', coral: '#60a5fa', lime: '#34d399' } },
        { name: 'Noir',
          light: { cyan: '#52525b', coral: '#db2777', lime: '#a3a3a3' },
          dark:  { cyan: '#a1a1aa', coral: '#f472b6', lime: '#d4d4d8' } }
      ];
      var phase = 1;
      function applyPhase(n, silent) {
        phase = n;
        var trio = schemeMQ.matches ? PHASES[n - 1].dark : PHASES[n - 1].light;
        var root = document.documentElement.style;
        root.setProperty('--cyan', trio.cyan);
        root.setProperty('--coral', trio.coral);
        root.setProperty('--lime', trio.lime);
        Arcade.refreshColors();
        if (n > 1 && !silent) showToast(PHASES[n - 1].name, colors.cyan);
      }
      function checkPhase() {
        var n = Math.min(5, 1 + Math.floor((round - 1) / 2));
        if (n !== phase) { applyPhase(n, true); return true; }
        return false;
      }
      schemeMQ.addEventListener('change', function(){ applyPhase(phase, true); });

      function rand(min, max) { return min + Math.random() * (max - min); }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        terrainY = H - Math.max(96, H * 0.15);
        stars = [];
        var n = Math.round(Math.min(130, W * H / 9000));
        for (var i = 0; i < n; i++) {
          stars.push({ x: Math.random(), y: Math.random() * 0.78, sz: rand(1, 2.4), a: rand(.25, .8), ph: rand(0, 6.28), layer: rand(.2, 1) });
        }
        pad.x = Math.min(Math.max(pad.x || W / 2, pad.w / 2 + 12), W - pad.w / 2 - 12);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();

      function thrustStart() {
        var a = Arcade.audioNodes();
        if (Arcade.isMuted() || thrustOsc || !a) return;
        try {
          var o = a.ctx.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = 52;
          var lfo = a.ctx.createOscillator();
          lfo.type = 'sine'; lfo.frequency.value = 14;
          var lfoG = a.ctx.createGain(); lfoG.gain.value = 22;
          lfo.connect(lfoG); lfoG.connect(o.frequency);
          var g = a.ctx.createGain();
          g.gain.value = .0001;
          g.gain.exponentialRampToValueAtTime(.075, a.ctx.currentTime + .06);
          o.connect(g); g.connect(a.out);
          o.start(); lfo.start();
          o._lfo = lfo;
          thrustOsc = o; thrustGain = g;
        } catch (e) {}
      }
      function thrustStop() {
        var a = Arcade.audioNodes();
        if (!thrustOsc || !a) { thrustOsc = null; thrustGain = null; return; }
        try {
          var o = thrustOsc, l = thrustOsc._lfo, g = thrustGain;
          g.gain.cancelScheduledValues(a.ctx.currentTime);
          g.gain.setValueAtTime(Math.max(.0001, g.gain.value), a.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(.0001, a.ctx.currentTime + .09);
          setTimeout(function () { try { o.stop(); l.stop(); } catch (e) {} }, 140);
        } catch (e) {}
        thrustOsc = null; thrustGain = null;
      }
      function touchdownSound() {
        tone(520, .14, 'sine', .11, 0);
        tone(780, .18, 'sine', .09, .07);
        tone(1040, .22, 'sine', .06, .15);
      }
      function crashSound() {
        if (Arcade.isMuted()) return;
        Arcade.initAudio(function () {
          var a = Arcade.audioNodes(); if (!a) return;
          var when = a.ctx.currentTime;
          var o = a.ctx.createOscillator();
          o.type = 'triangle';
          o.frequency.setValueAtTime(170, when);
          o.frequency.exponentialRampToValueAtTime(36, when + .5);
          var g = a.ctx.createGain();
          g.gain.setValueAtTime(.0001, when);
          g.gain.exponentialRampToValueAtTime(.17, when + .02);
          g.gain.exponentialRampToValueAtTime(.0001, when + .62);
          o.connect(g); g.connect(a.out);
          o.start(when); o.stop(when + .66);
          tone(88, .4, 'sine', .1, .05);
        });
      }

      function setScore() { scoreEl.textContent = String(score); }
      function setRound() {
        multEl.textContent = 'R' + round;
        multEl.classList.add('show');
      }
      function burst(x, y, color, count, spd) {
        if (reduced) count = Math.min(count, 4);
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2;
          var v = rand(40, spd || 170);
          particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, size: rand(2, 5), color: color });
        }
      }

      function resetDescent() {
        lander.x = W / 2 + rand(-W * .08, W * .08);
        lander.y = H * 0.12;
        lander.vy = 0;
        thrusting = false;
        thrustStop();
        pad.x = rand(pad.w / 2 + 16, W - pad.w / 2 - 16);
        pad.dir = Math.random() > .5 ? 1 : -1;
      }
      function startGame() {
        Arcade.startFlow();
        thrustStart(); thrustStop();
        state = 'playing'; score = 0; round = 1; phase = 0;
        gravity = GRAVITY0;
        pad.w = 120; pad.speed = 130;
        particles = []; rings = []; flash = 0; shake = 0;
        resetDescent();
        setScore(); setRound(); checkPhase();
        gameEl.classList.add('playing');
        tone(330, .09, 'sine', .07, 0);
        tone(495, .13, 'sine', .06, .065);
        canvas.focus({ preventScroll: true });
      }
      function nextRound() {
        round++;
        gravity = Math.min(480, GRAVITY0 + (round - 1) * 15);
        pad.w = Math.max(58, 120 - (round - 1) * 10);
        pad.speed = Math.min(320, 130 + (round - 1) * 22);
        resetDescent();
        setRound();
        if (checkPhase()) showToast('Pad ' + round + ' · ' + PHASES[phase - 1].name, colors.cyan);
        else showToast('Pad ' + round, colors.muted);
      }
      function touchdown() {
        var dx = Math.abs(lander.x - pad.x);
        var softBonus = Math.round((1 - Math.max(0, lander.vy) / SAFE_V) * 20);
        var centerBonus = Math.round((1 - Math.min(1, dx / (pad.w / 2))) * 10);
        var pts = 20 + Math.max(0, softBonus) + Math.max(0, centerBonus);
        score += pts;
        setScore();
        showToast('Touchdown +' + pts, colors.cyan);
        touchdownSound();
        var top = padTopY();
        burst(pad.x, top - 4, colors.muted, 10, 90);
        rings.push({ x: lander.x, y: top - 6, r: 8, life: 1, color: colors.cyan });
        thrusting = false;
        thrustStop();
        state = 'landed';
        setTimeout(function () {
          if (state === 'landed') { nextRound(); state = 'playing'; }
        }, 1050);
      }
      function crash() {
        state = 'crashed';
        impactV = Math.round(lander.vy);
        thrusting = false;
        thrustStop();
        crashSound();
        shake = reduced ? 0 : 14;
        flash = .3;
        var surf = surfaceY(lander.x);
        burst(lander.x, surf - 8, colors.coral, Math.min(60, Math.round(24 + lander.vy * 0.06)), 260);
        burst(lander.x, surf - 8, colors.ink, 18, 180);
        rings.push({ x: lander.x, y: surf - 10, r: 10, life: 1, color: colors.coral });
        setTimeout(endGame, 750);
      }
      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        Arcade.gameOver({
          score: score,
          title: String(score),
          instruction: score === 0
            ? 'The surface came up fast. Feather the thruster and watch the speed bar.'
            : 'Crashed at ' + impactV + ' u/s on pad ' + round + ' (safe under ' + SAFE_V + '). Arrive slow, arrive centered.',
          restartLabel: 'Fly again'
        });
      }

      function pressOn() {
        if (state !== 'playing') return;
        Arcade.initAudio();
        if (!thrusting) { thrusting = true; thrustStart(); }
      }
      function pressOff() {
        if (thrusting) { thrusting = false; thrustStop(); }
      }

      ARCADE.onStart = startGame;
      ARCADE.onMute = function (m) { if (m) thrustStop(); };
      ARCADE.onVisibility = function () { last = performance.now(); pressOff(); };
      canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); pressOn(); });
      window.addEventListener('pointerup', pressOff);
      window.addEventListener('pointercancel', pressOff);
      canvas.addEventListener('pointerleave', pressOff);
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('keydown', function (e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && state === 'playing') { e.preventDefault(); pressOn(); }
      });
      document.addEventListener('keyup', function (e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') pressOff();
      });

      function roundRectPath(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function drawBackground(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        // stars with parallax drift + twinkle
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var sx = (s.x * W - t * 0.004 * s.layer) % W;
          if (sx < 0) sx += W;
          ctx.globalAlpha = s.a * (0.45 + 0.55 * Math.abs(Math.sin(t / 900 + s.ph)));
          ctx.fillStyle = colors.ink;
          ctx.fillRect(sx, s.y * H, s.sz, s.sz);
        }
        ctx.globalAlpha = 1;

        // distant ridges
        ctx.fillStyle = colors.ink;
        ctx.globalAlpha = .07;
        ctx.beginPath(); ctx.moveTo(0, terrainY);
        for (var x = 0; x <= W; x += 24) {
          ctx.lineTo(x, terrainY - 30 - Math.sin(x * 0.011 + 1.7) * 24 - Math.sin(x * 0.004 + .5) * 16);
        }
        ctx.lineTo(W, terrainY); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = .10;
        ctx.beginPath(); ctx.moveTo(0, terrainY);
        for (var x2 = 0; x2 <= W; x2 += 24) {
          ctx.lineTo(x2, terrainY - 14 - Math.sin(x2 * 0.017 + 4.2) * 12);
        }
        ctx.lineTo(W, terrainY); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;

        // terrain silhouette
        var th = H - terrainY;
        ctx.fillStyle = colors.ink;
        ctx.globalAlpha = .92;
        ctx.fillRect(0, terrainY, W, th);
        ctx.globalAlpha = 1;
        ctx.fillStyle = colors.muted;
        ctx.fillRect(0, terrainY, W, 2);

        drawPad(t);
        if (state === 'playing' || state === 'landed' || state === 'ready') drawLander();
        if (state === 'playing') drawGauge();
        ctx.restore();
      }
      function drawPad(t) {
        var pw = pad.w, ph = PAD_H;
        var px = pad.x - pw / 2, py = terrainY - ph;
        var pulse = .75 + .25 * Math.sin(t / 300);
        ctx.save();
        ctx.shadowColor = colors.cyan;
        ctx.shadowBlur = 16 * pulse;
        ctx.fillStyle = colors.cyan;
        roundRectPath(px, py, pw, ph, 5);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = colors.paper;
        ctx.globalAlpha = .85;
        for (var i = 0; i < 3; i++) {
          var sx = pad.x - pw / 4 + (i - 1) * pw / 4;
          ctx.fillRect(sx - 2, py + 2, 4, ph - 4);
        }
        ctx.globalAlpha = 1;
        // beacon dots at pad ends
        ctx.fillStyle = colors.lime;
        ctx.beginPath(); ctx.arc(px - 7, terrainY - 3, 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(px + pw + 7, terrainY - 3, 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
      function drawLander() {
        var x = lander.x, y = lander.y;
        ctx.save();
        ctx.translate(x, y);
        var wob = thrusting && state === 'playing' ? Math.sin(performance.now() / 40) * 1.2 : 0;
        ctx.rotate(wob * .02);
        // legs
        ctx.strokeStyle = colors.ink; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-8, 4); ctx.lineTo(-14, 16);
        ctx.moveTo(8, 4); ctx.lineTo(14, 16);
        ctx.moveTo(-18, 16); ctx.lineTo(-10, 16);
        ctx.moveTo(10, 16); ctx.lineTo(18, 16);
        ctx.stroke();
        // body
        ctx.fillStyle = colors.paper;
        ctx.strokeStyle = colors.ink;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(-11, -10); ctx.lineTo(11, -10);
        ctx.lineTo(14, 8); ctx.lineTo(-14, 8);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // window
        ctx.fillStyle = colors.cyan;
        ctx.beginPath(); ctx.arc(0, -2, 4.5, 0, Math.PI * 2); ctx.fill();
        // flame
        if (thrusting && state === 'playing') {
          var fl = 16 + Math.random() * 16;
          var g = ctx.createLinearGradient(0, 8, 0, 8 + fl);
          g.addColorStop(0, '#fff7d6');
          g.addColorStop(.45, colors.coral);
          g.addColorStop(1, 'rgba(233,93,69,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.moveTo(-7, 8); ctx.lineTo(0, 8 + fl); ctx.lineTo(7, 8);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      function drawGauge() {
        var gx = W - 30, gy = H * 0.30, gh = H * 0.26, gw = 8;
        var frac = Math.max(0, Math.min(1, lander.vy / MAX_V));
        var safeFrac = SAFE_V / MAX_V;
        var tooFast = lander.vy > SAFE_V;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = colors.muted;
        ctx.font = '500 10px DM Mono, monospace';
        ctx.fillText('VEL', gx + gw / 2, gy - 10);
        // track
        ctx.fillStyle = colors.line;
        roundRectPath(gx, gy, gw, gh, 4); ctx.fill();
        // safe zone
        ctx.fillStyle = colors.cyan;
        ctx.globalAlpha = .3;
        ctx.fillRect(gx, gy, gw, safeFrac * gh);
        ctx.globalAlpha = 1;
        // threshold line
        ctx.fillStyle = colors.cyan;
        ctx.fillRect(gx - 3, gy + safeFrac * gh - 1, gw + 6, 2);
        // fill
        ctx.fillStyle = tooFast ? colors.coral : colors.cyan;
        roundRectPath(gx, gy, gw, Math.max(3, frac * gh), 4); ctx.fill();
        ctx.restore();
      }
      function updateEffects(dt) {
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= .975; p.vy *= .975;
          p.life -= dt * 1.9;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (var j = rings.length - 1; j >= 0; j--) {
          rings[j].r += dt * 75; rings[j].life -= dt * 2;
          if (rings[j].life <= 0) rings.splice(j, 1);
        }
        flash = Math.max(0, flash - dt * 1.7);
        shake = Math.max(0, shake - dt * 45);
      }
      function drawEffects() {
        ctx.save();
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
        }
        for (var j = 0; j < rings.length; j++) {
          var r = rings[j];
          ctx.globalAlpha = Math.max(0, r.life);
          ctx.strokeStyle = r.color; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
        }
        if (flash) { ctx.globalAlpha = flash * .5; ctx.fillStyle = colors.coral; ctx.fillRect(0, 0, W, H); }
        ctx.restore();
      }
      function update(dt) {
        // pad slides only during play (frozen on landed/crashed/over)
        if (state === 'ready' || state === 'playing') {
          pad.x += pad.dir * pad.speed * dt;
          var lo = pad.w / 2 + 12, hi = W - pad.w / 2 - 12;
          if (pad.x < lo) { pad.x = lo; pad.dir = 1; }
          if (pad.x > hi) { pad.x = hi; pad.dir = -1; }
        }

        // post-impact physics: keep integrating so the impact velocity is visible
        if (state === 'landed' || state === 'crashed') {
          lander.vy += gravity * dt;
          lander.y += lander.vy * dt;
          var surfC = surfaceY(lander.x);
          if (lander.y + 16 >= surfC && lander.vy > 0) {
            lander.y = surfC - 16;
            lander.vy = -lander.vy * 0.42;
            if (lander.vy > -14) lander.vy = 0;
          }
          return;
        }

        if (state !== 'playing') return;

        lander.vy += gravity * dt;
        if (thrusting) {
          lander.vy -= THRUST * dt;
          // flame exhaust particles
          for (var k = 0; k < 2; k++) {
            particles.push({
              x: lander.x + rand(-5, 5), y: lander.y + 12,
              vx: rand(-30, 30), vy: rand(120, 240),
              life: 1, size: rand(2, 4), color: Math.random() > .4 ? colors.coral : colors.lime
            });
          }
        }
        lander.y += lander.vy * dt;
        if (lander.y < 44) { lander.y = 44; lander.vy = Math.max(lander.vy, 0); }

        if (lander.y + 16 >= surfaceY(lander.x)) {
          var dx = Math.abs(lander.x - pad.x);
          var onPad = dx <= pad.w / 2 - 6;
          if (onPad && lander.vy <= SAFE_V) touchdown();
          else crash();
        }
      }
      function loop(t) {
        var dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
        update(dt);
        updateEffects(dt);
        drawBackground(t);
        drawEffects();
        requestAnimationFrame(loop);
      }
      // idle pose for the start screen
      lander.x = W / 2; lander.y = H * 0.3; lander.vy = 0;
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
