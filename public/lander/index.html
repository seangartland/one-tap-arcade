<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101828'/%3E%3Cpath d='M16 7 L23 19 L9 19 Z' fill='%23f5b942'/%3E%3Crect x='7' y='21.5' width='18' height='2.5' rx='1.25' fill='%239aa7bd'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070f" />
  <title>Lander - a one-button lunar lander</title>
  <link rel="stylesheet" href="/shared/arcade.css" />
  <style>
    canvas { touch-action: none; }
    .mark:has(svg) svg { filter: none; }
  </style>
</head>
<body class="game">
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Lunar lander game. Press and hold anywhere, or hold space, to fire the thruster. Land softly on the glowing pad."></canvas>
    <div class="hud" aria-live="polite">
      <div class="score-wrap">
        <span class="score" id="score">0</span>
        <span class="multiplier" id="multiplier">R1</span>
      </div>
    </div>
    <div class="hint">Hold anywhere · Space</div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 120 68" aria-hidden="true"><defs><radialGradient id="landHaze" cx=".5" cy=".6" r=".85"><stop offset="0" stop-color="#4ab6ff" stop-opacity=".12"/><stop offset="1" stop-color="#4ab6ff" stop-opacity="0"/></radialGradient></defs><rect width="120" height="68" fill="url(#landHaze)"/><path d="M6 54 H114" stroke="#7edcff" stroke-width="6" stroke-linecap="round" opacity=".08" fill="none"/><path d="M6 54 H114" stroke="#aaf5ff" stroke-width="2.2" stroke-linecap="round" opacity=".3" fill="none"/><path d="M6 54 H114" stroke="#d9fbff" stroke-width="1.1" stroke-linecap="round" opacity=".85" fill="none"/><rect x="40" y="46" width="40" height="7" rx="3.5" fill="#ffd166" opacity=".22"/><rect x="40" y="46" width="40" height="7" rx="3.5" fill="none" stroke="#ffd166" stroke-width="3" opacity=".18"/><rect x="40" y="46" width="40" height="7" rx="3.5" fill="none" stroke="#ffd166" stroke-width="1.5" opacity=".75"/><rect x="40" y="46" width="40" height="7" rx="3.5" fill="none" stroke="#ffe9bd" stroke-width="1" opacity=".95"/><line x1="43" y1="47.8" x2="77" y2="47.8" stroke="#fff3d6" stroke-width="1.5" opacity=".9"/><circle cx="38" cy="49.5" r="3" fill="#ffd166" opacity=".3"/><circle cx="38" cy="49.5" r="1.8" fill="#ffd166"/><circle cx="38" cy="49.5" r=".9" fill="#ffffff"/><circle cx="82" cy="49.5" r="3" fill="#ffd166" opacity=".3"/><circle cx="82" cy="49.5" r="1.8" fill="#ffd166"/><circle cx="82" cy="49.5" r=".9" fill="#ffffff"/><path d="M60 24 V45" stroke="#ffd166" stroke-width="2.2" stroke-dasharray="3 4" stroke-linecap="round" opacity=".25" fill="none"/><path d="M60 24 V45" stroke="#ffd166" stroke-width="1.2" stroke-dasharray="3 4" stroke-linecap="round" opacity=".8" fill="none"/><circle cx="60" cy="23" r="1.6" fill="#ffe9bd"/><path d="M52 8 L68 8 L66 15 L54 15 Z" fill="#08101f"/><path d="M52 8 L68 8 L66 15 L54 15 Z" stroke="#7edcff" stroke-width="5" opacity=".18" fill="none"/><path d="M52 8 L68 8 L66 15 L54 15 Z" stroke="#aaf5ff" stroke-width="1.5" opacity=".9" fill="none"/><circle cx="60" cy="10.5" r="4.2" fill="#aaf5ff" opacity=".25"/><circle cx="60" cy="10.5" r="2.5" fill="#ffffff"/><path d="M54 14 L51 19 M66 14 L69 19" stroke="#aaf5ff" stroke-width="1.4" stroke-linecap="round" opacity=".9"/><path d="M55.5 15 L60 24 L64.5 15 Z" fill="#7edcff" opacity=".14"/><path d="M56.5 15 L60 21 L63.5 15 Z" fill="#d9fbff" opacity=".45"/><path d="M57.5 15 L60 18.5 L62.5 15 Z" fill="#ffffff"/><g><rect x="90" y="13" width="28" height="5" rx="2.5" fill="#08101f"/><rect x="91" y="14" width="12" height="3" rx="1.5" fill="#aaf5ff" opacity=".5"/><rect x="103.5" y="14" width="12" height="3" rx="1.5" fill="#ff2bd6" opacity=".25"/><line x1="103.5" y1="11.5" x2="103.5" y2="19.5" stroke="#ffd166" stroke-width="1.2" opacity=".9"/><rect x="97.5" y="9.5" width="1.6" height="12" rx=".8" fill="#ffffff"/></g></svg></div>
    </section>
  </main>

  <script>
    window.ARCADE = {
      game: 'lander',
      title: 'Lander.',
      tagline: 'Hold to slow your fall. Touch down soft on the glowing pad.',
      startLabel: 'Start descent',
      restartLabel: 'Fly again',
      resultLabel: 'Crashed',
      boardHeading: 'Lander · Global leaders'
    };
  </script>
  <script src="/shared/arcade.js"></script>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = Arcade.gameEl;
      var scoreEl = document.getElementById('score');
      var multEl = document.getElementById('multiplier');
      var tone = Arcade.tone;
      var showToast = Arcade.showToast;
      var colors = Arcade.colors;


      var state = 'ready';
      var W = 0, H = 0, dpr = 1;
      var score = 0;
      var round = 1;
      var impactV = 0;
      var last = 0;
      var particles = [];
      var rings = [];
      var flash = 0;
      var shake = 0;
      var thrustOsc = null;
      var thrustGain = null;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var vigGrad = null;

      // APEX palette: cyan player/track, amber target/score, magenta threat, white hot core
      var C_CYAN = [1, 205, 250];
      var C_ICE = [170, 245, 255];
      var C_AMB = [255, 209, 102];
      var C_MAG = [255, 43, 214];
      var C_WHT = [255, 255, 255];
      function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
      function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t | 0, a[1] + (b[1] - a[1]) * t | 0, a[2] + (b[2] - a[2]) * t | 0]; }

      var GRAVITY0 = 300, THRUST = 780, SAFE_V = 140, MAX_V = 420;
      var gravity = GRAVITY0;
      var thrusting = false;
      var lander = { x: 0, y: 0, vy: 0 };
      var pad = { x: 0, w: 120, dir: 1, speed: 130 };
      var terrainY = 0;
      var stars = [];
      var PAD_H = 10;
      function padTopY() { return terrainY - PAD_H; }
      function surfaceY(x) {
        return Math.abs(x - pad.x) <= pad.w / 2 - 6 ? padTopY() : terrainY;
      }

      var PHASE_PADS = [1, 3, 6, 10]; // pads landed where phases 2..5 begin // pads landed where phases 2..5 begin
      function checkPhase() {
        return Arcade.setPhase(Arcade.phaseAt(round - 1, PHASE_PADS), true);
      }
      var rand = Arcade.rand;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        vigGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.min(W, H) * .72);
        vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); vigGrad.addColorStop(1, 'rgba(0,0,0,.62)');
        terrainY = H - Math.max(96, H * 0.15);
        stars = [];
        var n = Math.round(Math.min(130, W * H / 9000));
        for (var i = 0; i < n; i++) {
          stars.push({ x: Math.random(), y: Math.random() * 0.78, sz: rand(1, 2.4), a: rand(.25, .8), ph: rand(0, 6.28), layer: rand(.2, 1) });
        }
        pad.x = Math.min(Math.max(pad.x || W / 2, pad.w / 2 + 12), W - pad.w / 2 - 12);
      }
      window.addEventListener('resize', resize, { passive: true });
      resize();

      function thrustStart() {
        var a = Arcade.audioNodes();
        if (Arcade.isMuted() || thrustOsc || !a) return;
        try {
          var o = a.ctx.createOscillator();
          o.type = 'sawtooth'; o.frequency.value = 52;
          var lfo = a.ctx.createOscillator();
          lfo.type = 'sine'; lfo.frequency.value = 14;
          var lfoG = a.ctx.createGain(); lfoG.gain.value = 22;
          lfo.connect(lfoG); lfoG.connect(o.frequency);
          var g = a.ctx.createGain();
          g.gain.value = .0001;
          g.gain.exponentialRampToValueAtTime(.075, a.ctx.currentTime + .06);
          o.connect(g); g.connect(a.out);
          o.start(); lfo.start();
          o._lfo = lfo;
          thrustOsc = o; thrustGain = g;
        } catch (e) {}
      }
      function thrustStop() {
        var a = Arcade.audioNodes();
        if (!thrustOsc || !a) { thrustOsc = null; thrustGain = null; return; }
        try {
          var o = thrustOsc, l = thrustOsc._lfo, g = thrustGain;
          g.gain.cancelScheduledValues(a.ctx.currentTime);
          g.gain.setValueAtTime(Math.max(.0001, g.gain.value), a.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(.0001, a.ctx.currentTime + .09);
          setTimeout(function () { try { o.stop(); l.stop(); } catch (e) {} }, 140);
        } catch (e) {}
        thrustOsc = null; thrustGain = null;
      }
      function touchdownSound() {
        tone(520, .14, 'sine', .11, 0);
        tone(780, .18, 'sine', .09, .07);
        tone(1040, .22, 'sine', .06, .15);
      }
      function crashSound() {
        if (Arcade.isMuted()) return;
        Arcade.initAudio(function () {
          var a = Arcade.audioNodes(); if (!a) return;
          var when = a.ctx.currentTime;
          var o = a.ctx.createOscillator();
          o.type = 'triangle';
          o.frequency.setValueAtTime(170, when);
          o.frequency.exponentialRampToValueAtTime(36, when + .5);
          var g = a.ctx.createGain();
          g.gain.setValueAtTime(.0001, when);
          g.gain.exponentialRampToValueAtTime(.17, when + .02);
          g.gain.exponentialRampToValueAtTime(.0001, when + .62);
          o.connect(g); g.connect(a.out);
          o.start(when); o.stop(when + .66);
          tone(88, .4, 'sine', .1, .05);
        });
      }

      function setScore() { scoreEl.textContent = String(score); }
      function setRound() {
        multEl.textContent = 'R' + round;
        multEl.classList.add('show');
      }
      function burst(x, y, color, count, spd) {
        if (reduced) count = Math.min(count, 4);
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2;
          var v = rand(40, spd || 170);
          particles.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, size: rand(2, 5), color: color });
        }
      }

      function resetDescent() {
        lander.x = W / 2 + rand(-W * .08, W * .08);
        lander.y = H * 0.12;
        lander.vy = 0;
        thrusting = false;
        thrustStop();
        pad.x = rand(pad.w / 2 + 16, W - pad.w / 2 - 16);
        pad.dir = Math.random() > .5 ? 1 : -1;
      }
      function startGame() {
        Arcade.startFlow();
        thrustStart(); thrustStop();
        state = 'playing'; score = 0; round = 1; Arcade.resetPhase();
        gravity = GRAVITY0;
        pad.w = 120; pad.speed = 130;
        particles = []; rings = []; flash = 0; shake = 0;
        resetDescent();
        setScore(); setRound(); checkPhase();
        gameEl.classList.add('playing');
        tone(330, .09, 'sine', .07, 0);
        tone(495, .13, 'sine', .06, .065);
        canvas.focus({ preventScroll: true });
      }
      function nextRound() {
        round++;
        gravity = Math.min(480, GRAVITY0 + (round - 1) * 15);
        pad.w = Math.max(58, 120 - (round - 1) * 10);
        pad.speed = Math.min(320, 130 + (round - 1) * 22);
        resetDescent();
        setRound();
        if (checkPhase()) showToast('Pad ' + round + ' · ' + Arcade.PHASES[Arcade.phase() - 1].name, colors.cyan);
        else showToast('Pad ' + round, colors.muted);
      }
      function touchdown() {
        var dx = Math.abs(lander.x - pad.x);
        var softBonus = Math.round((1 - Math.max(0, lander.vy) / SAFE_V) * 12);
        var centerBonus = Math.round((1 - Math.min(1, dx / (pad.w / 2))) * 8);
        var pts = 15 + Math.max(0, softBonus) + Math.max(0, centerBonus);
        score += pts;
        setScore();
        showToast('Touchdown +' + pts, '#ffd166');
        touchdownSound();
        var top = padTopY();
        burst(pad.x, top - 4, C_AMB, 10, 90);
        burst(pad.x, top - 4, C_WHT, 5, 80);
        rings.push({ x: lander.x, y: top - 6, r: 8, life: 1, color: C_AMB });
        thrusting = false;
        thrustStop();
        state = 'landed';
        setTimeout(function () {
          if (state === 'landed') { nextRound(); state = 'playing'; }
        }, 1050);
      }
      function crash() {
        state = 'crashed';
        impactV = Math.round(lander.vy);
        thrusting = false;
        thrustStop();
        crashSound();
        shake = reduced ? 0 : 14;
        flash = .3;
        var surf = surfaceY(lander.x);
        burst(lander.x, surf - 8, C_MAG, Math.min(60, Math.round(24 + lander.vy * 0.06)), 260);
        burst(lander.x, surf - 8, C_WHT, 14, 200);
        rings.push({ x: lander.x, y: surf - 10, r: 10, life: 1, color: C_MAG });
        setTimeout(endGame, 750);
      }
      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        Arcade.gameOver({
          score: score,
          title: String(score),
          instruction: score === 0
            ? 'The surface came up fast. Feather the thruster and watch the speed bar.'
            : 'Crashed at ' + impactV + ' u/s on pad ' + round + ' (safe under ' + SAFE_V + '). Arrive slow, arrive centered.',
          restartLabel: 'Fly again'
        });
      }

      function pressOn() {
        if (state !== 'playing') return;
        Arcade.initAudio();
        if (!thrusting) { thrusting = true; thrustStart(); }
      }
      function pressOff() {
        if (thrusting) { thrusting = false; thrustStop(); }
      }

      ARCADE.onStart = startGame;
      ARCADE.onMute = function (m) { if (m) thrustStop(); };
      ARCADE.onVisibility = function () { last = performance.now(); pressOff(); };
      canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); pressOn(); });
      window.addEventListener('pointerup', pressOff);
      window.addEventListener('pointercancel', pressOff);
      canvas.addEventListener('pointerleave', pressOff);
      canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      document.addEventListener('keydown', function (e) {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && state === 'playing') { e.preventDefault(); pressOn(); }
      });
      document.addEventListener('keyup', function (e) {
        if (e.code === 'Space' || e.code === 'ArrowUp') pressOff();
      });

      function roundRectPath(x, y, w, h, r) {
        r = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function drawGrid() {
        var sp = 64;
        var mn = new Path2D(), mj = new Path2D();
        var i, x, y;
        for (i = 0; i <= W / sp + 1; i++) {
          x = i * sp;
          if (i % 5 === 0) { mj.moveTo(x, 0); mj.lineTo(x, H); }
          else { mn.moveTo(x, 0); mn.lineTo(x, H); }
        }
        for (i = 0; i <= H / sp + 1; i++) {
          y = i * sp;
          if (i % 5 === 0) { mj.moveTo(0, y); mj.lineTo(W, y); }
          else { mn.moveTo(0, y); mn.lineTo(W, y); }
        }
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(40,130,255,.06)'; ctx.stroke(mn);
        ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(90,170,255,.12)'; ctx.stroke(mj);
      }
      function drawBackground(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = Arcade.bgGradient(ctx, W / 2, H * .35, Math.hypot(W, H) * .8);
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        // faint blue grid
        drawGrid();

        // stars with parallax drift + twinkle
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var sx = (s.x * W - t * 0.004 * s.layer) % W;
          if (sx < 0) sx += W;
          ctx.globalAlpha = s.a * (0.45 + 0.55 * Math.abs(Math.sin(t / 900 + s.ph)));
          ctx.fillStyle = colors.ink;
          ctx.fillRect(sx, s.y * H, s.sz, s.sz);
        }
        ctx.globalAlpha = 1;

        drawRidge();
        drawPad(t);
        if (state === 'playing' || state === 'landed' || state === 'ready') drawLander();
        if (state === 'playing') drawGauge();
        ctx.restore();
      }
      function drawRidge() {
        // distant ridges behind the ground
        ctx.fillStyle = colors.ink;
        ctx.globalAlpha = .05;
        ctx.beginPath(); ctx.moveTo(0, terrainY);
        for (var x = 0; x <= W; x += 20) {
          ctx.lineTo(x, terrainY - 34 - Math.sin(x * 0.011 + 1.7) * 26 - Math.sin(x * 0.004 + .5) * 15);
        }
        ctx.lineTo(W, terrainY); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = .08;
        ctx.beginPath(); ctx.moveTo(0, terrainY);
        for (var x2 = 0; x2 <= W; x2 += 20) {
          ctx.lineTo(x2, terrainY - 16 - Math.sin(x2 * 0.017 + 4.2) * 13);
        }
        ctx.lineTo(W, terrainY); ctx.closePath(); ctx.fill();
        ctx.globalAlpha = 1;

        // ground slab: near-opaque dark surface
        ctx.fillStyle = '#040814';
        ctx.fillRect(0, terrainY, W, H - terrainY);

        // lit top edge: stacked-stroke glow, cyan track
        ctx.beginPath(); ctx.moveTo(0, terrainY + .5); ctx.lineTo(W, terrainY + .5);
        ctx.lineWidth = 5; ctx.strokeStyle = rgba(C_CYAN, .07); ctx.stroke();
        ctx.lineWidth = 2.4; ctx.strokeStyle = rgba(C_CYAN, .2); ctx.stroke();
        ctx.lineWidth = 1.2; ctx.strokeStyle = rgba(mixc(C_CYAN, C_WHT, .4), .85); ctx.stroke();
      }
      function drawPad(t) {
        var pw = pad.w, ph = PAD_H;
        var px = pad.x - pw / 2, py = terrainY - ph;
        ctx.save();
        ctx.lineJoin = 'round';

        // flat amber pad: dark base slab
        ctx.fillStyle = '#181008';
        roundRectPath(px, py, pw, ph, 4);
        ctx.fill();

        // amber multi-pass glow outline
        roundRectPath(px, py, pw, ph, 4);
        ctx.lineWidth = 7; ctx.strokeStyle = rgba(C_AMB, .07); ctx.stroke();
        ctx.lineWidth = 3; ctx.strokeStyle = rgba(C_AMB, .2); ctx.stroke();
        ctx.lineWidth = 1.4; ctx.strokeStyle = rgba(mixc(C_AMB, C_WHT, .3), .9); ctx.stroke();

        // amber face with a soft pulse
        ctx.globalAlpha = .18 + .08 * Math.sin(t / 300);
        ctx.fillStyle = rgba(C_AMB, 1);
        roundRectPath(px + 3, py + 1, pw - 6, ph - 3, 2.5);
        ctx.fill();
        ctx.globalAlpha = 1;

        // bright top edge
        ctx.lineWidth = 1.6; ctx.strokeStyle = rgba(mixc(C_AMB, C_WHT, .5), .95);
        ctx.beginPath(); ctx.moveTo(px + 3, py + 1.4); ctx.lineTo(px + pw - 3, py + 1.4); ctx.stroke();

        // apex dots at both ends: amber halo with white-hot core
        for (var e = 0; e < 2; e++) {
          var ax = e === 0 ? px - 7 : px + pw + 7;
          var ay = terrainY - 3;
          ctx.globalAlpha = .12; ctx.fillStyle = rgba(C_AMB, 1);
          ctx.beginPath(); ctx.arc(ax, ay, 6, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = .3;
          ctx.beginPath(); ctx.arc(ax, ay, 3.4, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.fillStyle = rgba(mixc(C_AMB, C_WHT, .6), 1);
          ctx.beginPath(); ctx.arc(ax, ay, 2, 0, Math.PI * 2); ctx.fill();
        }

        ctx.restore();
      }
      function drawLander() {
        var x = lander.x, y = lander.y;
        ctx.save();
        ctx.translate(x, y);
        var wob = thrusting && state === 'playing' ? Math.sin(performance.now() / 40) * 1.2 : 0;
        ctx.rotate(wob * .02);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // legs: cyan track strokes with a faint glow pass
        var legs = new Path2D();
        legs.moveTo(-8, 4); legs.lineTo(-14, 16);
        legs.moveTo(8, 4); legs.lineTo(14, 16);
        legs.moveTo(-18, 16); legs.lineTo(-10, 16);
        legs.moveTo(10, 16); legs.lineTo(18, 16);
        ctx.lineWidth = 5; ctx.strokeStyle = rgba(C_CYAN, .12); ctx.stroke(legs);
        ctx.lineWidth = 1.6; ctx.strokeStyle = rgba(C_CYAN, .9); ctx.stroke(legs);

        // body: dark ship fill with a cyan multi-pass glow outline
        var body = new Path2D();
        body.moveTo(-11, -10); body.lineTo(11, -10);
        body.lineTo(14, 8); body.lineTo(-14, 8);
        body.closePath();
        ctx.fillStyle = '#08101f';
        ctx.fill(body);
        ctx.lineWidth = 6; ctx.strokeStyle = rgba(C_CYAN, .07); ctx.stroke(body);
        ctx.lineWidth = 2.6; ctx.strokeStyle = rgba(C_CYAN, .2); ctx.stroke(body);
        ctx.lineWidth = 1.3; ctx.strokeStyle = rgba(mixc(C_CYAN, C_WHT, .45), .95); ctx.stroke(body);

        // window: white-hot core over a cyan halo
        ctx.globalAlpha = .16; ctx.fillStyle = rgba(C_CYAN, 1);
        ctx.beginPath(); ctx.arc(0, -2, 7, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,255,255,.95)';
        ctx.beginPath(); ctx.arc(0, -2, 3.2, 0, Math.PI * 2); ctx.fill();

        // flame: white-hot core with a cyan glow and flicker
        if (thrusting && state === 'playing') {
          var fl = 15 + Math.random() * 15;
          ctx.globalAlpha = .08; ctx.fillStyle = rgba(C_CYAN, 1);
          ctx.beginPath();
          ctx.moveTo(-10, 8); ctx.lineTo(0, 8 + fl + 7); ctx.lineTo(10, 8);
          ctx.closePath(); ctx.fill();
          ctx.globalAlpha = .2;
          ctx.beginPath();
          ctx.moveTo(-8, 8); ctx.lineTo(0, 8 + fl + 3); ctx.lineTo(8, 8);
          ctx.closePath(); ctx.fill();
          ctx.globalAlpha = 1;
          ctx.fillStyle = 'rgba(255,255,255,.95)';
          ctx.beginPath();
          ctx.moveTo(-5, 8); ctx.lineTo(0, 8 + fl); ctx.lineTo(5, 8);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
      }
      function drawGauge() {
        var gw = 80, gh = 7;
        var gx = W - 110, gy = H * 0.30;
        var frac = Math.max(0, Math.min(1, lander.vy / MAX_V));
        var safeFrac = SAFE_V / MAX_V;
        ctx.save();
        ctx.textAlign = 'left';
        ctx.fillStyle = colors.muted;
        ctx.font = '500 10px DM Mono, monospace';
        ctx.fillText('VEL', gx, gy - 8);

        // track: near-opaque dark slab with a faint edge
        ctx.fillStyle = '#040814';
        roundRectPath(gx, gy, gw, gh, 3.5); ctx.fill();
        ctx.lineWidth = 1; ctx.strokeStyle = rgba(C_CYAN, .16);
        roundRectPath(gx, gy, gw, gh, 3.5); ctx.stroke();

        // segmented safe zone (cyan) and danger zone (magenta)
        var segs = 12;
        for (var i = 0; i < segs; i++) {
          var s0 = i / segs, s1 = (i + 1) / segs;
          if (s0 < safeFrac) {
            var a = Math.max(s0, 0), b = Math.min(s1, safeFrac);
            ctx.globalAlpha = .5;
            ctx.fillStyle = rgba(C_CYAN, 1);
            ctx.fillRect(gx + a * gw + 1, gy + 1.5, Math.max(0, (b - a) * gw - 2), gh - 3);
          }
        }
        ctx.globalAlpha = .4;
        ctx.fillStyle = rgba(C_MAG, 1);
        ctx.fillRect(gx + safeFrac * gw + 1, gy + 1.5, gw - safeFrac * gw - 2, gh - 3);
        ctx.globalAlpha = 1;

        // threshold tick: amber at the safe/danger boundary
        ctx.fillStyle = rgba(C_AMB, .95);
        ctx.fillRect(gx + safeFrac * gw - 1, gy - 4, 2, gh + 8);

        // needle: white core on a cyan glow, slides with velocity
        var nx = gx + frac * gw;
        ctx.globalAlpha = .14; ctx.fillStyle = rgba(C_CYAN, 1);
        ctx.fillRect(nx - 3, gy - 9, 6, gh + 16);
        ctx.globalAlpha = .3; ctx.fillStyle = rgba(C_ICE, 1);
        ctx.fillRect(nx - 1.5, gy - 9, 3, gh + 16);
        ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(255,255,255,1)';
        ctx.fillRect(nx - .75, gy - 9, 1.5, gh + 16);
        ctx.restore();
      }
      function updateEffects(dt) {
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx * dt; p.y += p.vy * dt;
          p.vx *= .975; p.vy *= .975;
          p.life -= dt * 1.9;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (var j = rings.length - 1; j >= 0; j--) {
          rings[j].r += dt * 75; rings[j].life -= dt * 2;
          if (rings[j].life <= 0) rings.splice(j, 1);
        }
        flash = Math.max(0, flash - dt * 1.7);
        shake = Math.max(0, shake - dt * 45);
      }
      function drawEffects() {
        ctx.save();
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = rgba(p.color, Math.max(0, p.life));
          var s = Math.max(.6, p.size * p.life);
          ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
        }
        for (var j = 0; j < rings.length; j++) {
          var r = rings[j];
          ctx.setLineDash([5, 7]);
          ctx.lineWidth = 2.4 * r.life + .4;
          ctx.strokeStyle = rgba(r.color, .9);
          ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.globalAlpha = 1;
        // black edge vignette
        ctx.fillStyle = vigGrad;
        ctx.fillRect(0, 0, W, H);
        if (flash) { ctx.globalAlpha = flash * .5; ctx.fillStyle = rgba(C_MAG, 1); ctx.fillRect(0, 0, W, H); }
        ctx.globalAlpha = 1;
        ctx.restore();
      }
      function update(dt) {
        // pad slides only during play (frozen on landed/crashed/over)
        if (state === 'ready' || state === 'playing') {
          pad.x += pad.dir * pad.speed * dt;
          var lo = pad.w / 2 + 12, hi = W - pad.w / 2 - 12;
          if (pad.x < lo) { pad.x = lo; pad.dir = 1; }
          if (pad.x > hi) { pad.x = hi; pad.dir = -1; }
        }

        // post-impact physics: keep integrating so the impact velocity is visible
        if (state === 'landed' || state === 'crashed') {
          lander.vy += gravity * dt;
          lander.y += lander.vy * dt;
          var surfC = surfaceY(lander.x);
          if (lander.y + 16 >= surfC && lander.vy > 0) {
            lander.y = surfC - 16;
            lander.vy = -lander.vy * 0.42;
            if (lander.vy > -14) lander.vy = 0;
          }
          return;
        }

        if (state !== 'playing') return;

        lander.vy += gravity * dt;
        if (thrusting) {
          lander.vy -= THRUST * dt;
          // flame exhaust particles
          for (var k = 0; k < 2; k++) {
            particles.push({
              x: lander.x + rand(-5, 5), y: lander.y + 12,
              vx: rand(-30, 30), vy: rand(120, 240),
              life: 1, size: rand(2, 4), color: Math.random() > .5 ? C_CYAN : C_WHT
            });
          }
        }
        lander.y += lander.vy * dt;
        if (lander.y < 44) { lander.y = 44; lander.vy = Math.max(lander.vy, 0); }

        if (lander.y + 16 >= surfaceY(lander.x)) {
          var dx = Math.abs(lander.x - pad.x);
          var onPad = dx <= pad.w / 2 - 6;
          if (onPad && lander.vy <= SAFE_V) touchdown();
          else crash();
        }
      }
      function loop(t) {
        var dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
        update(dt);
        updateEffects(dt);
        drawBackground(t);
        drawEffects();
        requestAnimationFrame(loop);
      }
      // idle pose for the start screen
      lander.x = W / 2; lander.y = H * 0.3; lander.vy = 0;
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
