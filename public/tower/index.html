<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f4f1ea'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23e07856'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="icon" href="data:," />
  <title>Tower — a one-tap stacking game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;650;750&display=swap');

    :root {
      color-scheme: light dark;
      --paper: #f4f1ea;
      --ink: #151718;
      --muted: #6d716e;
      --line: rgba(21,23,24,.14);
      --cyan: #087f8c;
      --coral: #e95d45;
      --lime: #bbda45;
      --panel: rgba(244,241,234,.82);
      --shadow: rgba(32,30,25,.18);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #111416;
        --ink: #f2f0e9;
        --muted: #a7aaa7;
        --line: rgba(242,240,233,.15);
        --cyan: #4bc7cf;
        --coral: #ff765f;
        --lime: #cde85a;
        --panel: rgba(17,20,22,.82);
        --shadow: rgba(0,0,0,.35);
      }
      meta[name="theme-color"] { content: #111416; }
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; }
    body {
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: Manrope, ui-sans-serif, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      user-select: none;
    }
    button { font: inherit; }

    .game {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 480px;
      isolation: isolate;
      background:
        radial-gradient(circle at 22% 14%, color-mix(in srgb, var(--lime) 16%, transparent), transparent 31%),
        radial-gradient(circle at 82% 83%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 34%),
        var(--paper);
    }
    .grain {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: .15;
      z-index: 4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }
    @media (prefers-color-scheme: dark) { .grain { mix-blend-mode: screen; opacity: .09; } }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
      outline: none;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      right: max(24px, env(safe-area-inset-right));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 3;
    }
    .score {
      font: 500 clamp(30px, 5vw, 48px)/1 DM Mono, monospace;
      letter-spacing: -.06em;
      min-width: 2ch;
    }

    .sound {
      position: absolute;
      z-index: 6;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 78%, transparent);
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .sound svg { width: 18px; height: 18px; }
    .sound .off { display: none; }
    .sound[aria-pressed="false"] .on { display: none; }
    .sound[aria-pressed="false"] .off { display: block; }
    .sound:focus-visible, .primary:focus-visible, .linklike:focus-visible, .home:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 28px;
      background: color-mix(in srgb, var(--paper) 48%, transparent);
      backdrop-filter: blur(7px);
      transition: opacity .3s ease, visibility .3s;
    }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .card {
      width: min(430px, 100%);
      text-align: center;
      padding: 34px 28px 30px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px var(--shadow);
      border-radius: 28px 28px 10px 28px;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 50%;
    }
    .mark::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: 50%;
      top: -6px;
      margin-left: -6px;
      background: var(--coral);
      border-radius: 50%;
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--coral) 20%, transparent);
    }
    .mark::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 8px;
      left: 50%;
      bottom: -5px;
      margin-left: -10px;
      background: var(--lime);
      border-radius: 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 54px);
      letter-spacing: -.055em;
      line-height: .96;
      font-weight: 750;
    }
    .instruction {
      margin: 18px auto 26px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 16px;
      max-width: 28ch;
    }
    .primary {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 20px 16px;
      color: #101312;
      background: var(--lime);
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 5px 0 color-mix(in srgb, var(--lime) 55%, #59601d);
      transform: translateY(0);
      transition: transform .1s, box-shadow .1s;
    }
    .primary:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--lime) 55%, #59601d); }
    .result-label {
      display: none;
      color: var(--coral);
      font: 500 12px/1 DM Mono, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .overlay.over .mark { display: none; }
    .overlay.over .result-label { display: block; }
    .overlay.over h1 { font-family: DM Mono, monospace; letter-spacing: -.075em; }
    .overlay.over .instruction { margin-bottom: 9px; }
    .session-best {
      display: none;
      margin: 0 0 26px;
      color: var(--muted);
      font: 400 12px/1.4 DM Mono, monospace;
    }
    .overlay.over .session-best { display: block; }
    #entry, #board { display: none; margin: 0 0 22px; }
    .overlay.over.entry-on #entry { display: block; }
    .overlay.over.board-on #board { display: block; }
    #entry label {
      display: block;
      margin: 0 0 10px;
      color: var(--muted);
      font: 500 11px/1 DM Mono, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .entry-row { display: flex; gap: 10px; align-items: stretch; }
    #initials {
      width: 4.8ch;
      padding: 10px 4px;
      text-align: center;
      font: 500 24px/1.2 DM Mono, monospace;
      letter-spacing: .22em;
      text-indent: .22em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    #initials:focus { outline: 3px solid var(--cyan); outline-offset: 2px; }
    #initials.shake { animation: ishake .32s; border-color: var(--coral); }
    @keyframes ishake {
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }
    .entry-row .primary { flex: 1; width: auto; }
    #saveScore:disabled { opacity: .55; cursor: default; }
    #board h2 {
      margin: 0 0 10px;
      color: var(--muted);
      font: 500 11px/1 DM Mono, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    #boardList {
      list-style: none;
      margin: 0;
      padding: 0;
      font: 400 13px/2 DM Mono, monospace;
      color: var(--muted);
    }
    #boardList li { display: flex; justify-content: space-between; gap: 12px; }
    #boardList li.me { color: var(--coral); }
    #boardList li.empty { justify-content: center; }
    .linklike {
      background: transparent;
      border: 0;
      padding: 6px 8px;
      color: var(--muted);
      font: 500 12px/1.6 DM Mono, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .linklike:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    #skipSave { margin-top: 12px; }
    .card-foot { margin-top: 18px; }
    #boardBack { display: none; margin-top: 14px; }
    .overlay.over .card-foot { display: none; }
    .overlay.leaders-on #entry { display: none !important; }
    .overlay.leaders-on .card-foot { display: none; }
    .overlay.leaders-on #board { display: block; }
    .overlay.leaders-on #boardBack { display: inline-block; }
    .home {
      position: absolute;
      z-index: 6;
      top: max(70px, calc(env(safe-area-inset-top) + 46px));
      right: max(20px, env(safe-area-inset-right));
      padding: 8px 4px;
      color: var(--muted);
      font: 500 12px/1 DM Mono, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .home:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

    .toast {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 18%;
      transform: translate(-50%, 8px);
      opacity: 0;
      color: var(--ink);
      font: 500 13px/1 DM Mono, monospace;
      letter-spacing: .09em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .toast.pop { animation: toast .55s ease-out; }
    @keyframes toast {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); }
      25% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      70% { opacity: 1; transform: translate(-50%, -4px); }
      100% { opacity: 0; transform: translate(-50%, -13px); }
    }
    .hint {
      position: absolute;
      z-index: 3;
      bottom: max(27px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font: 400 11px/1 DM Mono, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: .78;
      transition: opacity .3s;
    }
    .playing .hint { opacity: 0; }

    @media (max-width: 520px) {
      .game { min-height: 420px; }
      .hud { top: max(18px, env(safe-area-inset-top)); left: 19px; right: 19px; }
      .sound { right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 42px; height: 42px; }
      .card { padding: 29px 22px 24px; border-radius: 24px 24px 8px 24px; }
      .hint { bottom: max(28px, env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .overlay, .primary { transition: none; }
      .toast.pop { animation-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Tower stacking game. Tap or press space to drop the moving block onto the stack."></canvas>
    <div class="hud" aria-live="polite">
      <span class="score" id="score">0</span>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="hint">Tap anywhere · Space</div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="card">
        <div class="mark" aria-hidden="true"></div>
        <div class="result-label">Run complete</div>
        <h1 id="title">Stack the tower.</h1>
        <p class="instruction" id="instruction">Tap to drop the block. Don't let it miss.</p>
        <p class="session-best" id="sessionBest">Session best · 0</p>
        <div id="entry">
          <label for="initials">Enter your initials</label>
          <div class="entry-row">
            <input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your initials" />
            <button id="saveScore" class="primary" type="button">Save score</button>
          </div>
          <button class="linklike" id="skipSave" type="button">Skip</button>
        </div>
        <div id="board" aria-live="polite">
          <h2>Tower · Global leaders</h2>
          <ol id="boardList"></ol>
          <button class="linklike" id="boardBack" type="button">Back</button>
        </div>
        <button class="primary" id="start">Start stacking</button>
        <div class="card-foot"><button class="linklike" id="viewLeaders" type="button">Leaderboard</button></div>
      </div>
    </section>

    <button class="sound" id="sound" type="button" aria-label="Mute sound" aria-pressed="true">
      <svg class="on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z" fill="currentColor"/><path d="M17 9.2c.7.7 1 1.6 1 2.8s-.3 2.1-1 2.8M19.5 6.8c1.4 1.4 2.1 3.1 2.1 5.2s-.7 3.8-2.1 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z" fill="currentColor"/><path d="m17.5 9 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <a class="home" href="../">Arcade</a>
    <div class="grain" aria-hidden="true"></div>
  </main>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = document.getElementById('game');
      var overlay = document.getElementById('overlay');
      var startBtn = document.getElementById('start');
      var scoreEl = document.getElementById('score');
      var toast = document.getElementById('toast');
      var soundBtn = document.getElementById('sound');
      var titleEl = document.getElementById('title');
      var instructionEl = document.getElementById('instruction');
      var sessionBestEl = document.getElementById('sessionBest');
      var entryEl = document.getElementById('entry');
      var boardEl = document.getElementById('board');
      var boardList = document.getElementById('boardList');
      var initialsEl = document.getElementById('initials');
      var saveBtn = document.getElementById('saveScore');

      var GAME = 'tower';
      var state = 'ready'; // ready | playing | dropping | falling | over
      var W = 0, H = 0, dpr = 1;
      var bh = 30;
      var baseW = 200;
      var stack = [];
      var mover = null;
      var debris = [];
      var cam = 0, camTarget = 0;
      var speed = 0;
      var spawnDir = 1;
      var score = 0;
      var sessionBest = 0;
      var dropT = 0, dropFrom = 0, dropTo = 0;
      var fallTimer = 0;
      var muted = false;
      var audio = null;
      var audioOut = null;
      var colors = {};
      var perfectTol = 7;
      var last = 0;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var boardCache = null;

      function css(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }
      function refreshColors() {
        colors.paper = css('--paper'); colors.ink = css('--ink'); colors.muted = css('--muted');
        colors.line = css('--line'); colors.cyan = css('--cyan'); colors.coral = css('--coral'); colors.lime = css('--lime');
      }
      refreshColors();
      var schemeMQ = window.matchMedia('(prefers-color-scheme: dark)');
      var PHASES = [
        { name: 'Daybreak',
          light: { cyan: '#087f8c', coral: '#e95d45', lime: '#bbda45' },
          dark:  { cyan: '#4bc7cf', coral: '#ff765f', lime: '#cde85a' } },
        { name: 'Dusk',
          light: { cyan: '#5a4fcf', coral: '#e8933c', lime: '#2fa37c' },
          dark:  { cyan: '#9a8ff5', coral: '#f2b25c', lime: '#57d6a0' } },
        { name: 'Ember',
          light: { cyan: '#9a3412', coral: '#dc2626', lime: '#d97706' },
          dark:  { cyan: '#fb923c', coral: '#f87171', lime: '#fbbf24' } },
        { name: 'Tide',
          light: { cyan: '#0e7490', coral: '#2563eb', lime: '#0d9e6f' },
          dark:  { cyan: '#22d3ee', coral: '#60a5fa', lime: '#34d399' } },
        { name: 'Noir',
          light: { cyan: '#52525b', coral: '#db2777', lime: '#a3a3a3' },
          dark:  { cyan: '#a1a1aa', coral: '#f472b6', lime: '#d4d4d8' } }
      ];
      var phase = 1;
      function applyPhase(n, silent) {
        phase = n;
        var trio = schemeMQ.matches ? PHASES[n - 1].dark : PHASES[n - 1].light;
        var root = document.documentElement.style;
        root.setProperty('--cyan', trio.cyan);
        root.setProperty('--coral', trio.coral);
        root.setProperty('--lime', trio.lime);
        refreshColors();
        if (n > 1 && !silent) showToast(PHASES[n - 1].name, colors.cyan);
      }
      function checkPhase() {
        var n = Math.min(5, 1 + Math.floor(score / 8));
        if (n !== phase) applyPhase(n);
      }
      schemeMQ.addEventListener('change', function(){ applyPhase(phase, true); });

      function blockColor(i) {
        var trio = schemeMQ.matches ? PHASES[Math.max(0, phase - 1)].dark : PHASES[Math.max(0, phase - 1)].light;
        return [trio.cyan, trio.coral, trio.lime][i % 3];
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        baseW = Math.max(120, Math.min(230, W * .52));
        bh = Math.max(24, Math.min(36, H * .045));
      }
      window.addEventListener('resize', resize, {passive:true});
      resize();

      function stackTop() { return -stack.length * bh; }
      function moverY() { return stackTop() - bh - Math.max(48, H * .08); }
      function updateCamTarget() { camTarget = moverY() - H * .30; }

      function initAudio(onReady) {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audio) {
          audio = new AudioContext();
          audioOut = audio.createGain();
          audioOut.gain.value = .9;
          audioOut.connect(audio.destination);
        }
        if (audio.state === 'suspended') {
          audio.resume().then(function () { if (onReady) onReady(); }).catch(function () {});
        } else if (onReady) {
          onReady();
        }
      }
      function tone(freq, duration, type, volume, delay) {
        if (muted) return;
        initAudio(function () {
          var when = audio.currentTime + (delay || 0);
          var o = audio.createOscillator();
          var g = audio.createGain();
          o.type = type || 'sine'; o.frequency.setValueAtTime(freq, when);
          g.gain.setValueAtTime(.0001, when);
          g.gain.exponentialRampToValueAtTime(volume || .09, when + .012);
          g.gain.exponentialRampToValueAtTime(.0001, when + duration);
          o.connect(g); g.connect(audioOut);
          o.start(when); o.stop(when + duration + .03);
        });
      }
      function placeSound() {
        tone(210, .09, 'sine', .11, 0);
        tone(320, .07, 'sine', .05, .02);
      }
      function perfectSound() {
        tone(880, .12, 'sine', .08, 0);
        tone(1318, .16, 'sine', .06, .06);
      }
      function missSound() {
        tone(300, .18, 'triangle', .1, 0);
        tone(150, .3, 'triangle', .1, .12);
      }

      function setScore() {
        scoreEl.textContent = String(score);
        checkPhase();
      }
      function showToast(text, color) {
        toast.textContent = text;
        toast.style.color = color || colors.ink;
        toast.classList.remove('pop'); void toast.offsetWidth; toast.classList.add('pop');
      }

      function spawnMover() {
        var w = stack[stack.length - 1].w;
        spawnDir *= -1;
        mover = {
          x: spawnDir > 0 ? 16 : W - 16 - w,
          y: moverY(),
          w: w,
          dir: spawnDir
        };
        updateCamTarget();
      }

      function startGame() {
        initAudio();
        state = 'playing';
        score = 0; phase = 0;
        debris = [];
        stack = [{ x: (W - baseW) / 2, w: baseW }];
        speed = Math.max(210, W * .5);
        spawnMover();
        cam = camTarget;
        setScore();
        overlay.classList.add('hidden'); overlay.classList.remove('over');
        gameEl.classList.add('playing');
        tone(440, .09, 'sine', .07, 0);
        tone(660, .13, 'sine', .06, .065);
        canvas.focus({preventScroll:true});
      }

      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        sessionBest = Math.max(sessionBest, score);
        titleEl.textContent = String(score);
        instructionEl.textContent = score === 0
          ? 'The first block missed. Watch its drift and tap a beat earlier.'
          : (score < 8 ? 'A fine foundation. The blocks pick up speed as you climb.' : 'Tall work. One more tower?');
        sessionBestEl.textContent = 'Session best · ' + sessionBest;
        startBtn.textContent = 'Build again';
        overlay.classList.add('over'); overlay.classList.remove('hidden');
        overlay.classList.remove('entry-on', 'board-on', 'leaders-on');
        boardList.innerHTML = '';
        if (score > 0) {
          try { initialsEl.value = localStorage.getItem('arcade-initials') || ''; } catch (e) {}
          overlay.classList.add('entry-on');
        }
        fetchBoard();
        setTimeout(function(){ startBtn.focus({preventScroll:true}); }, 320);
      }

      function drop() {
        if (state !== 'playing') return;
        initAudio();
        state = 'dropping';
        dropT = 0;
        dropFrom = mover.y;
        dropTo = stackTop() - bh;
      }

      function resolveLanding() {
        var prev = stack[stack.length - 1];
        var m = mover;
        var left = Math.max(m.x, prev.x);
        var right = Math.min(m.x + m.w, prev.x + prev.w);
        var overlap = right - left;
        var col = blockColor(stack.length);
        if (overlap <= 0) {
          debris.push({ x: m.x, y: dropTo, w: m.w, vx: m.dir * 120, vy: -60, life: 1, color: col });
          mover = null;
          state = 'falling'; fallTimer = 0;
          missSound();
          return;
        }
        var dx = m.x - prev.x;
        if (Math.abs(dx) <= perfectTol) {
          stack.push({ x: prev.x, w: prev.w });
          showToast('Perfect', colors.lime);
          perfectSound();
        } else {
          var cutW = m.w - overlap;
          var cutX = dx > 0 ? (m.x + m.w - cutW) : m.x;
          debris.push({ x: cutX, y: dropTo, w: cutW, vx: (dx > 0 ? 1 : -1) * 110, vy: -50, life: 1, color: col });
          stack.push({ x: left, w: overlap });
          placeSound();
        }
        score++;
        speed = Math.min(950, speed + 16);
        setScore();
        spawnMover();
        state = 'playing';
      }

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function fetchBoard() {
        boardCache = fetch('/api/scores?game=' + GAME + '&_=' + Date.now())
          .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
          .then(function (d) { return (d && d.scores) || []; })
          .catch(function () { return null; });
        return boardCache;
      }
      function renderBoard(scores, highlightKey, force) {
        if ((!scores || !scores.length) && !force) { overlay.classList.remove('board-on'); return; }
        var html = '';
        if (scores && scores.length) {
          var done = false;
          scores.slice(0, 10).forEach(function (s, i) {
            var key = s.name + '|' + s.score;
            var me = highlightKey && !done && key === highlightKey;
            if (me) done = true;
            html += '<li' + (me ? ' class="me"' : '') + '><span>' + (i + 1) + '. ' + esc(s.name) + '</span><span>' + esc(s.score) + '</span></li>';
          });
        } else {
          html = '<li class="empty"><span>No scores yet — be the first.</span></li>';
        }
        boardList.innerHTML = html;
        overlay.classList.add('board-on');
      }
      saveBtn.addEventListener('click', function () {
        var name = (initialsEl.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
        if (!name) {
          initialsEl.classList.remove('shake'); void initialsEl.offsetWidth; initialsEl.classList.add('shake');
          showToast('Enter initials', colors.coral);
          return;
        }
        try { localStorage.setItem('arcade-initials', name); } catch (e) {}
        saveBtn.disabled = true;
        var label = saveBtn.textContent;
        saveBtn.textContent = 'Saving…';
        fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ game: GAME, name: name, score: score })
        }).then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
          .then(function () {
            overlay.classList.remove('entry-on');
            var key = name + '|' + score;
            return boardCache.then(function (scores) {
              var list = (scores || []).slice();
              list.push({ name: name, score: score });
              list.sort(function (a, b) { return b.score - a.score; });
              list = list.slice(0, 10);
              boardCache = Promise.resolve(list);
              renderBoard(list, key);
            });
          })
          .catch(function () { showToast("Couldn't save — offline?", colors.coral); })
          .then(function () { saveBtn.disabled = false; saveBtn.textContent = label; });
      });

      var viewLeadersBtn = document.getElementById('viewLeaders');
      var boardBackBtn = document.getElementById('boardBack');
      var skipBtn = document.getElementById('skipSave');
      function showLeaders() {
        overlay.classList.add('leaders-on');
        fetchBoard().then(function (scores) { renderBoard(scores, null, true); });
        setTimeout(function(){ boardBackBtn.focus({preventScroll:true}); }, 120);
      }
      function hideLeaders() {
        overlay.classList.remove('leaders-on');
        setTimeout(function(){ viewLeadersBtn.focus({preventScroll:true}); }, 120);
      }
      viewLeadersBtn.addEventListener('click', showLeaders);
      boardBackBtn.addEventListener('click', hideLeaders);
      skipBtn.addEventListener('click', function () {
        overlay.classList.remove('entry-on');
        fetchBoard().then(function (scores) { renderBoard(scores, null); });
      });

      startBtn.addEventListener('click', startGame);
      if (window.location.hash === '#leaders') { showLeaders(); }
      canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); drop(); });
      document.addEventListener('keydown', function(e){
        if ((e.code === 'Space' || e.code === 'Enter') && state === 'playing') { e.preventDefault(); drop(); }
      });
      soundBtn.addEventListener('click', function(e){
        e.stopPropagation(); muted = !muted;
        soundBtn.setAttribute('aria-pressed', String(!muted));
        soundBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Mute sound');
        if (!muted) { initAudio(); tone(620,.1,'sine',.04,0); }
      });
      document.addEventListener('visibilitychange', function(){ last = performance.now(); });
      document.addEventListener('pointerdown', function(){ initAudio(); }, {once:true});

      function drawBlock(x, y, w, color) {
        var h = bh - 3;
        ctx.fillStyle = color;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x, y, w, h, 5); else ctx.rect(x, y, w, h);
        ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.16)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x + 4, y + 4, Math.max(1, w - 8), 3, 2);
        else ctx.rect(x + 4, y + 4, Math.max(1, w - 8), 3);
        ctx.fill();
      }

      function update(dt) {
        if (state === 'playing' && mover) {
          mover.x += mover.dir * speed * dt;
          if (mover.x < 16) { mover.x = 16; mover.dir = 1; }
          if (mover.x + mover.w > W - 16) { mover.x = W - 16 - mover.w; mover.dir = -1; }
        }
        if (state === 'dropping' && mover) {
          dropT += dt / .16;
          var t = Math.min(1, dropT);
          mover.y = dropFrom + (dropTo - dropFrom) * t;
          if (dropT >= 1) resolveLanding();
        }
        for (var i = debris.length - 1; i >= 0; i--) {
          var d = debris[i];
          d.vy += 1500 * dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.life -= dt * 1.1;
          if (d.life <= 0 || d.y - cam > H + 200) debris.splice(i, 1);
        }
        if (state === 'falling') {
          fallTimer += dt;
          if (fallTimer > .8) endGame();
        }
        if (reduced) cam = camTarget;
        else cam += (camTarget - cam) * Math.min(1, dt * 5);
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        ctx.translate(0, -cam);
        var i, b, y;
        for (i = 0; i < stack.length; i++) {
          b = stack[i]; y = -(i + 1) * bh;
          if (y - cam > H + 60 || y - cam < -bh - 60) continue;
          drawBlock(b.x, y, b.w, blockColor(i));
        }
        if (mover) {
          if (mover.y - cam > -bh - 60 && mover.y - cam < H + 60) {
            drawBlock(mover.x, mover.y, mover.w, blockColor(stack.length));
          }
        }
        for (i = 0; i < debris.length; i++) {
          var d = debris[i];
          ctx.globalAlpha = Math.max(0, Math.min(1, d.life));
          drawBlock(d.x, d.y, d.w, d.color);
        }
        ctx.globalAlpha = 1;
        ctx.strokeStyle = colors.line;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(0, .5); ctx.lineTo(W, .5); ctx.stroke();
        ctx.restore();
      }

      function loop(t) {
        var dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
