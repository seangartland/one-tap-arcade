<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1634'/%3E%3Crect x='7' y='23' width='18' height='5' rx='1.5' fill='%23040814' stroke='%23aaf5ff' stroke-width='1.3'/%3E%3Crect x='10' y='15' width='12' height='5' rx='1.5' fill='%23040814' stroke='%23aaf5ff' stroke-width='1.3'/%3E%3Cline x1='12' y1='8' x2='12' y2='15' stroke='%23ffd166' stroke-width='1.4' stroke-dasharray='2 2'/%3E%3Cline x1='20' y1='8' x2='20' y2='15' stroke='%23ffd166' stroke-width='1.4' stroke-dasharray='2 2'/%3E%3Crect x='13' y='5' width='6' height='5' rx='1.5' fill='%23f4fbff'/%3E%3Crect x='22' y='18' width='6' height='3' rx='1' fill='%23ff2bd6' transform='rotate(16 25 19)'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070f" />
  <title>Tower - a one-tap stacking game</title>
  <link rel="stylesheet" href="/shared/arcade.css" />
  <style>
    .mark:has(svg) svg { filter: none; }
    #score { color: #ffd166; text-shadow: 0 0 14px rgba(255,209,102,.5); }
  </style>
</head>
<body class="game">
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Tower stacking game. Tap or press space to drop the moving block onto the stack."></canvas>
    <div class="hud" aria-live="polite">
      <span class="score" id="score">0</span>
    </div>
    <div class="hint">Tap anywhere · Space</div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 120 68" aria-hidden="true"><rect x="6" y="60" width="108" height="1.6" fill="#aaf5ff" opacity=".9"/><rect x="6" y="55" width="108" height="8" fill="#aaf5ff" opacity=".1"/><g><rect x="26" y="48" width="68" height="9" rx="2" fill="#040814"/><rect x="26" y="48" width="68" height="9" rx="2" fill="none" stroke="#7edcff" stroke-opacity=".22" stroke-width="3.2"/><rect x="26" y="48" width="68" height="9" rx="2" fill="none" stroke="#aaf5ff" stroke-opacity=".85" stroke-width="1.2"/></g><g><rect x="36" y="37" width="48" height="9" rx="2" fill="#040814"/><rect x="36" y="37" width="48" height="9" rx="2" fill="none" stroke="#7edcff" stroke-opacity=".22" stroke-width="3.2"/><rect x="36" y="37" width="48" height="9" rx="2" fill="none" stroke="#aaf5ff" stroke-opacity=".85" stroke-width="1.2"/></g><g><rect x="42" y="26" width="36" height="9" rx="2" fill="#040814"/><rect x="42" y="26" width="36" height="9" rx="2" fill="none" stroke="#7edcff" stroke-opacity=".22" stroke-width="3.2"/><rect x="42" y="26" width="36" height="9" rx="2" fill="none" stroke="#aaf5ff" stroke-opacity=".85" stroke-width="1.2"/></g><g><line x1="43" y1="13" x2="43" y2="25" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="3 3.5" opacity=".9"/><line x1="77" y1="13" x2="77" y2="25" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="3 3.5" opacity=".9"/><line x1="42" y1="25.7" x2="78" y2="25.7" stroke="#ffd166" stroke-width="1.5" stroke-dasharray="4 3" opacity=".9"/></g><rect x="56.8" y="13" width="7" height="12.5" fill="#ffffff" opacity=".12"/><rect x="58.4" y="13" width="3.4" height="12.5" fill="#aaf5ff" opacity=".22"/><rect x="59.5" y="13" width="1.3" height="12.5" fill="#ffffff" opacity=".95"/><rect x="58.8" y="1" width="2.4" height="3" fill="#ffffff" opacity=".4"/><rect x="50" y="4" width="20" height="9" rx="2" fill="#f4fbff"/><rect x="50" y="4" width="20" height="9" rx="2" fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="3"/><rect x="50" y="4" width="20" height="9" rx="2" fill="none" stroke="#ffffff" stroke-opacity=".95" stroke-width="1.3"/><circle cx="60" cy="23.5" r="1.8" fill="#ffd166"/><circle cx="60" cy="23.5" r="5.5" stroke="#ffd166" stroke-width="1" fill="none" opacity=".4"/><g transform="rotate(14 97 33)"><rect x="88" y="30" width="18" height="7" rx="1.5" fill="#040814"/><rect x="88" y="30" width="18" height="7" rx="1.5" fill="none" stroke="#ff2bd6" stroke-opacity=".25" stroke-width="2.6"/><rect x="88" y="30" width="18" height="7" rx="1.5" fill="none" stroke="#ff8fea" stroke-opacity=".9" stroke-width="1.1"/></g><rect x="108" y="21" width="4.2" height="4.2" fill="#ff2bd6" opacity=".85" transform="rotate(22 110 23)"/><rect x="111" y="40" width="3.4" height="3.4" fill="#ff2bd6" opacity=".65" transform="rotate(42 112 41)"/></svg></div>
    </section>
  </main>

  <script>
    window.ARCADE = {
      game: 'tower',
      title: 'Stack the tower.',
      tagline: "Tap to drop the block. Don't let it miss.",
      startLabel: 'Start stacking',
      restartLabel: 'Build again',
      resultLabel: 'Run complete',
      boardHeading: 'Tower · Global leaders'
    };
  </script>
  <script src="/shared/arcade.js"></script>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = Arcade.gameEl;
      var scoreEl = document.getElementById('score');
      var tone = Arcade.tone;
      var showToast = Arcade.showToast;
      var state = 'ready'; // ready | playing | dropping | falling | over
      var W = 0, H = 0, dpr = 1;
      var bh = 30;
      var baseW = 200;
      var stack = [];
      var mover = null;
      var debris = [];
      var sparks = [];
      var bgGrad = null, vigGrad = null;
      var cam = 0, camTarget = 0;
      var speed = 0;
      var spawnDir = 1;
      var score = 0;
      var dropT = 0, dropFrom = 0, dropTo = 0;
      var fallTimer = 0;
      var perfectTol = 7;
      var last = 0;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // APEX palette: cyan player/track, amber target/score, magenta threat, white hot core
      var C_CYAN = [1, 205, 250];
      var C_ICE = [170, 245, 255];
      var C_AMB = [255, 209, 102];
      var C_MAG = [255, 43, 214];
      var C_WHT = [255, 255, 255];
      function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
      function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t | 0, a[1] + (b[1] - a[1]) * t | 0, a[2] + (b[2] - a[2]) * t | 0]; }

      function checkPhase() {
        Arcade.setPhase(Math.min(5, 1 + Math.floor(score / 8)));
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        baseW = Math.max(120, Math.min(230, W * .52));
        bh = Math.max(24, Math.min(36, H * .045));
        bgGrad = ctx.createRadialGradient(W / 2, H * .35, 0, W / 2, H * .35, Math.hypot(W, H) * .8);
        bgGrad.addColorStop(0, '#0a1634'); bgGrad.addColorStop(.55, '#050a1a'); bgGrad.addColorStop(1, '#020308');
        vigGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.min(W, H) * .72);
        vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); vigGrad.addColorStop(1, 'rgba(0,0,0,.62)');
      }
      window.addEventListener('resize', resize, {passive:true});
      resize();

      function stackTop() { return -stack.length * bh; }
      function moverY() { return stackTop() - bh - Math.max(48, H * .08); }
      function updateCamTarget() { camTarget = moverY() - H * .30; }

      function placeSound() {
        tone(210, .09, 'sine', .11, 0);
        tone(320, .07, 'sine', .05, .02);
      }
      function perfectSound() {
        tone(880, .12, 'sine', .08, 0);
        tone(1318, .16, 'sine', .06, .06);
      }
      function missSound() {
        tone(300, .18, 'triangle', .1, 0);
        tone(150, .3, 'triangle', .1, .12);
      }

      function setScore() {
        scoreEl.textContent = String(score);
        checkPhase();
      }

      function spawnMover() {
        var w = stack[stack.length - 1].w;
        spawnDir *= -1;
        mover = {
          x: spawnDir > 0 ? 16 : W - 16 - w,
          y: moverY(),
          w: w,
          dir: spawnDir
        };
        updateCamTarget();
      }

      function startGame() {
        Arcade.startFlow();
        state = 'playing';
        score = 0; Arcade.resetPhase();
        debris = []; sparks = [];
        stack = [{ x: (W - baseW) / 2, w: baseW }];
        speed = Math.max(210, W * .5);
        spawnMover();
        cam = camTarget;
        setScore();
        gameEl.classList.add('playing');
        tone(440, .09, 'sine', .07, 0);
        tone(660, .13, 'sine', .06, .065);
        canvas.focus({preventScroll:true});
      }

      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        Arcade.gameOver({
          score: score,
          title: String(score),
          instruction: score === 0
            ? 'The first block missed. Watch its drift and tap a beat earlier.'
            : (score < 8 ? 'A fine foundation. The blocks pick up speed as you climb.' : 'Tall work. One more tower?'),
          restartLabel: 'Build again'
        });
      }

      function drop() {
        if (state !== 'playing') return;
        Arcade.initAudio();
        state = 'dropping';
        dropT = 0;
        dropFrom = mover.y;
        dropTo = stackTop() - bh;
      }

      function resolveLanding() {
        var prev = stack[stack.length - 1];
        var m = mover;
        var left = Math.max(m.x, prev.x);
        var right = Math.min(m.x + m.w, prev.x + prev.w);
        var overlap = right - left;
        if (overlap <= 0) {
          debris.push({ x: m.x, y: dropTo, w: m.w, vx: m.dir * 120, vy: -60, life: 1, color: C_MAG });
          sparkBurst(m.x + m.w / 2, dropTo + (bh - 3) / 2, C_MAG, 8);
          mover = null;
          state = 'falling'; fallTimer = 0;
          missSound();
          return;
        }
        var dx = m.x - prev.x;
        if (Math.abs(dx) <= perfectTol) {
          stack.push({ x: prev.x, w: prev.w });
          showToast('Perfect', '#ffd166');
          perfectSound();
          score += 4;
        } else {
          var cutW = m.w - overlap;
          var cutX = dx > 0 ? (m.x + m.w - cutW) : m.x;
          debris.push({ x: cutX, y: dropTo, w: cutW, vx: (dx > 0 ? 1 : -1) * 110, vy: -50, life: 1, color: C_MAG });
          sparkBurst(cutX + cutW / 2, dropTo + (bh - 3) / 2, C_MAG, 6);
          stack.push({ x: left, w: overlap });
          placeSound();
        }
        score++;
        speed = Math.min(950, speed + 16);
        setScore();
        spawnMover();
        state = 'playing';
      }

      function sparkBurst(x, y, color, n) {
        if (reduced) n = Math.min(n, 3);
        for (var i = 0; i < n; i++) {
          var a = Math.random() * Math.PI * 2;
          var v = 40 + Math.random() * 130;
          sparks.push({
            x: x, y: y,
            vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60,
            life: 1, size: 2 + Math.random() * 2.5,
            color: color
          });
        }
      }


      ARCADE.onStart = startGame;
      ARCADE.onVisibility = function(){ last = performance.now(); };
      canvas.addEventListener('pointerdown', function(e){ e.preventDefault(); drop(); });
      document.addEventListener('keydown', function(e){
        if ((e.code === 'Space' || e.code === 'Enter') && state === 'playing') { e.preventDefault(); drop(); }
      });

      function slabPath(x, y, w, h, r) {
        var p = new Path2D();
        if (typeof p.roundRect === 'function') p.roundRect(x, y, w, h, r);
        else p.rect(x, y, w, h);
        return p;
      }

      // dark slab with a stacked-stroke glow edge (no shadowBlur)
      function drawSlab(x, y, w, color, core) {
        var h = bh - 3;
        var p = slabPath(x, y, w, h, 5);
        ctx.fillStyle = '#040814';
        ctx.fill(p);
        ctx.lineJoin = 'round';
        ctx.strokeStyle = rgba(color, .08); ctx.lineWidth = 7;   ctx.stroke(p);
        ctx.strokeStyle = rgba(color, .2);  ctx.lineWidth = 2.6; ctx.stroke(p);
        ctx.strokeStyle = core;             ctx.lineWidth = 1.4; ctx.stroke(p);
      }

      function drawMoverSliding(m) {
        var len = Math.min(34, m.w * .9);
        var hy = m.y + (bh - 3) / 2;
        var tx = m.dir > 0 ? m.x - len : m.x + m.w;
        ctx.fillStyle = rgba(C_CYAN, .07); ctx.fillRect(tx, hy - 3, len, 6);
        ctx.fillStyle = rgba(C_ICE, .16);  ctx.fillRect(tx, hy - 2, len * .7, 4);
        ctx.fillStyle = rgba(C_ICE, .75);  ctx.fillRect(tx, hy - .8, len * .4, 1.6);
      }

      // white-hot falling slab with a motion streak
      function drawFalling(m) {
        var h = bh - 3;
        var cx = m.x + m.w / 2;
        var sy = m.y + h;
        var ty = stackTop();
        var ln = Math.max(4, ty - sy);
        var trail = Math.min(h * 1.5, dropFrom - m.y);
        ctx.fillStyle = 'rgba(255,255,255,.1)';  ctx.fillRect(cx - 4.5, sy, 9, ln);
        ctx.fillStyle = 'rgba(170,245,255,.22)'; ctx.fillRect(cx - 2, sy, 4, ln);
        ctx.fillStyle = 'rgba(255,255,255,.9)';  ctx.fillRect(cx - .9, sy, 1.8, ln);
        if (trail > 2) {
          ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(cx - 4.5, m.y - trail, 9, trail);
          ctx.fillStyle = 'rgba(255,255,255,.5)';  ctx.fillRect(cx - .9, m.y - trail, 1.8, trail);
        }
        var p = slabPath(m.x, m.y, m.w, h, 5);
        ctx.fillStyle = '#f4fbff';
        ctx.fill(p);
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 3.2; ctx.stroke(p);
        ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.4; ctx.stroke(p);
      }

      // amber gates framing the projected landing slot
      function landingGates() {
        var prev = stack[stack.length - 1];
        var m = mover;
        var left = Math.max(m.x, prev.x);
        var right = Math.min(m.x + m.w, prev.x + prev.w);
        if (right - left <= 0) { left = prev.x; right = prev.x + prev.w; }
        var yt = stackTop() - bh;
        var x0 = left + 1, x1 = right - 1;
        ctx.setLineDash([4, 5]);
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = rgba(C_AMB, .85);
        ctx.beginPath();
        ctx.moveTo(x0, yt); ctx.lineTo(x0, yt + bh);
        ctx.moveTo(x1, yt); ctx.lineTo(x1, yt + bh);
        ctx.moveTo(x0, yt); ctx.lineTo(x1, yt);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = rgba(C_AMB, .95);
        ctx.beginPath(); ctx.arc((x0 + x1) / 2, yt + bh / 2, 2, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = rgba(C_AMB, .25);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc((x0 + x1) / 2, yt + bh / 2, 6.5, 0, Math.PI * 2); ctx.stroke();
      }

      function update(dt) {
        if (state === 'playing' && mover) {
          mover.x += mover.dir * speed * dt;
          if (mover.x < 16) { mover.x = 16; mover.dir = 1; }
          if (mover.x + mover.w > W - 16) { mover.x = W - 16 - mover.w; mover.dir = -1; }
        }
        if (state === 'dropping' && mover) {
          dropT += dt / .16;
          var t = Math.min(1, dropT);
          mover.y = dropFrom + (dropTo - dropFrom) * t;
          if (dropT >= 1) resolveLanding();
        }
        for (var i = debris.length - 1; i >= 0; i--) {
          var d = debris[i];
          d.vy += 1500 * dt;
          d.x += d.vx * dt;
          d.y += d.vy * dt;
          d.life -= dt * 1.1;
          if (d.life <= 0 || d.y - cam > H + 200) debris.splice(i, 1);
        }
        for (var s = sparks.length - 1; s >= 0; s--) {
          var sp = sparks[s];
          sp.vy += 1100 * dt;
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          sp.life -= dt * 2.1;
          if (sp.life <= 0) sparks.splice(s, 1);
        }
        if (state === 'falling') {
          fallTimer += dt;
          if (fallTimer > .8) endGame();
        }
        if (reduced) cam = camTarget;
        else cam += (camTarget - cam) * Math.min(1, dt * 5);
      }

      function drawGrid() {
        var sp = 60, i, x, y;
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(40,130,255,.06)';
        ctx.beginPath();
        for (i = 0; i <= W / sp + 1; i++) { x = i * sp; ctx.moveTo(x, cam); ctx.lineTo(x, cam + H); }
        for (i = Math.floor(cam / sp); i * sp <= cam + H + sp; i++) { y = i * sp; ctx.moveTo(0, y); ctx.lineTo(W, y); }
        ctx.stroke();
        ctx.lineWidth = 1.4;
        ctx.strokeStyle = 'rgba(90,170,255,.12)';
        ctx.beginPath();
        for (i = 0; i <= W / sp + 1; i++) { if (i % 5 === 0) { x = i * sp; ctx.moveTo(x, cam); ctx.lineTo(x, cam + H); } }
        for (i = Math.floor(cam / sp); i * sp <= cam + H + sp; i++) { if (i % 5 === 0) { y = i * sp; ctx.moveTo(0, y); ctx.lineTo(W, y); } }
        ctx.stroke();
      }

      function drawFloor() {
        var g = ctx.createLinearGradient(0, -6, 0, bh * 2.2);
        g.addColorStop(0, 'rgba(170,245,255,.18)');
        g.addColorStop(1, 'rgba(170,245,255,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, -6, W, bh * 2.2 + 6);
        ctx.strokeStyle = 'rgba(170,245,255,.18)';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(0, 1); ctx.lineTo(W, 1); ctx.stroke();
        ctx.strokeStyle = 'rgba(170,245,255,.8)';
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(0, .8); ctx.lineTo(W, .8); ctx.stroke();
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        ctx.translate(0, -cam);
        drawGrid();
        drawFloor();
        if (mover && (state === 'playing' || state === 'dropping')) landingGates();
        var i, b, y;
        for (i = 0; i < stack.length; i++) {
          b = stack[i]; y = -(i + 1) * bh;
          if (y - cam > H + 60 || y - cam < -bh - 60) continue;
          drawSlab(b.x, y, b.w, C_CYAN, rgba(C_ICE, .95));
        }
        if (mover) {
          if (mover.y - cam > -bh - 60 && mover.y - cam < H + 60) {
            if (state === 'dropping') drawFalling(mover);
            else { drawMoverSliding(mover); drawSlab(mover.x, mover.y, mover.w, C_CYAN, rgba(C_ICE, .95)); }
          }
        }
        for (i = 0; i < debris.length; i++) {
          var d = debris[i];
          ctx.globalAlpha = Math.max(0, Math.min(1, d.life));
          drawSlab(d.x, d.y, d.w, C_MAG, rgba(mixc(C_MAG, C_WHT, .45), .95));
        }
        ctx.globalAlpha = 1;
        for (i = 0; i < sparks.length; i++) {
          var sp = sparks[i];
          ctx.globalAlpha = Math.max(0, Math.min(1, sp.life));
          ctx.fillStyle = rgba(sp.color, 1);
          var sz = Math.max(.6, sp.size * sp.life);
          ctx.fillRect(sp.x - sz / 2, sp.y - sz / 2, sz, sz);
        }
        ctx.globalAlpha = 1;
        ctx.restore();
        ctx.fillStyle = vigGrad;
        ctx.fillRect(0, 0, W, H);
      }

      function loop(t) {
        var dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
        update(dt);
        draw();
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
