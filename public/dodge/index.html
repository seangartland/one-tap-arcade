<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0e18'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%239a8ff5'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0c0e18" />
  <link rel="icon" href="data:," />
  <title>Dodge — a one-drag comet game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;650;750&display=swap');

    :root {
      color-scheme: dark;
      --paper: #0c0e18;
      --ink: #f1efff;
      --muted: #a3a3c2;
      --line: rgba(241,239,255,.15);
      --cyan: #4bc7cf;
      --coral: #ff765f;
      --lime: #a78bfa;
      --panel: rgba(12,14,24,.85);
      --shadow: rgba(0,0,0,.5);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; }
    body {
      min-height: 100svh;
      background: var(--paper);
      color: var(--ink);
      font-family: Manrope, ui-sans-serif, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
      user-select: none;
    }
    button { font: inherit; }

    .game {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 480px;
      isolation: isolate;
      background:
        radial-gradient(circle at 22% 14%, color-mix(in srgb, var(--lime) 16%, transparent), transparent 31%),
        radial-gradient(circle at 82% 83%, color-mix(in srgb, var(--cyan) 14%, transparent), transparent 34%),
        var(--paper);
    }
    .grain {
      pointer-events: none;
      position: absolute;
      inset: 0;
      opacity: .09;
      z-index: 4;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.95' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.25'/%3E%3C/svg%3E");
      mix-blend-mode: screen;
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
      cursor: crosshair;
    }

    .hud {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: max(24px, env(safe-area-inset-left));
      right: max(24px, env(safe-area-inset-right));
      display: flex;
      justify-content: center;
      align-items: flex-start;
      pointer-events: none;
      z-index: 3;
    }
    .score-wrap { display: flex; align-items: baseline; gap: 10px; }
    .score {
      font: 500 clamp(30px, 5vw, 48px)/1 DM Mono, monospace;
      letter-spacing: -.06em;
      min-width: 2ch;
    }
    .multiplier {
      color: var(--coral);
      font: 500 13px/1 DM Mono, monospace;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity .18s, transform .18s;
    }
    .multiplier.show { opacity: 1; transform: translateY(0); }
    .lives { display: none; }

    .sound {
      position: absolute;
      z-index: 6;
      right: max(20px, env(safe-area-inset-right));
      bottom: max(20px, env(safe-area-inset-bottom));
      width: 44px;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: color-mix(in srgb, var(--paper) 78%, transparent);
      display: grid;
      place-items: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
    .sound svg { width: 18px; height: 18px; }
    .sound .off { display: none; }
    .sound[aria-pressed="false"] .on { display: none; }
    .sound[aria-pressed="false"] .off { display: block; }
    .sound:focus-visible, .primary:focus-visible, .linklike:focus-visible, .home:focus-visible { outline: 3px solid var(--cyan); outline-offset: 3px; }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 5;
      display: grid;
      place-items: center;
      padding: 28px;
      background: color-mix(in srgb, var(--paper) 48%, transparent);
      backdrop-filter: blur(7px);
      transition: opacity .3s ease, visibility .3s;
    }
    .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .card {
      width: min(430px, 100%);
      text-align: center;
      padding: 34px 28px 30px;
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: 0 24px 80px var(--shadow);
      border-radius: 28px 28px 10px 28px;
    }
    .mark {
      width: 72px;
      height: 72px;
      margin: 0 auto 25px;
      position: relative;
      border: 1px solid var(--line);
      border-radius: 50%;
    }
    .mark::before {
      content: "";
      position: absolute;
      width: 12px;
      height: 12px;
      left: 50%;
      top: -6px;
      margin-left: -6px;
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 0 5px color-mix(in srgb, var(--cyan) 20%, transparent);
    }
    .mark::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 8px;
      left: 50%;
      bottom: -5px;
      margin-left: -10px;
      background: var(--lime);
      border-radius: 8px;
    }
    h1 {
      margin: 0;
      font-size: clamp(32px, 8vw, 54px);
      letter-spacing: -.055em;
      line-height: .96;
      font-weight: 750;
    }
    .instruction {
      margin: 18px auto 26px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 16px;
      max-width: 28ch;
    }
    .key {
      display: inline-block;
      padding: 1px 6px 2px;
      margin: 0 1px;
      border: 1px solid var(--line);
      border-bottom-width: 2px;
      border-radius: 6px;
      color: var(--ink);
      font: 500 12px/1.45 DM Mono, monospace;
      vertical-align: 1px;
    }
    .primary {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px 20px 16px;
      color: #101312;
      background: var(--lime);
      font-size: 15px;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 5px 0 color-mix(in srgb, var(--lime) 55%, #2c2148);
      transform: translateY(0);
      transition: transform .1s, box-shadow .1s;
    }
    .primary:active { transform: translateY(4px); box-shadow: 0 1px 0 color-mix(in srgb, var(--lime) 55%, #2c2148); }
    .result-label {
      display: none;
      color: var(--coral);
      font: 500 12px/1 DM Mono, monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .overlay.over .mark { display: none; }
    .overlay.over .result-label { display: block; }
    .overlay.over h1 { font-family: DM Mono, monospace; letter-spacing: -.075em; }
    .overlay.over .instruction { margin-bottom: 9px; }
    .session-best {
      display: none;
      margin: 0 0 26px;
      color: var(--muted);
      font: 400 12px/1.4 DM Mono, monospace;
    }
    .overlay.over .session-best { display: block; }
    #entry, #board { display: none; margin: 0 0 22px; }
    .overlay.over.entry-on #entry { display: block; }
    .overlay.over.board-on #board { display: block; }
    #entry label {
      display: block;
      margin: 0 0 10px;
      color: var(--muted);
      font: 500 11px/1 DM Mono, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .entry-row { display: flex; gap: 10px; align-items: stretch; }
    #initials {
      width: 4.8ch;
      padding: 10px 4px;
      text-align: center;
      font: 500 24px/1.2 DM Mono, monospace;
      letter-spacing: .22em;
      text-indent: .22em;
      text-transform: uppercase;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    #initials:focus { outline: 3px solid var(--cyan); outline-offset: 2px; }
    #initials.shake { animation: ishake .32s; border-color: var(--coral); }
    @keyframes ishake {
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-3px); }
    }
    .entry-row .primary { flex: 1; width: auto; }
    #saveScore:disabled { opacity: .55; cursor: default; }
    #board h2 {
      margin: 0 0 10px;
      color: var(--muted);
      font: 500 11px/1 DM Mono, monospace;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    #boardList {
      list-style: none;
      margin: 0;
      padding: 0;
      font: 400 13px/2 DM Mono, monospace;
      color: var(--muted);
    }
    #boardList li { display: flex; justify-content: space-between; gap: 12px; }
    #boardList li.me { color: var(--coral); }
    #boardList li.empty { justify-content: center; }
    .linklike {
      background: transparent;
      border: 0;
      padding: 6px 8px;
      color: var(--muted);
      font: 500 12px/1.6 DM Mono, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      cursor: pointer;
    }
    .linklike:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
    #skipSave { margin-top: 12px; }
    .card-foot { margin-top: 18px; }
    #boardBack { display: none; margin-top: 14px; }
    .overlay.over .card-foot { display: none; }
    .overlay.leaders-on #entry { display: none !important; }
    .overlay.leaders-on .card-foot { display: none; }
    .overlay.leaders-on #board { display: block; }
    .overlay.leaders-on #boardBack { display: inline-block; }
    .home {
      position: absolute;
      z-index: 6;
      top: max(70px, calc(env(safe-area-inset-top) + 46px));
      right: max(20px, env(safe-area-inset-right));
      padding: 8px 4px;
      color: var(--muted);
      font: 500 12px/1 DM Mono, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
      text-decoration: none;
    }
    .home:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

    .toast {
      position: absolute;
      z-index: 3;
      left: 50%;
      top: 18%;
      transform: translate(-50%, 8px);
      opacity: 0;
      color: var(--ink);
      font: 500 13px/1 DM Mono, monospace;
      letter-spacing: .09em;
      text-transform: uppercase;
      pointer-events: none;
    }
    .toast.pop { animation: toast .55s ease-out; }
    @keyframes toast {
      0% { opacity: 0; transform: translate(-50%, 10px) scale(.9); }
      25% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      70% { opacity: 1; transform: translate(-50%, -4px); }
      100% { opacity: 0; transform: translate(-50%, -13px); }
    }
    .hint {
      position: absolute;
      z-index: 3;
      bottom: max(27px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      color: var(--muted);
      font: 400 11px/1 DM Mono, monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      pointer-events: none;
      opacity: .78;
      transition: opacity .3s;
    }
    .playing .hint { opacity: 0; }

    @media (max-width: 520px) {
      .game { min-height: 420px; }
      .hud { top: max(18px, env(safe-area-inset-top)); left: 19px; right: 19px; }
      .sound { right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); width: 42px; height: 42px; }
      .card { padding: 29px 22px 24px; border-radius: 24px 24px 8px 24px; }
      .hint { bottom: max(28px, env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) {
      .overlay, .multiplier, .life, .primary { transition: none; }
      .toast.pop { animation-duration: .01ms; }
    }
  </style>
</head>
<body>
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Dodge the falling shards. Drag anywhere or use arrow keys to steer the comet."></canvas>
    <div class="hud" aria-live="polite">
      <div class="score-wrap">
        <span class="score" id="score">0</span>
      </div>
    </div>
    <div class="toast" id="toast" aria-live="polite"></div>
    <div class="hint">Drag anywhere · <span class="key">WASD</span></div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="card">
        <div class="mark" aria-hidden="true"></div>
        <div class="result-label">Dive complete</div>
        <h1 id="title">Dodge.</h1>
        <p class="instruction" id="instruction">Drag the comet. Don't touch the storm.</p>
        <p class="session-best" id="sessionBest">Session best · 0</p>
        <div id="entry">
          <label for="initials">Enter your initials</label>
          <div class="entry-row">
            <input id="initials" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your initials" />
            <button id="saveScore" class="primary" type="button">Save score</button>
          </div>
          <button class="linklike" id="skipSave" type="button">Skip</button>
        </div>
        <div id="board" aria-live="polite">
          <h2>Dodge · Global leaders</h2>
          <ol id="boardList"></ol>
          <button class="linklike" id="boardBack" type="button">Back</button>
        </div>
        <button class="primary" id="start">Start diving</button>
        <div class="card-foot"><button class="linklike" id="viewLeaders" type="button">Leaderboard</button></div>
      </div>
    </section>

    <button class="sound" id="sound" type="button" aria-label="Mute sound" aria-pressed="true">
      <svg class="on" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z" fill="currentColor"/><path d="M17 9.2c.7.7 1 1.6 1 2.8s-.3 2.1-1 2.8M19.5 6.8c1.4 1.4 2.1 3.1 2.1 5.2s-.7 3.8-2.1 5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 9v6h4l5 4V5L9 9H5Z" fill="currentColor"/><path d="m17.5 9 4 4m0-4-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <a class="home" href="../">Arcade</a>
    <div class="grain" aria-hidden="true"></div>
  </main>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = document.getElementById('game');
      var overlay = document.getElementById('overlay');
      var startBtn = document.getElementById('start');
      var scoreEl = document.getElementById('score');
      var toast = document.getElementById('toast');
      var soundBtn = document.getElementById('sound');
      var instructionEl = document.getElementById('instruction');
      var sessionBestEl = document.getElementById('sessionBest');
      var entryEl = document.getElementById('entry');
      var boardEl = document.getElementById('board');
      var boardList = document.getElementById('boardList');
      var initialsEl = document.getElementById('initials');
      var saveBtn = document.getElementById('saveScore');
      var GAME = 'dodge';
      var boardCache = null;

      function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function fetchBoard() {
        boardCache = fetch('/api/scores?game=' + GAME + '&_=' + Date.now())
          .then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
          .then(function (d) { return (d && d.scores) || []; })
          .catch(function () { return null; });
        return boardCache;
      }
      function renderBoard(scores, highlightKey, force) {
        if ((!scores || !scores.length) && !force) { overlay.classList.remove('board-on'); return; }
        var html = '';
        if (scores && scores.length) {
          var done = false;
          scores.slice(0, 10).forEach(function (s, i) {
            var key = s.name + '|' + s.score;
            var me = highlightKey && !done && key === highlightKey;
            if (me) done = true;
            html += '<li' + (me ? ' class="me"' : '') + '><span>' + (i + 1) + '. ' + esc(s.name) + '</span><span>' + esc(s.score) + '</span></li>';
          });
        } else {
          html = '<li class="empty"><span>No scores yet — be the first.</span></li>';
        }
        boardList.innerHTML = html;
        overlay.classList.add('board-on');
      }
      saveBtn.addEventListener('click', function () {
        var name = (initialsEl.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
        if (!name) {
          initialsEl.classList.remove('shake'); void initialsEl.offsetWidth; initialsEl.classList.add('shake');
          showToast('Enter initials', colors.coral);
          return;
        }
        try { localStorage.setItem('arcade-initials', name); } catch (e) {}
        saveBtn.disabled = true;
        var label = saveBtn.textContent;
        saveBtn.textContent = 'Saving…';
        fetch('/api/scores', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ game: GAME, name: name, score: score })
        }).then(function (r) { if (!r.ok) throw new Error('bad'); return r.json(); })
          .then(function () {
            overlay.classList.remove('entry-on');
            var key = name + '|' + score;
            return boardCache.then(function (scores) {
              var list = (scores || []).slice();
              list.push({ name: name, score: score });
              list.sort(function (a, b) { return b.score - a.score; });
              list = list.slice(0, 10);
              boardCache = Promise.resolve(list);
              renderBoard(list, key);
            });
          })
          .catch(function () { showToast("Couldn't save — offline?", colors.coral); })
          .then(function () { saveBtn.disabled = false; saveBtn.textContent = label; });
      });
      var viewLeadersBtn = document.getElementById('viewLeaders');
      var boardBackBtn = document.getElementById('boardBack');
      var skipBtn = document.getElementById('skipSave');
      function showLeaders() {
        overlay.classList.add('leaders-on');
        fetchBoard().then(function (scores) { renderBoard(scores, null, true); });
        setTimeout(function(){ boardBackBtn.focus({preventScroll:true}); }, 120);
      }
      function hideLeaders() {
        overlay.classList.remove('leaders-on');
        setTimeout(function(){ viewLeadersBtn.focus({preventScroll:true}); }, 120);
      }
      viewLeadersBtn.addEventListener('click', showLeaders);
      boardBackBtn.addEventListener('click', hideLeaders);
      skipBtn.addEventListener('click', function () {
        overlay.classList.remove('entry-on');
        fetchBoard().then(function (scores) { renderBoard(scores, null); });
      });

      var state = 'ready';
      var W = 0, H = 0, dpr = 1;
      var score = 0;
      var scoreFloat = 0;
      var elapsed = 0;
      var phase = 1;
      var sessionBest = 0;
      var last = 0;
      var particles = [];
      var rings = [];
      var shards = [];
      var stars = [];
      var trail = [];
      var nebulas = [];
      var flash = 0;
      var redPulse = 0;
      var shake = 0;
      var muted = false;
      var audio = null;
      var audioOut = null;
      var colors = {};
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // player
      var px = 0, py = 0, tx = 0, ty = 0;
      var keys = {};
      var KEY_SPEED = 460;
      var HIT_R = 21;
      var GRAZE_R = 54;

      function css(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }
      function refreshColors() {
        colors.paper = css('--paper'); colors.ink = css('--ink'); colors.muted = css('--muted');
        colors.line = css('--line'); colors.cyan = css('--cyan'); colors.coral = css('--coral'); colors.lime = css('--lime');
      }
      refreshColors();

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        px = tx = W / 2; py = ty = H * .68;
        initField();
      }
      window.addEventListener('resize', resize, {passive:true});

      function rand(min, max) { return min + Math.random() * (max - min); }

      function initField() {
        stars = [];
        var n = Math.round(Math.min(170, W * H / 9000));
        for (var i = 0; i < n; i++) {
          stars.push({ x: Math.random() * W, y: Math.random() * H, s: rand(.6, 1.9), spd: rand(10, 42), tw: Math.random() * Math.PI * 2 });
        }
        nebulas = [
          { x: W * .2, y: H * .25, r: Math.max(W, H) * .32, c: '167,139,250', vx: 6, vy: 3, ph: 0 },
          { x: W * .82, y: H * .7, r: Math.max(W, H) * .28, c: '75,199,207', vx: -5, vy: 4, ph: 2 },
          { x: W * .6, y: H * .1, r: Math.max(W, H) * .22, c: '120,110,220', vx: 4, vy: -3, ph: 4 }
        ];
      }

      function initAudio(onReady) {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        if (!audio) {
          audio = new AudioContext();
          audioOut = audio.createGain();
          audioOut.gain.value = .9;
          audioOut.connect(audio.destination);
        }
        if (audio.state === 'suspended') {
          audio.resume().then(function () { if (onReady) onReady(); }).catch(function () {});
        } else if (onReady) {
          onReady();
        }
      }
      function tone(freq, duration, type, volume, delay) {
        if (muted) return;
        initAudio(function () {
          var when = audio.currentTime + (delay || 0);
          var o = audio.createOscillator();
          var g = audio.createGain();
          o.type = type || 'sine'; o.frequency.setValueAtTime(freq, when);
          g.gain.setValueAtTime(.0001, when);
          g.gain.exponentialRampToValueAtTime(volume || .09, when + .012);
          g.gain.exponentialRampToValueAtTime(.0001, when + duration);
          o.connect(g); g.connect(audioOut);
          o.start(when); o.stop(when + duration + .03);
        });
      }
      function grazeSound() {
        tone(880, .1, 'sine', .07, 0);
        tone(1318, .12, 'sine', .05, .045);
      }
      function deathSound() {
        tone(96, .32, 'sine', .2, 0);
        tone(58, .5, 'triangle', .16, .02);
        tone(180, .18, 'sawtooth', .06, 0);
      }

      function setScore() {
        scoreEl.textContent = String(score);
      }
      function showToast(text, color) {
        toast.textContent = text;
        toast.style.color = color || colors.ink;
        toast.classList.remove('pop'); void toast.offsetWidth; toast.classList.add('pop');
      }

      function spawnShard() {
        var size = rand(9, 15);
        shards.push({
          x: rand(-10, W + 10),
          y: -30,
          vx: rand(-46, 46),
          vy: (150 + elapsed * 4.2 + rand(0, 90)) * (1 + (phase - 1) * .16),
          size: size,
          rot: rand(0, Math.PI * 2),
          spin: rand(-2.4, 2.4),
          grazed: false
        });
      }

      function startGame() {
        initAudio();
        state = 'playing';
        score = 0; scoreFloat = 0; elapsed = 0; phase = 1;
        shards = []; particles = []; rings = []; trail = [];
        flash = 0; redPulse = 0; shake = 0;
        spawnTimer = .6;
        px = tx = W / 2; py = ty = H * .68;
        setScore();
        overlay.classList.add('hidden'); overlay.classList.remove('over');
        gameEl.classList.add('playing');
        tone(440, .09, 'sine', .07, 0);
        tone(660, .13, 'sine', .06, .065);
        canvas.focus({preventScroll:true});
      }
      var spawnTimer = 0;

      function burst(x, y, color, count) {
        if (reduced) count = Math.min(count, 4);
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2;
          var v = rand(55, 190);
          particles.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, size:rand(2,5), color:color});
        }
      }

      function die() {
        if (state !== 'playing') return;
        state = 'dying';
        deathSound();
        burst(px, py, colors.cyan, 26);
        burst(px, py, colors.lime, 16);
        shake = reduced ? 0 : 13;
        flash = .4;
        setTimeout(endGame, 420);
      }

      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        sessionBest = Math.max(sessionBest, score);
        document.getElementById('title').textContent = String(score);
        instructionEl.textContent = score === 0 ? 'The storm caught you instantly. Keep moving.' : (score < 20 ? 'Nice dodge. The storm only gets meaner.' : 'Sharp flying. One more dive?');
        sessionBestEl.textContent = 'Session best · ' + sessionBest;
        startBtn.textContent = 'Dive again';
        overlay.classList.add('over'); overlay.classList.remove('hidden');
        overlay.classList.remove('entry-on', 'board-on', 'leaders-on');
        boardList.innerHTML = '';
        if (score > 0) {
          try { initialsEl.value = localStorage.getItem('arcade-initials') || ''; } catch (e) {}
          overlay.classList.add('entry-on');
        }
        fetchBoard();
        setTimeout(function(){ startBtn.focus({preventScroll:true}); }, 320);
      }

      function pointFromEvent(e) {
        return { x: e.clientX, y: e.clientY };
      }
      canvas.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        initAudio();
        var p = pointFromEvent(e);
        tx = p.x; ty = p.y;
      });
      window.addEventListener('pointermove', function (e) {
        if (state !== 'playing') return;
        tx = e.clientX; ty = e.clientY;
      }, {passive:true});

      document.addEventListener('keydown', function (e) {
        keys[e.code] = true;
        if (state === 'playing' && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code) >= 0) e.preventDefault();
      });
      document.addEventListener('keyup', function (e) { keys[e.code] = false; });

      startBtn.addEventListener('click', startGame);
      if (window.location.hash === '#leaders') { showLeaders(); }
      soundBtn.addEventListener('click', function(e){
        e.stopPropagation(); muted = !muted;
        soundBtn.setAttribute('aria-pressed', String(!muted));
        soundBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Mute sound');
        if (!muted) { initAudio(); tone(620,.1,'sine',.04,0); }
      });
      document.addEventListener('visibilitychange', function(){ last = performance.now(); });
      document.addEventListener('pointerdown', function(){ initAudio(); }, {once:true});

      function update(dt) {
        elapsed += dt;
        var newPhase = 1 + Math.floor(elapsed / 15);
        if (newPhase !== phase) {
          phase = newPhase;
          showToast('Storm intensifies', colors.coral);
          tone(520, .12, 'sine', .06, 0);
          tone(392, .16, 'sine', .05, .09);
        }

        scoreFloat += dt;
        if (state === 'playing') {
          var s = Math.floor(scoreFloat);
          if (s !== score) { score = s; setScore(); }
        }

        // keyboard steering overrides pointer target
        var kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
        var ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
        if (kx || ky) {
          var len = Math.hypot(kx, ky);
          tx = px + kx / len * KEY_SPEED * .25;
          ty = py + ky / len * KEY_SPEED * .25;
        }

        // comet follows pointer with lag
        var k = Math.min(1, dt * 11);
        px += (tx - px) * k;
        py += (ty - py) * k;
        var m = 14;
        px = Math.max(m, Math.min(W - m, px));
        py = Math.max(m, Math.min(H - m, py));

        trail.push({x: px, y: py});
        if (trail.length > 26) trail.shift();

        // spawn shards
        if (state === 'playing') {
          spawnTimer -= dt;
          var interval = Math.max(.26, 1.02 - elapsed * .011);
          if (spawnTimer <= 0) { spawnShard(); spawnTimer = interval * rand(.75, 1.25); }
        }

        // update shards
        for (var i = shards.length - 1; i >= 0; i--) {
          var sh = shards[i];
          sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.rot += sh.spin * dt;
          if (state === 'playing') {
            var dx = sh.x - px, dy = sh.y - py;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < HIT_R + sh.size * .5) { die(); return; }
            if (!sh.grazed && dist < GRAZE_R && dist >= HIT_R + sh.size * .5) sh.grazed = true;
            if (sh.grazed && sh.y > py + 42) {
              sh.grazed = false;
              score += 2; scoreFloat += 2; setScore();
              grazeSound();
              rings.push({x: sh.x, y: sh.y, r: 8, life: 1, color: colors.cyan});
              redPulse = .55;
              showToast('+2 close call', colors.cyan);
            }
          }
          if (sh.y > H + 40 || sh.x < -60 || sh.x > W + 60) shards.splice(i, 1);
        }

        // starfield drift
        for (var st = 0; st < stars.length; st++) {
          var star = stars[st];
          star.y += star.spd * dt; star.tw += dt * 2;
          if (star.y > H + 4) { star.y = -4; star.x = Math.random() * W; }
        }
        for (var nb = 0; nb < nebulas.length; nb++) {
          var neb = nebulas[nb];
          neb.x += neb.vx * dt; neb.y += neb.vy * dt; neb.ph += dt * .3;
          if (neb.x < -neb.r) neb.x = W + neb.r; if (neb.x > W + neb.r) neb.x = -neb.r;
          if (neb.y < -neb.r) neb.y = H + neb.r; if (neb.y > H + neb.r) neb.y = -neb.r;
        }

        // effects
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= .975; pt.vy *= .975; pt.life -= dt * 1.9;
          if (pt.life <= 0) particles.splice(p, 1);
        }
        for (var rg = rings.length - 1; rg >= 0; rg--) {
          rings[rg].r += dt * 90; rings[rg].life -= dt * 2.2;
          if (rings[rg].life <= 0) rings.splice(rg, 1);
        }
        flash = Math.max(0, flash - dt * 1.7);
        redPulse = Math.max(0, redPulse - dt * 1.4);
        shake = Math.max(0, shake - dt * 46);
      }

      function drawBackground(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        // nebulas
        nebulas.forEach(function (neb) {
          var wob = 1 + .06 * Math.sin(neb.ph);
          var g = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.r * wob);
          g.addColorStop(0, 'rgba(' + neb.c + ',.10)');
          g.addColorStop(1, 'rgba(' + neb.c + ',0)');
          ctx.fillStyle = g;
          ctx.fillRect(neb.x - neb.r, neb.y - neb.r, neb.r * 2, neb.r * 2);
        });

        // stars
        stars.forEach(function (star) {
          ctx.globalAlpha = .35 + .3 * Math.sin(star.tw);
          ctx.fillStyle = colors.ink;
          ctx.fillRect(star.x, star.y, star.s, star.s);
        });
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      function drawGame(t) {
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        // shards
        shards.forEach(function (sh) {
          ctx.save();
          ctx.translate(sh.x, sh.y);
          ctx.rotate(sh.rot);
          ctx.shadowBlur = 14;
          ctx.shadowColor = colors.lime;
          ctx.strokeStyle = colors.lime;
          ctx.lineWidth = 2;
          var r = sh.size;
          ctx.beginPath();
          ctx.moveTo(0, -r); ctx.lineTo(r * .72, 0); ctx.lineTo(0, r); ctx.lineTo(-r * .72, 0);
          ctx.closePath(); ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(167,139,250,.16)';
          ctx.fill();
          ctx.fillStyle = colors.cyan;
          ctx.beginPath(); ctx.arc(0, 0, 1.8, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        });

        // comet trail
        for (var i = 0; i < trail.length; i++) {
          var tp = trail[i];
          var f = i / trail.length;
          ctx.globalAlpha = f * .5;
          ctx.fillStyle = colors.cyan;
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, 2 + f * 7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // comet head
        if (state === 'playing' || state === 'dying') {
          ctx.save();
          ctx.shadowBlur = 22;
          ctx.shadowColor = colors.cyan;
          ctx.fillStyle = colors.cyan;
          ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath(); ctx.arc(px - 2, py - 2, 3.4, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        // particles + rings
        particles.forEach(function (p) {
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
        });
        rings.forEach(function (r) {
          ctx.globalAlpha = Math.max(0, r.life);
          ctx.strokeStyle = r.color; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
        });
        ctx.globalAlpha = 1;
        ctx.restore();

        // vignette
        var vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .36, W / 2, H / 2, Math.max(W, H) * .72);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(4,5,12,.5)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);
        if (redPulse > 0) {
          var rg2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .7);
          rg2.addColorStop(0, 'rgba(255,70,70,0)');
          rg2.addColorStop(1, 'rgba(255,70,70,' + (redPulse * .22).toFixed(3) + ')');
          ctx.fillStyle = rg2;
          ctx.fillRect(0, 0, W, H);
        }
        if (flash > 0) {
          ctx.globalAlpha = flash * .22;
          ctx.fillStyle = colors.coral;
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
      }

      function loop(t) {
        var dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
        if (state === 'playing' || state === 'dying') update(dt);
        else {
          // idle drift behind the start screen
          for (var st = 0; st < stars.length; st++) {
            stars[st].y += stars[st].spd * dt * .4;
            if (stars[st].y > H + 4) { stars[st].y = -4; stars[st].x = Math.random() * W; }
          }
          flash = Math.max(0, flash - dt * 1.7);
          shake = Math.max(0, shake - dt * 46);
        }
        drawBackground(t);
        drawGame(t);
        requestAnimationFrame(loop);
      }

      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
