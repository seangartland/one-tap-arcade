<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230c0e18'/%3E%3Cpath d='M5 23 L15 17' stroke='%239a8ff5' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='19' cy='14' r='5' fill='%23c9c2ff'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#0c0e18" />
  <title>Dodge - a one-drag comet game</title>
  <link rel="stylesheet" href="/shared/arcade.css" />
  <style>
    :root {
      color-scheme: dark;
      --paper: #0c0e18;
      --ink: #f1efff;
      --muted: #a3a3c2;
      --line: rgba(241,239,255,.15);
      --cyan: #4bc7cf;
      --coral: #ff765f;
      --lime: #a78bfa;
      --panel: rgba(12,14,24,.85);
      --shadow: rgba(0,0,0,.5);
      --mark-dot: var(--cyan);
      --lime-deep: #2c2148;
    }
    .grain { opacity: .09; mix-blend-mode: screen; }
    canvas { touch-action: none; }
    .mark:has(svg) svg { filter: none; }
  </style>
</head>
<body class="game">
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Dodge the falling shards. Drag anywhere or use arrow keys to steer the comet."></canvas>
    <div class="hud hud-center" aria-live="polite">
      <div class="score-wrap">
        <span class="score" id="score">0</span>
      </div>
    </div>
    <div class="hint">Drag anywhere · <span class="key">WASD</span></div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 120 68" aria-hidden="true"><defs><radialGradient id="dodgeHaze" cx=".85" cy=".12" r=".95"><stop offset="0" stop-color="#ff2bd6" stop-opacity=".18"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient></defs><rect width="120" height="68" fill="url(#dodgeHaze)"/><path d="M14 51 L46 36" stroke="#7edcff" stroke-width="4" stroke-linecap="round" opacity=".3" fill="none"/><path d="M26 45 L48 35" stroke="#aaf5ff" stroke-width="2" stroke-linecap="round" opacity=".55" fill="none"/><circle cx="54" cy="32" r="8" fill="#aaf5ff" opacity=".9"/><circle cx="54" cy="32" r="4" fill="#ffffff"/><circle cx="54" cy="32" r="15" stroke="#ffd166" stroke-width="1.6" fill="none" stroke-dasharray="4 5" opacity=".85"/><path d="M86 12 l3.2 -3.2 l3.2 3.2 l-3.2 3.2 z" stroke="#ff2bd6" stroke-width="1.4" fill="none"/><path d="M89 16 L89 7" stroke="#ff2bd6" stroke-width="1.6" stroke-linecap="round" opacity=".22"/><path d="M89 15 L89 10" stroke="#ff2bd6" stroke-width=".9" stroke-linecap="round" opacity=".7"/><path d="M99 27 l2.7 -2.7 l2.7 2.7 l-2.7 2.7 z" stroke="#ff2bd6" stroke-width="1.4" fill="none"/><path d="M102 30 L102 21" stroke="#ff2bd6" stroke-width="1.6" stroke-linecap="round" opacity=".22"/><path d="M102 29 L102 24" stroke="#ff2bd6" stroke-width=".9" stroke-linecap="round" opacity=".7"/></svg></div>
    </section>
  </main>

  <script>
    window.ARCADE = {
      game: 'dodge',
      title: 'Dodge.',
      tagline: "Drag the comet. Don't touch the storm.",
      startLabel: 'Start diving',
      restartLabel: 'Dive again',
      resultLabel: 'Dive complete',
      boardHeading: 'Dodge · Global leaders'
    };
  </script>
  <script src="/shared/arcade.js"></script>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = Arcade.gameEl;
      var scoreEl = document.getElementById('score');
      var tone = Arcade.tone;
      var showToast = Arcade.showToast;
      var colors = Arcade.colors;


      var state = 'ready';
      var W = 0, H = 0, dpr = 1;
      var bgGrad = null, vigGrad = null;
      var score = 0;
      var scoreFloat = 0;
      var elapsed = 0;
      function checkPhase() {
        var n = Math.min(5, 1 + Math.floor(elapsed / 15));
        if (Arcade.setPhase(n)) {
          tone(520, .12, 'sine', .06, 0);
          tone(392, .16, 'sine', .05, .09);
        }
      }
      var last = 0;
      var particles = [];
      var rings = [];
      var shards = [];
      var stars = [];
      var trail = [];
      var nebulas = [];
      var flash = 0;
      var tension = 0;
      var shake = 0;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // APEX palette: cyan player, amber target/score, magenta threat, white hot core
      var C_CYAN = [1, 205, 250];
      var C_ICE = [170, 245, 255];
      var C_AMB = [255, 209, 102];
      var C_MAG = [255, 43, 214];
      var C_WHT = [255, 255, 255];
      function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
      function mixc(a, b, t) { return [a[0] + (b[0] - a[0]) * t | 0, a[1] + (b[1] - a[1]) * t | 0, a[2] + (b[2] - a[2]) * t | 0]; }

      // player
      var px = 0, py = 0, tx = 0, ty = 0;
      var keys = {};
      var KEY_SPEED = 460;
      var HIT_R = 21;
      var GRAZE_R = 54;


      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        bgGrad = ctx.createRadialGradient(W / 2, H * .35, 0, W / 2, H * .35, Math.hypot(W, H) * .8);
        bgGrad.addColorStop(0, '#0a1634'); bgGrad.addColorStop(.55, '#050a1a'); bgGrad.addColorStop(1, '#020308');
        vigGrad = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.min(W, H) * .72);
        vigGrad.addColorStop(0, 'rgba(0,0,0,0)'); vigGrad.addColorStop(1, 'rgba(0,0,0,.62)');
        px = tx = W / 2; py = ty = H * .68;
        initField();
      }
      window.addEventListener('resize', resize, {passive:true});

      var rand = Arcade.rand;

      function initField() {
        stars = [];
        var n = Math.round(Math.min(170, W * H / 9000));
        for (var i = 0; i < n; i++) {
          stars.push({ x: Math.random() * W, y: Math.random() * H, s: rand(.6, 1.9), spd: rand(10, 42), tw: Math.random() * Math.PI * 2 });
        }
        nebulas = [
          { x: W * .2, y: H * .25, r: Math.max(W, H) * .32, c: '70,120,230', vx: 6, vy: 3, ph: 0 },
          { x: W * .82, y: H * .7, r: Math.max(W, H) * .28, c: '60,190,235', vx: -5, vy: 4, ph: 2 },
          { x: W * .6, y: H * .1, r: Math.max(W, H) * .22, c: '120,150,255', vx: 4, vy: -3, ph: 4 }
        ];
      }

      function grazeSound() {
        tone(880, .1, 'sine', .07, 0);
        tone(1318, .12, 'sine', .05, .045);
      }
      function deathSound() {
        tone(96, .32, 'sine', .2, 0);
        tone(58, .5, 'triangle', .16, .02);
        tone(180, .18, 'sawtooth', .06, 0);
      }

      function setScore() {
        scoreEl.textContent = String(score);
      }

      function spawnShard(startY) {
        var size = rand(9, 15);
        shards.push({
          x: rand(-10, W + 10),
          y: startY === undefined ? -30 : startY,
          vx: rand(-46, 46),
          vy: (150 + elapsed * 4.2 + rand(0, 90)) * (1 + (Arcade.phase() - 1) * .16),
          size: size,
          rot: rand(0, Math.PI * 2),
          spin: rand(-2.4, 2.4),
          grazed: false
        });
      }

      function startGame() {
        Arcade.startFlow();
        state = 'playing';
        score = 0; scoreFloat = 0; elapsed = 0; Arcade.resetPhase();
        shards = []; particles = []; rings = []; trail = [];
        flash = 0; tension = 0; shake = 0;
        spawnTimer = .5;
        spawnShard(-30); spawnShard(-160); spawnShard(-290);
        px = tx = W / 2; py = ty = H * .68;
        setScore();
        gameEl.classList.add('playing');
        tone(440, .09, 'sine', .07, 0);
        tone(660, .13, 'sine', .06, .065);
        canvas.focus({preventScroll:true});
      }
      var spawnTimer = 0;

      function burst(x, y, color, count) {
        if (reduced) count = Math.min(count, 4);
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2;
          var v = rand(55, 190);
          particles.push({x:x, y:y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, life:1, size:rand(2,5), color:color});
        }
      }

      function die() {
        if (state !== 'playing') return;
        state = 'dying';
        deathSound();
        burst(px, py, C_MAG, 26);
        burst(px, py, C_WHT, 16);
        shake = reduced ? 0 : 13;
        flash = .4;
        setTimeout(endGame, 420);
      }

      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        Arcade.gameOver({
          score: score,
          title: String(score),
          instruction: score === 0 ? 'The storm caught you instantly. Keep moving.' : (score < 20 ? 'Nice dodge. The storm only gets meaner.' : 'Sharp flying. One more dive?'),
          restartLabel: 'Dive again'
        });
      }

      function pointFromEvent(e) {
        return { x: e.clientX, y: e.clientY };
      }
      canvas.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        Arcade.initAudio();
        var p = pointFromEvent(e);
        tx = p.x; ty = p.y;
      });
      window.addEventListener('pointermove', function (e) {
        if (state !== 'playing') return;
        tx = e.clientX; ty = e.clientY;
      }, {passive:true});

      document.addEventListener('keydown', function (e) {
        keys[e.code] = true;
        if (state === 'playing' && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].indexOf(e.code) >= 0) e.preventDefault();
      });
      document.addEventListener('keyup', function (e) { keys[e.code] = false; });

      ARCADE.onStart = startGame;
      ARCADE.onVisibility = function(){ last = performance.now(); };

      function update(dt) {
        elapsed += dt;
        checkPhase();

        scoreFloat += dt;
        if (state === 'playing') {
          var s = Math.floor(scoreFloat);
          if (s !== score) { score = s; setScore(); }
        }

        // keyboard steering overrides pointer target
        var kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
        var ky = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
        if (kx || ky) {
          var len = Math.hypot(kx, ky);
          tx = px + kx / len * KEY_SPEED * .25;
          ty = py + ky / len * KEY_SPEED * .25;
        }

        // comet follows pointer with lag
        var k = Math.min(1, dt * 11);
        px += (tx - px) * k;
        py += (ty - py) * k;
        var m = 14;
        px = Math.max(m, Math.min(W - m, px));
        py = Math.max(m, Math.min(H - m, py));

        trail.push({x: px, y: py});
        if (trail.length > 26) trail.shift();

        // spawn shards
        if (state === 'playing') {
          spawnTimer -= dt;
          var interval = Math.max(.26, 0.8 - elapsed * .011);
          if (spawnTimer <= 0) { spawnShard(); spawnTimer = interval * rand(.75, 1.25); }
        }

        // update shards
        for (var i = shards.length - 1; i >= 0; i--) {
          var sh = shards[i];
          sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.rot += sh.spin * dt;
          if (state === 'playing') {
            var dx = sh.x - px, dy = sh.y - py;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < HIT_R + sh.size * .5) { die(); return; }
            if (!sh.grazed && dist < GRAZE_R && dist >= HIT_R + sh.size * .5) sh.grazed = true;
            if (sh.grazed && sh.y > py + 42) {
              sh.grazed = false;
              score += 2; scoreFloat += 2; setScore();
              grazeSound();
              rings.push({x: sh.x, y: sh.y, r: 8, life: 1, color: C_AMB});
              tension = .55;
              showToast('+2 close call', '#ffd166');
            }
          }
          if (sh.y > H + 40 || sh.x < -60 || sh.x > W + 60) shards.splice(i, 1);
        }

        // starfield drift
        for (var st = 0; st < stars.length; st++) {
          var star = stars[st];
          star.y += star.spd * dt; star.tw += dt * 2;
          if (star.y > H + 4) { star.y = -4; star.x = Math.random() * W; }
        }
        for (var nb = 0; nb < nebulas.length; nb++) {
          var neb = nebulas[nb];
          neb.x += neb.vx * dt; neb.y += neb.vy * dt; neb.ph += dt * .3;
          if (neb.x < -neb.r) neb.x = W + neb.r; if (neb.x > W + neb.r) neb.x = -neb.r;
          if (neb.y < -neb.r) neb.y = H + neb.r; if (neb.y > H + neb.r) neb.y = -neb.r;
        }

        // effects
        for (var p = particles.length - 1; p >= 0; p--) {
          var pt = particles[p];
          pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= .975; pt.vy *= .975; pt.life -= dt * 1.9;
          if (pt.life <= 0) particles.splice(p, 1);
        }
        for (var rg = rings.length - 1; rg >= 0; rg--) {
          rings[rg].r += dt * 90; rings[rg].life -= dt * 2.2;
          if (rings[rg].life <= 0) rings.splice(rg, 1);
        }
        flash = Math.max(0, flash - dt * 1.7);
        tension = Math.max(0, tension - dt * 1.4);
        shake = Math.max(0, shake - dt * 46);
      }

      function drawGrid() {
        var sp = 64;
        var mn = new Path2D(), mj = new Path2D();
        var i, x, y;
        for (i = 0; i <= W / sp + 1; i++) {
          x = i * sp;
          if (i % 5 === 0) { mj.moveTo(x, 0); mj.lineTo(x, H); }
          else { mn.moveTo(x, 0); mn.lineTo(x, H); }
        }
        for (i = 0; i <= H / sp + 1; i++) {
          y = i * sp;
          if (i % 5 === 0) { mj.moveTo(0, y); mj.lineTo(W, y); }
          else { mn.moveTo(0, y); mn.lineTo(W, y); }
        }
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(40,130,255,.06)'; ctx.stroke(mn);
        ctx.lineWidth = 1.4; ctx.strokeStyle = 'rgba(90,170,255,.12)'; ctx.stroke(mj);
      }

      function drawBackground(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        // faint blue grid
        drawGrid();

        // nebulas
        nebulas.forEach(function (neb) {
          var wob = 1 + .06 * Math.sin(neb.ph);
          var g = ctx.createRadialGradient(neb.x, neb.y, 0, neb.x, neb.y, neb.r * wob);
          g.addColorStop(0, 'rgba(' + neb.c + ',.12)');
          g.addColorStop(1, 'rgba(' + neb.c + ',0)');
          ctx.fillStyle = g;
          ctx.fillRect(neb.x - neb.r, neb.y - neb.r, neb.r * 2, neb.r * 2);
        });

        // stars
        stars.forEach(function (star) {
          ctx.globalAlpha = .35 + .3 * Math.sin(star.tw);
          ctx.fillStyle = colors.ink;
          ctx.fillRect(star.x, star.y, star.s, star.s);
        });
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      function drawGame(t) {
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        // storm haze where threats arrive
        var hz = ctx.createLinearGradient(0, 0, 0, H * .2);
        hz.addColorStop(0, 'rgba(255,43,214,.09)');
        hz.addColorStop(1, 'rgba(255,43,214,0)');
        ctx.fillStyle = hz;
        ctx.fillRect(0, 0, W, H * .2);

        // shards: hollow magenta diamonds with tapered tails, stacked-stroke glow
        shards.forEach(function (sh) {
          var r = sh.size;
          var spd = Math.sqrt(sh.vx * sh.vx + sh.vy * sh.vy) || 1;
          var nx = sh.vx / spd, ny = sh.vy / spd;
          var px2 = -ny, py2 = nx;
          var tl = r * 2.8;
          var tg = ctx.createLinearGradient(sh.x - nx * tl, sh.y - ny * tl, sh.x, sh.y);
          tg.addColorStop(0, rgba(C_MAG, 0));
          tg.addColorStop(1, rgba(C_MAG, .26));
          ctx.fillStyle = tg;
          ctx.beginPath();
          ctx.moveTo(sh.x + nx * r * .6, sh.y + ny * r * .6);
          ctx.lineTo(sh.x - nx * tl - px2 * r * .7, sh.y - ny * tl - py2 * r * .7);
          ctx.lineTo(sh.x - nx * tl + px2 * r * .7, sh.y - ny * tl + py2 * r * .7);
          ctx.closePath(); ctx.fill();

          ctx.save();
          ctx.translate(sh.x, sh.y);
          ctx.rotate(sh.rot);
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          var P = new Path2D();
          P.moveTo(0, -r); P.lineTo(r * .72, 0); P.lineTo(0, r); P.lineTo(-r * .72, 0); P.closePath();
          ctx.lineWidth = r * 1.8; ctx.strokeStyle = rgba(C_MAG, .06); ctx.stroke(P);
          ctx.lineWidth = r * .9; ctx.strokeStyle = rgba(C_MAG, .2); ctx.stroke(P);
          ctx.lineWidth = 1.5; ctx.strokeStyle = rgba(mixc(C_MAG, C_WHT, .35), .9); ctx.stroke(P);
          ctx.fillStyle = rgba(C_MAG, .1); ctx.fill(P);
          ctx.fillStyle = 'rgba(255,255,255,.9)';
          ctx.beginPath(); ctx.arc(0, r * .55, 1.4, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        });

        // comet trail: three overlapping passes, brighter toward the head
        for (var pass = 0; pass < 3; pass++) {
          for (var i = 0; i < trail.length; i++) {
            var tp = trail[i];
            var f = trail.length > 1 ? i / (trail.length - 1) : 1;
            if (pass === 0) {
              ctx.globalAlpha = .05 * f; ctx.fillStyle = rgba(C_CYAN, 1);
              ctx.beginPath(); ctx.arc(tp.x, tp.y, 3 + f * 7, 0, Math.PI * 2); ctx.fill();
            } else if (pass === 1) {
              ctx.globalAlpha = .15 * f; ctx.fillStyle = rgba(C_ICE, 1);
              ctx.beginPath(); ctx.arc(tp.x, tp.y, 1.8 + f * 4, 0, Math.PI * 2); ctx.fill();
            } else {
              ctx.globalAlpha = .85 * f; ctx.fillStyle = rgba(mixc(C_ICE, C_WHT, f), 1);
              ctx.beginPath(); ctx.arc(tp.x, tp.y, .9 + f * 2.2, 0, Math.PI * 2); ctx.fill();
            }
          }
        }
        ctx.globalAlpha = 1;

        // comet head: stacked-stroke glow, cyan body, white core
        if (state === 'playing' || state === 'dying') {
          ctx.save();
          ctx.globalAlpha = .08; ctx.fillStyle = rgba(C_CYAN, 1);
          ctx.beginPath(); ctx.arc(px, py, 24, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = .22; ctx.fillStyle = rgba(C_CYAN, 1);
          ctx.beginPath(); ctx.arc(px, py, 15, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(170,245,255,1)';
          ctx.beginPath(); ctx.arc(px, py, 10, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,1)';
          ctx.beginPath(); ctx.arc(px - 2, py - 2, 3.6, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        // particles + rings
        particles.forEach(function (p) {
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = rgba(p.color, Math.max(0, p.life));
          var s = Math.max(.6, p.size * p.life);
          ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
        });
        rings.forEach(function (r) {
          ctx.globalAlpha = Math.max(0, r.life);
          ctx.setLineDash([5, 7]);
          ctx.lineWidth = 2.4 * r.life + .4;
          ctx.strokeStyle = rgba(r.color, .9);
          ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2); ctx.stroke();
          ctx.setLineDash([]);
        });
        ctx.globalAlpha = 1;
        ctx.restore();

        // vignette (black edge)
        ctx.fillStyle = vigGrad;
        ctx.fillRect(0, 0, W, H);
        if (tension > 0) {
          var rg2 = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .7);
          rg2.addColorStop(0, 'rgba(255,209,102,0)');
          rg2.addColorStop(1, 'rgba(255,209,102,' + (tension * .18).toFixed(3) + ')');
          ctx.fillStyle = rg2;
          ctx.fillRect(0, 0, W, H);
        }
        if (flash > 0) {
          ctx.globalAlpha = flash * .22;
          ctx.fillStyle = 'rgba(255,43,214,1)';
          ctx.fillRect(0, 0, W, H);
          ctx.globalAlpha = 1;
        }
      }

      function loop(t) {
        var dt = Math.min(.033, (t - last) / 1000 || 0); last = t;
        if (state === 'playing' || state === 'dying') update(dt);
        else {
          // idle drift behind the start screen
          for (var st = 0; st < stars.length; st++) {
            stars[st].y += stars[st].spd * dt * .4;
            if (stars[st].y > H + 4) { stars[st].y = -4; stars[st].x = Math.random() * W; }
          }
          flash = Math.max(0, flash - dt * 1.7);
          shake = Math.max(0, shake - dt * 46);
        }
        drawBackground(t);
        drawGame(t);
        requestAnimationFrame(loop);
      }

      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
