<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111416'/%3E%3Crect x='7' y='8' width='18' height='5' rx='1.5' fill='%23ff6b57'/%3E%3Crect x='7' y='15' width='18' height='5' rx='1.5' fill='%2345c8d8'/%3E%3Crect x='7' y='22' width='10' height='3' rx='1.5' fill='%23f2f0e9'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070f" />
  <title>Breakout - a neon brick breaker</title>
  <link rel="stylesheet" href="/shared/arcade.css" />
  <style>
    canvas { touch-action: none; }
    .hud-stack .score { text-align: center; }
  </style>
</head>
<body class="game">
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Neon brick breaker game. Drag to move the paddle, tap to launch the ball."></canvas>
    <div class="hud hud-stack" aria-live="polite">
      <span class="score" id="score">0</span>
      <div class="lives" aria-label="3 lives remaining">
        <span class="life"></span><span class="life"></span><span class="life"></span>
      </div>
    </div>
    <div class="hint">Drag to move · Tap to launch</div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 120 68" aria-hidden="true"><g fill="currentColor"><rect x="14" y="8" width="26" height="9" rx="2" opacity=".9"/><rect x="44" y="8" width="26" height="9" rx="2" opacity=".55"/><rect x="74" y="8" width="26" height="9" rx="2" opacity=".9"/><rect x="29" y="21" width="26" height="9" rx="2" opacity=".55"/><rect x="59" y="21" width="26" height="9" rx="2" opacity=".9"/><rect x="14" y="52" width="34" height="6" rx="3"/><circle cx="74" cy="42" r="4"/></g></svg></div>
    </section>
  </main>

  <script>
    window.ARCADE = {
      game: 'breakout',
      title: 'Breakout.',
      tagline: 'Drag to slide the paddle. Smash every brick.',
      startLabel: 'Start smashing',
      restartLabel: 'Smash again',
      resultLabel: 'Run complete',
      boardHeading: 'Breakout · Global leaders'
    };
  </script>
  <script src="/shared/arcade.js"></script>

  <script>
    (function () {
      'use strict';
      var canvas = document.getElementById('canvas');
      var ctx = canvas.getContext('2d');
      var gameEl = Arcade.gameEl;
      var scoreEl = document.getElementById('score');
      var livesEls = Array.prototype.slice.call(document.querySelectorAll('.life'));
      var livesLabel = document.querySelector('.lives');
      var tone = Arcade.tone;
      var showToast = Arcade.showToast;
      var colors = Arcade.colors;


      /* ---------- game state ---------- */
      var state = 'ready'; // ready | serve | playing | over
      var W = 0, H = 0, dpr = 1;
      var score = 0, lives = 3, level = 1;
      var streak = 0;            // consecutive bricks without touching paddle
      var bricksSmashed = 0;    // total this run, drives speed-ups
      var last = 0;
      var particles = [];
      var floaters = [];
      var trail = [];
      var shake = 0;
      var paddleGlow = 0;
      var wallTickCd = 0;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var paddle = { x: 0, w: 120, h: 13, y: 0, targetX: 0 };
      var ball = { x: 0, y: 0, vx: 0, vy: 0, r: 7 };
      var ballSpeed = 400;
      var bricks = [];
      var dragging = false;
      var keyL = false, keyR = false;

      var ROW_COLORS = ['#ff6b57', '#f5b942', '#b8e04a', '#45c8d8', '#9a7bff'];
      var ROW_POINTS = [5, 4, 3, 2, 1];
      var COLS = 8, ROWS = 5;

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', Arcade.refreshColors);

      function rand(min, max) { return min + Math.random() * (max - min); }
      function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

      function baseSpeed() { return Math.max(360, Math.min(W, H) * 0.62); }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        paddle.w = clamp(W * 0.24, 96, 160);
        paddle.y = H - Math.max(64, H * 0.085);
        if (state === 'ready' || state === 'over') {
          paddle.x = W / 2; paddle.targetX = W / 2;
          buildLevel();
          stickBall();
        } else {
          paddle.x = clamp(paddle.x, paddle.w / 2 + 8, W - paddle.w / 2 - 8);
          paddle.targetX = clamp(paddle.targetX, paddle.w / 2 + 8, W - paddle.w / 2 - 8);
        }
      }
      window.addEventListener('resize', resize, {passive: true});

      function buildLevel() {
        bricks = [];
        var marginX = Math.max(18, W * 0.045);
        var gap = 6;
        var top = Math.max(96, H * 0.13);
        var bw = (W - marginX * 2 - gap * (COLS - 1)) / COLS;
        var bh = clamp(bw * 0.44, 20, 30);
        for (var r = 0; r < ROWS; r++) {
          for (var c = 0; c < COLS; c++) {
            bricks.push({
              x: marginX + c * (bw + gap),
              y: top + r * (bh + gap),
              w: bw, h: bh,
              color: ROW_COLORS[r],
              points: ROW_POINTS[r]
            });
          }
        }
      }

      function stickBall() {
        ball.x = paddle.x;
        ball.y = paddle.y - ball.r - 3;
        ball.vx = 0; ball.vy = 0;
        trail = [];
      }

      /* ---------- audio ---------- */
      function brickSound() {
        var mult = Math.min(2.2, 1 + streak * 0.07);
        tone(540 * mult, .09, 'sine', .10, 0);
        tone(810 * mult, .11, 'sine', .06, .04);
      }
      function paddleSound() { tone(300, .09, 'triangle', .10, 0); tone(450, .08, 'sine', .06, .03); }
      function wallSound() {
        if (wallTickCd > 0) return;
        wallTickCd = 0.09;
        tone(240, .05, 'sine', .045, 0);
      }
      function missSound() { tone(220, .2, 'triangle', .12, 0); }
      function levelSound() {
        tone(523, .1, 'sine', .09, 0);
        tone(659, .1, 'sine', .09, .09);
        tone(784, .16, 'sine', .09, .18);
      }

      /* ---------- hud ---------- */
      function setLives() {
        livesEls.forEach(function (el, i) { el.classList.toggle('lost', i >= lives); });
        livesLabel.setAttribute('aria-label', lives + (lives === 1 ? ' life remaining' : ' lives remaining'));
      }
      function setScore() { scoreEl.textContent = String(score); }
      function burst(x, y, color, count) {
        if (reduced) count = Math.min(count, 4);
        for (var i = 0; i < count; i++) {
          var a = Math.random() * Math.PI * 2;
          var v = rand(55, 170);
          particles.push({x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, size: rand(2, 5), color: color});
        }
      }

      /* ---------- flow ---------- */
      function startGame() {
        Arcade.startFlow();
        state = 'serve';
        score = 0; lives = 3; level = 1;
        streak = 0; bricksSmashed = 0;
        ballSpeed = baseSpeed();
        particles = []; floaters = []; trail = [];
        shake = 0; paddleGlow = 0;
        paddle.x = W / 2; paddle.targetX = W / 2;
        buildLevel(); stickBall();
        setScore(); setLives();
        tone(440, .09, 'sine', .07, 0);
        tone(660, .13, 'sine', .06, .065);
        canvas.focus({preventScroll: true});
      }
      function launchBall() {
        if (state !== 'serve') return;
        var a = rand(-0.55, 0.55);
        ball.vx = ballSpeed * Math.sin(a);
        ball.vy = -ballSpeed * Math.cos(a);
        state = 'playing';
        gameEl.classList.add('playing');
        tone(520, .08, 'sine', .07, 0);
      }
      function levelUp() {
        level++;
        ballSpeed = baseSpeed() * (1 + (level - 1) * 0.12);
        buildLevel();
        state = 'serve';
        gameEl.classList.remove('playing');
        stickBall();
        levelSound();
        showToast('Level ' + level, colors.cyan);
      }
      function loseLife() {
        lives--; setLives();
        missSound();
        shake = reduced ? 0 : 10;
        streak = 0;
        burst(ball.x, Math.min(ball.y, H - 20), colors.coral, 14);
        if (lives <= 0) {
          state = 'over';
          gameEl.classList.remove('playing');
          setTimeout(endGame, 550);
        } else {
          state = 'serve';
          gameEl.classList.remove('playing');
          stickBall();
          showToast(lives + (lives === 1 ? ' life' : ' lives') + ' left', colors.coral);
        }
      }
      function endGame() {
        state = 'over'; gameEl.classList.remove('playing');
        Arcade.gameOver({
          score: score,
          title: String(score),
          instruction: score === 0
            ? 'The bricks held their ground. Drag the paddle and tap to launch.'
            : (score < 30 ? 'Solid smashing. Higher rows pay more. Aim up.' : 'Certified brick demolisher. One more run?'),
          restartLabel: 'Smash again'
        });
      }

      /* ---------- physics ---------- */
      function normalizeBall() {
        var s = Math.hypot(ball.vx, ball.vy) || 1;
        ball.vx = ball.vx / s * ballSpeed;
        ball.vy = ball.vy / s * ballSpeed;
        if (Math.abs(ball.vy) < ballSpeed * 0.2) {
          ball.vy = (ball.vy < 0 ? -1 : 1) * ballSpeed * 0.2;
          var s2 = Math.hypot(ball.vx, ball.vy);
          ball.vx = ball.vx / s2 * ballSpeed;
          ball.vy = ball.vy / s2 * ballSpeed;
        }
      }
      function smashBrick(b) {
        var idx = bricks.indexOf(b);
        if (idx >= 0) bricks.splice(idx, 1);
        score += b.points;
        streak++;
        bricksSmashed++;
        setScore();
        if (bricksSmashed % 10 === 0) {
          ballSpeed *= 1.07;
          normalizeBall();
        }
        burst(b.x + b.w / 2, b.y + b.h / 2, b.color, 10);
        floaters.push({x: b.x + b.w / 2, y: b.y, text: '+' + b.points, life: 1, color: b.color});
        brickSound();
      }
      function stepBall(dt) {
        var px = ball.x, py = ball.y;
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // walls
        if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); wallSound(); }
        else if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); wallSound(); }
        if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); wallSound(); }

        // paddle
        if (ball.vy > 0 &&
            ball.y + ball.r >= paddle.y && ball.y + ball.r <= paddle.y + paddle.h + 14 &&
            ball.x >= paddle.x - paddle.w / 2 - ball.r && ball.x <= paddle.x + paddle.w / 2 + ball.r) {
          var offset = clamp((ball.x - paddle.x) / (paddle.w / 2), -1, 1);
          var a = offset * 1.05;
          ball.vx = ballSpeed * Math.sin(a);
          ball.vy = -ballSpeed * Math.cos(a);
          ball.y = paddle.y - ball.r - 1;
          streak = 0;
          paddleGlow = 1;
          paddleSound();
        }

        // bricks (first hit per substep)
        for (var i = 0; i < bricks.length; i++) {
          var b = bricks[i];
          var nx = clamp(ball.x, b.x, b.x + b.w);
          var ny = clamp(ball.y, b.y, b.y + b.h);
          var dx = ball.x - nx, dy = ball.y - ny;
          if (dx * dx + dy * dy <= ball.r * ball.r) {
            var fromTop = py + ball.r <= b.y + 1;
            var fromBottom = py - ball.r >= b.y + b.h - 1;
            if (fromTop || fromBottom) {
              ball.vy = fromTop ? -Math.abs(ball.vy) : Math.abs(ball.vy);
              ball.y = fromTop ? b.y - ball.r - 0.5 : b.y + b.h + ball.r + 0.5;
            } else {
              var fromLeft = px + ball.r <= b.x + 1;
              ball.vx = fromLeft ? -Math.abs(ball.vx) : Math.abs(ball.vx);
              ball.x = fromLeft ? b.x - ball.r - 0.5 : b.x + b.w + ball.r + 0.5;
            }
            normalizeBall();
            smashBrick(b);
            break;
          }
        }

        // miss
        if (ball.y - ball.r > H + 8) loseLife();
      }

      function update(dt) {
        wallTickCd = Math.max(0, wallTickCd - dt);

        // paddle movement
        var minX = paddle.w / 2 + 8, maxX = W - paddle.w / 2 - 8;
        if (keyL) paddle.targetX -= dt * Math.max(W * 1.4, 520);
        if (keyR) paddle.targetX += dt * Math.max(W * 1.4, 520);
        paddle.targetX = clamp(paddle.targetX, minX, maxX);
        paddle.x += (paddle.targetX - paddle.x) * Math.min(1, dt * 20);
        paddle.x = clamp(paddle.x, minX, maxX);

        if (state === 'serve') {
          stickBall();
        } else if (state === 'playing') {
          var steps = 3, sdt = dt / steps;
          for (var s = 0; s < steps && state === 'playing'; s++) stepBall(sdt);
          if (state === 'playing' && bricks.length === 0) levelUp();
          // trail
          trail.push({x: ball.x, y: ball.y});
          if (trail.length > 12) trail.shift();
        }

        // effects
        for (var i = particles.length - 1; i >= 0; i--) {
          var p = particles[i];
          p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .975; p.vy *= .975; p.life -= dt * 1.9;
          if (p.life <= 0) particles.splice(i, 1);
        }
        for (var j = floaters.length - 1; j >= 0; j--) {
          var f = floaters[j];
          f.y -= dt * 34; f.life -= dt * 1.3;
          if (f.life <= 0) floaters.splice(j, 1);
        }
        shake = Math.max(0, shake - dt * 45);
        paddleGlow = Math.max(0, paddleGlow - dt * 2.2);
      }

      /* ---------- draw ---------- */
      function rr(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }
      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        ctx.save();
        if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

        // vignette
        var vg = ctx.createRadialGradient(W / 2, H * 0.42, Math.min(W, H) * 0.35, W / 2, H * 0.5, Math.max(W, H) * 0.75);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,0.16)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, W, H);

        // bricks
        for (var i = 0; i < bricks.length; i++) {
          var b = bricks[i];
          ctx.save();
          ctx.shadowColor = b.color;
          ctx.shadowBlur = 10;
          rr(b.x, b.y, b.w, b.h, 5);
          ctx.fillStyle = b.color;
          ctx.fill();
          ctx.restore();
          ctx.fillStyle = 'rgba(255,255,255,0.28)';
          rr(b.x + 3, b.y + 3, b.w - 6, 3, 1.5);
          ctx.fill();
        }

        // paddle
        ctx.save();
        ctx.shadowColor = colors.cyan;
        ctx.shadowBlur = 14 + paddleGlow * 22;
        var pg = ctx.createLinearGradient(paddle.x - paddle.w / 2, 0, paddle.x + paddle.w / 2, 0);
        pg.addColorStop(0, colors.cyan);
        pg.addColorStop(1, colors.lime);
        rr(paddle.x - paddle.w / 2, paddle.y, paddle.w, paddle.h, paddle.h / 2);
        ctx.fillStyle = pg;
        ctx.fill();
        ctx.restore();

        // ball trail
        for (var k = 0; k < trail.length; k++) {
          var tp = trail[k];
          var ta = (k + 1) / trail.length;
          ctx.globalAlpha = ta * 0.28;
          ctx.fillStyle = colors.cyan;
          ctx.beginPath();
          ctx.arc(tp.x, tp.y, ball.r * ta * 0.9, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        // ball
        if (state === 'serve' || state === 'playing') {
          ctx.save();
          ctx.shadowColor = colors.coral;
          ctx.shadowBlur = 16;
          ctx.beginPath();
          ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.restore();
          ctx.beginPath();
          ctx.arc(ball.x - 2, ball.y - 2, 2, 0, Math.PI * 2);
          ctx.fillStyle = colors.coral;
          ctx.fill();
        }

        // particles + floaters
        particles.forEach(function (p) {
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.textAlign = 'center';
        ctx.font = '500 12px DM Mono, monospace';
        floaters.forEach(function (f) {
          ctx.globalAlpha = Math.max(0, f.life);
          ctx.fillStyle = f.color;
          ctx.fillText(f.text, f.x, f.y);
        });
        ctx.globalAlpha = 1;

        // screen-edge glow on paddle hits
        if (paddleGlow > 0) {
          var eg = ctx.createLinearGradient(0, H - 46, 0, H);
          eg.addColorStop(0, 'rgba(0,0,0,0)');
          eg.addColorStop(1, colors.cyan);
          ctx.globalAlpha = paddleGlow * 0.22;
          ctx.fillStyle = eg;
          ctx.fillRect(0, H - 46, W, 46);
          ctx.globalAlpha = 1;
        }

        ctx.restore();
      }

      function loop(t) {
        var dt = Math.min(0.033, (t - last) / 1000 || 0);
        last = t;
        if (state === 'serve' || state === 'playing') update(dt);
        else { shake = Math.max(0, shake - dt * 45); }
        draw(t);
        requestAnimationFrame(loop);
      }

      /* ---------- input ---------- */
      ARCADE.onStart = startGame;
      ARCADE.onVisibility = function(){ last = performance.now(); };
      canvas.addEventListener('pointerdown', function (e) {
        e.preventDefault();
        Arcade.initAudio();
        dragging = true;
        paddle.targetX = e.clientX;
        canvas.focus({preventScroll: true});
        if (state === 'serve') launchBall();
      });
      canvas.addEventListener('pointermove', function (e) {
        if (e.pointerType === 'mouse' || dragging) paddle.targetX = e.clientX;
      });
      window.addEventListener('pointerup', function () { dragging = false; });
      window.addEventListener('pointercancel', function () { dragging = false; });
      document.addEventListener('keydown', function (e) {
        if (e.code === 'ArrowLeft') { keyL = true; e.preventDefault(); }
        else if (e.code === 'ArrowRight') { keyR = true; e.preventDefault(); }
        else if ((e.code === 'Space' || e.code === 'Enter')) {
          if (state === 'serve') { e.preventDefault(); Arcade.initAudio(); launchBall(); }
        }
      });
      document.addEventListener('keyup', function (e) {
        if (e.code === 'ArrowLeft') keyL = false;
        else if (e.code === 'ArrowRight') keyR = false;
      });

      resize();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
