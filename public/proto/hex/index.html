<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#05070f" />
<meta name="color-scheme" content="dark" />
<title>HEX</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    position: fixed; inset: 0; height: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #05070f;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
  }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; color: #e7f6ff; }
  canvas { position: fixed; inset: 0; display: block; width: 100vw; height: 100vh; touch-action: none; }
  .score {
    position: fixed; top: calc(14px + env(safe-area-inset-top));
    left: 0; right: 0; text-align: center;
    font-size: 42px; letter-spacing: 3px; z-index: 1;
    text-shadow: 0 0 16px rgba(25,227,255,.75);
    pointer-events: none;
  }
  .overlay {
    position: fixed; inset: 0; z-index: 2; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; text-align: center; padding: 28px;
    background: rgba(5,7,15,.55);
  }
  .title {
    font-size: 66px; letter-spacing: 12px; font-weight: 700;
    color: #19e3ff;
    text-shadow: 0 0 20px rgba(25,227,255,.8), 0 0 70px rgba(25,227,255,.35);
  }
  .sub {
    font-size: 14px; line-height: 1.6; letter-spacing: 1px;
    color: rgba(231,246,255,.75); max-width: 320px;
  }
  .best { font-size: 14px; letter-spacing: 2px; color: rgba(231,246,255,.7); }
  .best.new { color: #ff2bd6; text-shadow: 0 0 12px rgba(255,43,214,.8); }
  .result-label { font-size: 15px; letter-spacing: 5px; color: #ff2bd6; text-shadow: 0 0 14px rgba(255,43,214,.7); }
  .time { font-size: 52px; letter-spacing: 2px; color: #e7f6ff; text-shadow: 0 0 18px rgba(25,227,255,.8); }
  .cue {
    font-size: 13px; letter-spacing: 4px; color: #ff2bd6; margin-top: 8px;
    text-shadow: 0 0 12px rgba(255,43,214,.8);
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { opacity: .2; } }
  .cloaked { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="score" id="score">0.0</div>
<div class="overlay" id="start" role="dialog" aria-label="Start HEX">
  <div class="title">HEX</div>
  <div class="sub">Hold the left or right half of the screen to spin. Slide into the gap before the walls close in.</div>
  <div class="best" id="startBest">BEST 0.0s</div>
  <div class="cue" id="startCue">TAP TO START</div>
</div>
<div class="overlay cloaked" id="over" hidden role="dialog" aria-label="Game over">
  <div class="result-label">GAME OVER</div>
  <div class="time" id="finalTime">0.0s</div>
  <div class="best" id="finalBest">BEST 0.0s</div>
  <div class="cue">TAP TO RESTART</div>
</div>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var startEl = document.getElementById('start');
  var overEl = document.getElementById('over');
  var finalTime = document.getElementById('finalTime');
  var finalBest = document.getElementById('finalBest');
  var startBest = document.getElementById('startBest');
  var TAU = Math.PI * 2;
  var cyan = '#19e3ff', mag = '#ff2bd6', ink = '#e7f6ff';
  var W = 0, H = 0, DPR = 1, cx = 0, cy = 0, orb = 0, hex = 0, edge = 0;
  var state = 'menu', elapsed = 0, pa = 0, rotSpd = 3.2;
  var walls = [], parts = [], trail = [], stars = [];
  var nextSpawn = .5, flash = 0, shake = 0, magE = false;
  var best = parseFloat(localStorage.getItem('hex-best') || '0') || 0;
  var touch = {}, mouse = false, mouseSide = 0, left = false, right = false;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function rand(a, b) { return a + Math.random() * (b - a); }
  function norm(a) { a %= TAU; return a < 0 ? a + TAU : a; }
  function angDiff(a, b) { var d = norm(a - b); return d > Math.PI ? d - TAU : d; }
  function sideOf(x) { return x < W / 2 ? -1 : 1; }

  function refreshInput() {
    left = false; right = false;
    for (var k in touch) { if (touch[k] < 0) left = true; else right = true; }
    if (mouse) { if (mouseSide < 0) left = true; else right = true; }
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2; cy = H / 2;
    orb = Math.min(W, H) * .30;
    hex = orb * .55;
    edge = Math.hypot(W, H) / 2 + 20;
    if (!stars.length) {
      var n = Math.round(Math.min(70, W * H / 14000));
      for (var i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, s: rand(.4, 2), t: Math.random() * TAU });
    }
  }
  window.addEventListener('resize', resize, { passive: true });

  function resetRun() {
    elapsed = 0; pa = 0; walls = []; trail = []; flash = 0; shake = 0;
    nextSpawn = .5; rotSpd = 3.2; magE = false;
    touch = {}; mouse = false; left = right = false;
    scoreEl.textContent = '0.0';
  }

  function spawnWall() {
    var T = Math.max(1.1, 2.4 - elapsed * .04);
    var spd = (edge - orb) / T;
    magE = !magE;
    walls.push({ r: edge, rot: Math.random() * TAU, gap: (Math.random() * 6) | 0, gapLen: 1, spin: (Math.random() < .5 ? -1 : 1) * rand(.18, .6), spd: spd, passed: false, col: magE ? mag : cyan });
  }

  function die() {
    state = 'dying';
    flash = 1; shake = reduced ? 0 : 14;
    var x = cx + Math.cos(pa) * orb, y = cy + Math.sin(pa) * orb;
    for (var i = 0; i < 18; i++) {
      var a = Math.random() * TAU, v = rand(60, 230);
      parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, col: Math.random() < .5 ? cyan : mag });
    }
    setTimeout(endRun, 400);
  }

  function endRun() {
    state = 'over';
    var sc = elapsed, nb = false;
    if (sc > best) { best = sc; nb = true; try { localStorage.setItem('hex-best', best.toFixed(1)); } catch (e) {} }
    finalTime.textContent = sc.toFixed(1) + 's';
    finalBest.textContent = (nb ? 'NEW BEST ' : 'BEST ') + best.toFixed(1) + 's';
    finalBest.className = 'best' + (nb ? ' new' : '');
    startBest.textContent = 'BEST ' + best.toFixed(1) + 's';
    overEl.classList.remove('cloaked');
  }

  function startGame() {
    startEl.classList.add('cloaked');
    overEl.classList.add('cloaked');
    resetRun();
    state = 'playing';
  }
  startEl.addEventListener('click', startGame);
  overEl.addEventListener('click', startGame);

  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; touch[t.identifier] = sideOf(t.clientX); }
    refreshInput();
  }, { passive: false });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) { var t = e.changedTouches[i]; touch[t.identifier] = sideOf(t.clientX); }
    refreshInput();
  }, { passive: false });
  function dropTouch(e) {
    for (var i = 0; i < e.changedTouches.length; i++) delete touch[e.changedTouches[i].identifier];
    refreshInput();
  }
  canvas.addEventListener('touchend', dropTouch, { passive: false });
  canvas.addEventListener('touchcancel', dropTouch, { passive: false });
  window.addEventListener('mousedown', function (e) { mouse = true; mouseSide = sideOf(e.clientX); refreshInput(); });
  window.addEventListener('mousemove', function (e) { if (mouse) { mouseSide = sideOf(e.clientX); refreshInput(); } }, { passive: true });
  window.addEventListener('mouseup', function () { mouse = false; refreshInput(); });
  window.addEventListener('blur', function () { touch = {}; mouse = false; left = right = false; });
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function update(dt) {
    if (state === 'playing') {
      elapsed += dt;
      scoreEl.textContent = elapsed.toFixed(1);
      rotSpd = 3.2 + Math.min(1.4, elapsed * .02);
      if (left) pa -= rotSpd * dt;
      if (right) pa += rotSpd * dt;
      trail.push({ a: pa });
      if (trail.length > 34) trail.shift();
      nextSpawn -= dt;
      if (nextSpawn <= 0) { spawnWall(); nextSpawn = Math.max(.7, 1.85 - elapsed * .035) * rand(.8, 1.2); }
      for (var i = walls.length - 1; i >= 0; i--) {
        var w = walls[i], prevAp = w.r * Math.cos(Math.PI / 6);
        w.r -= w.spd * dt; w.rot += w.spin * dt;
        var ap = w.r * Math.cos(Math.PI / 6);
        if (!w.passed && prevAp >= orb && ap <= orb) {
          w.passed = true;
          var playerSide = Math.floor(norm(pa - w.rot) / (TAU / 6)) % 6;
          var g0 = w.gap, g1 = (w.gap + w.gapLen) % 6;
          var inGap = g0 < g1 ? (playerSide >= g0 && playerSide < g1) : (playerSide >= g0 || playerSide < g1);
          if (!inGap) { die(); return; }
        }
        if (ap < -40) walls.splice(i, 1);
      }
    }
    for (var p = parts.length - 1; p >= 0; p--) {
      var q = parts[p]; q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= .95; q.vy *= .95; q.life -= dt * 2.4;
      if (q.life <= 0) parts.splice(p, 1);
    }
    for (var s = 0; s < stars.length; s++) stars[s].t += dt * 2;
    flash = Math.max(0, flash - dt * 2.2);
    shake = Math.max(0, shake - dt * 44);
  }

  function pathHex(r) {
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = i / 6 * TAU, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath();
  }

  function draw() {
    var t = performance.now() / 1000;
    ctx.fillStyle = '#05070f'; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake) ctx.translate(rand(-shake, shake), rand(-shake, shake));

    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = .3 + .35 * Math.sin(st.t);
      ctx.fillStyle = ink;
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
    ctx.globalAlpha = 1;

    var pulse = .3 + .15 * Math.sin(t * 3);
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(t * .4); ctx.translate(-cx, -cy);
    ctx.strokeStyle = 'rgba(25,227,255,' + pulse.toFixed(2) + ')';
    ctx.lineWidth = 2;
    pathHex(hex); ctx.stroke();
    ctx.strokeStyle = 'rgba(25,227,255,.12)';
    ctx.lineWidth = 1;
    pathHex(hex * .86); ctx.stroke();
    ctx.restore();

    ctx.strokeStyle = 'rgba(231,246,255,.09)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, orb, 0, TAU); ctx.stroke();

    ctx.lineCap = 'round';
    for (var j = 0; j < walls.length; j++) {
      var w = walls[j];
      var ri = Math.max(w.r, 0);
      for (var s = 0; s < 6; s++) {
        if (s >= w.gap && s < w.gap + w.gapLen) continue;
        var a0 = w.rot + s * TAU / 6, a1 = w.rot + (s + 1) * TAU / 6;
        var x0 = cx + Math.cos(a0) * ri, y0 = cy + Math.sin(a0) * ri;
        var x1 = cx + Math.cos(a1) * ri, y1 = cy + Math.sin(a1) * ri;
        ctx.strokeStyle = w.col;
        ctx.globalAlpha = .14; ctx.lineWidth = 22;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        ctx.globalAlpha = 1; ctx.lineWidth = 11;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;

    if (state === 'playing' || state === 'dying') {
      for (var k = 0; k < trail.length; k++) {
        var tt = trail[k], f = (k + 1) / trail.length;
        ctx.globalAlpha = f * .13;
        ctx.fillStyle = cyan;
        ctx.beginPath(); ctx.arc(cx + Math.cos(tt.a) * orb, cy + Math.sin(tt.a) * orb, 1 + f * 4, 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
      var tx = cx + Math.cos(pa) * (orb + 8), ty = cy + Math.sin(pa) * (orb + 8);
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(cx + Math.cos(pa - .30) * (orb - 6), cy + Math.sin(pa - .30) * (orb - 6));
      ctx.lineTo(cx + Math.cos(pa + .30) * (orb - 6), cy + Math.sin(pa + .30) * (orb - 6));
      ctx.closePath();
      ctx.save();
      ctx.shadowColor = cyan; ctx.shadowBlur = 16;
      ctx.fillStyle = ink; ctx.fill();
      ctx.restore();
      ctx.fillStyle = cyan;
      ctx.beginPath(); ctx.arc(tx, ty, 2, 0, TAU); ctx.fill();
    }

    for (var m = 0; m < parts.length; m++) {
      var pt = parts[m];
      ctx.globalAlpha = Math.max(0, pt.life);
      ctx.fillStyle = pt.col;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, 3 * pt.life, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    var vg = ctx.createRadialGradient(cx, cy, Math.min(W, H) * .3, cx, cy, Math.max(W, H) * .72);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    if (flash > 0) {
      ctx.globalAlpha = flash * .3;
      ctx.fillStyle = ink; ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  var last = performance.now();
  function frame(t) {
    var dt = Math.min(.033, (t - last) / 1000 || 0);
    last = t;
    if (state === 'playing' || state === 'dying') update(dt);
    else pa += dt * .5;
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  startBest.textContent = 'BEST ' + best.toFixed(1) + 's';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
