<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070f">
<title>METEOR</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070f;
    font-family:ui-monospace,Menlo,Monaco,Consolas,monospace;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;display:block;touch-action:none;cursor:crosshair}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;background:rgba(5,7,15,.82);backdrop-filter:blur(4px);
    color:#e8f6ff;z-index:2;transition:opacity .25s}
  .overlay.hidden{opacity:0;pointer-events:none}
  .overlay .title{font-size:clamp(44px,12vw,96px);font-weight:800;letter-spacing:.12em;
    text-shadow:0 0 18px #40e6ff,0 0 46px #ff765f}
  .overlay .sub{margin:10px 0 0;font-size:clamp(13px,4vw,17px);color:#9fd8e8;letter-spacing:.06em}
  .overlay .cta{margin-top:34px;font-size:clamp(14px,4.5vw,18px);color:#ffd9a8;
    animation:pulse 1.4s infinite;letter-spacing:.1em}
  .overlay .stats{margin-top:22px;font-size:clamp(22px,7vw,34px);font-weight:700;color:#ffd27a}
  .overlay .stats small{display:block;font-size:clamp(12px,3.4vw,15px);color:#7fb8cc;font-weight:400;margin-top:6px}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  #hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;
    justify-content:space-between;align-items:flex-start;padding:0 14px;z-index:1;pointer-events:none;
    font-family:ui-monospace,Menlo,Monaco,Consolas,monospace}
  #score{font-size:clamp(20px,6vw,30px);font-weight:800;color:#9ff3ff;text-shadow:0 0 12px #1fb7d8}
  #combo{font-size:clamp(13px,4vw,17px);color:#ffb26b;margin-top:2px;min-height:20px;letter-spacing:.05em}
  #combo.off{color:#4b6b7a}
  #pips{display:flex;gap:7px}
  .pip{width:16px;height:16px;border-radius:50%;background:transparent;border:2px solid #8a52d6;
    box-shadow:inset 0 0 6px rgba(138,82,214,.6)}
  .pip.on{background:#ff7ad9;border-color:#ff7ad9;box-shadow:0 0 12px #ff7ad9}
</style>
</head>
<body>
<canvas id="c" aria-label="METEOR. Tap falling meteors to blast them before they reach your base."></canvas>
<div id="hud">
  <div>
    <div id="score">0</div>
    <div id="combo" class="off">combo x1</div>
  </div>
  <div id="pips"></div>
</div>

<div class="overlay" id="start">
  <div class="title">METEOR</div>
  <div class="sub">Tap falling rocks to blast them before they hit the base</div>
  <div class="cta">TAP TO START</div>
</div>

<div class="overlay hidden" id="over">
  <div class="title" style="font-size:clamp(34px,9vw,64px)">GAME OVER</div>
  <div class="stats" id="finalScore">0</div>
  <div class="stats" style="margin-top:16px" id="bestScore">best 0</div>
  <div class="cta">TAP TO RESTART</div>
</div>

<script>
(function(){
  "use strict";
  var W=innerWidth,H=innerHeight,c=document.getElementById("c"),x=c.getContext("2d");
  var dpr=Math.min(devicePixelRatio||1,2);
  c.width=W*dpr;c.height=H*dpr;x.scale(dpr,dpr);
  addEventListener("resize",function(){W=innerWidth;H=innerHeight;
    c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);BASE_H=H-46;});

  var BASE_H=H-46,spawnT=0,speed0=1.4,spawn0=1.6,
      state="start",score=0,lives=3,combo=0,best=+(localStorage.getItem("meteor.best")||0),
      meteors=[],blasts=[],parts=[],t=0,flash=0;
  var key=Math.random()*9999;

  var pips=document.getElementById("pips"),scoreEl=document.getElementById("score"),
      comboEl=document.getElementById("combo"),
      startEl=document.getElementById("start"),overEl=document.getElementById("over"),
      finalEl=document.getElementById("finalScore"),bestEl=document.getElementById("bestScore");
  for(var i=0;i<3;i++){var p=document.createElement("div");p.className="pip on";pips.appendChild(p);}

  function round(){
    state="play";score=0;lives=3;combo=0;spawnT=0;speed0=1.4;spawn0=1.6;
    meteors=[];blasts=[];parts=[];flash=0;syncHud();
    startEl.classList.add("hidden");overEl.classList.add("hidden");
  }
  function gameOver(){
    state="over";meteors=[];blasts=[];
    if(score>best){best=score;localStorage.setItem("meteor.best",best);}
    finalEl.textContent=score;bestEl.innerHTML="best "+best+"<small>"+(score>=best&&score>0?"new high score":"")+"</small>";
    overEl.classList.remove("hidden");
  }
  function syncHud(){
    scoreEl.textContent=score;
    comboEl.textContent=(combo>=2?"combo x"+combo:"combo x1");
    comboEl.className=combo>=2?"":"off";
    var ps=pips.children;
    for(var i=0;i<3;i++)ps[i].className="pip"+(i<lives?" on":"");
  }
  function spawn(){
    var sz=14+Math.random()*18;
    meteors.push({x:10+Math.random()*(W-20-sz),y:-sz,r:sz,
      vy:speed0*(0.8+Math.random()*0.7),
      rot:Math.random()*6.28,vr:(Math.random()-.5)*0.12,
      pts:6+((Math.random()*4)|0),seed:Math.random()*999});
  }
  function boom(x,y,r){
    blasts.push({x:x,y:y,r:r,max:Math.max(44,r*2.6)});
    for(var i=0;i<14;i++){
      var a=Math.random()*6.283,d=1+Math.random()*r;
      parts.push({x:x,y:y,vx:Math.cos(a)*d*0.18,vy:Math.sin(a)*d*0.18,l:18+Math.random()*16,s:1+Math.random()*2});
    }
    flash=1;
  }
  function blastAt(px,py){
    var hit=-1,hd=1e9;
    for(var i=0;i<meteors.length;i++){
      var m=meteors[i],d=Math.sqrt((px-m.x)*(px-m.x)+(py-m.y)*(py-m.y));
      var reach=m.r+22;if(d<reach&&d<hd){hd=d;hit=i;}
    }
    if(hit>=0){
      var m=meteors[hit];meteors.splice(hit,1);
      combo++;score+=10*combo;
      boom(m.x,m.y,m.r);syncHud();key=nub();
    }else if(state==="play"){
      combo=0;syncHud();boom(px,py,6);
      drawRipple({x:px,y:py,r:6,max:56});
    }
  }
  function nub(){return Math.random()}

  var ripples=[];
  function drawRipple(r){ripples.push(r);}

  var stars=[];for(var s=0;s<70;s++)stars.push({x:Math.random(),y:Math.random(),r:.4+Math.random()*1.1,t:Math.random()*9});

  function loop(){
    requestAnimationFrame(loop);
    t++;spawnT++;
    var ramp=Math.min(1,score/600);
    if(state==="play"){
      var iv=Math.max(18,spawn0*60*(1-ramp*0.7));
      if(spawnT>=iv){spawnT=0;spawn();}
      if(Math.random()<0.01+ramp*0.03&&meteors.length<10)spawn();
      for(var i=meteors.length-1;i>=0;i--){
        var m=meteors[i];m.y+=m.vy*(1+ramp*1.4);m.rot+=m.vr;
        if(m.y-m.r>=BASE_H){
          meteors.splice(i,1);lives--;flash=1;combo=0;syncHud();
          boom(m.x,BASE_H,m.r);
          if(lives<=0)gameOver();
        }
      }
    }
    for(var b=blasts.length-1;b>=0;b--){blasts[b].r+=8;if(blasts[b].r>blasts[b].max)blasts.splice(b,1);}
    for(var p=parts.length-1;p>=0;p--){parts[p].x+=parts[p].vx;parts[p].y+=parts[p].vy;parts[p].l--;if(parts[p].l<=0)parts.splice(p,1);}
    for(var q=ripples.length-1;q>=0;q--){ripples[q].r+=13;if(ripples[q].r>ripples[q].max)ripples.splice(q,1);}
    if(flash>0)flash*=0.88;

    draw();
  }

  function draw(){
    x.fillStyle="#05070f";x.fillRect(0,0,W,H);
    x.globalCompositeOperation="lighter";
    for(var s=0;s<stars.length;s++){
      var st=stars[s],tw=.4+.6*Math.sin(t*0.02+st.t);
      x.globalAlpha=tw;x.fillStyle="#8fd8ff";
      x.fillRect(st.x*W,st.y*H,st.r,st.r);
    }
    for(var i=0;i<meteors.length;i++){
      var m=meteors[i];
      x.save();x.translate(m.x,m.y);x.rotate(m.rot);
      x.globalAlpha=.35;x.fillStyle="#ff8a3d";
      x.beginPath();x.arc(0,0,m.r*1.9,0,6.283);x.fill();
      x.globalAlpha=1;x.fillStyle="#ffb347";
      rock(m,m.r);
      x.fillStyle="#ff765f";rock(m,m.r*.55);
      x.fillStyle="#ffe9b0";rock(m,m.r*.22);
      x.restore();
      x.globalAlpha=.7;x.fillStyle="#ff6a3d";
      x.beginPath();x.arc(m.x,b=Math.min(m.y+m.r+10,BASE_H),3+.6*Math.sin(t*0.3+m.seed),0,6.283);x.fill();
    }
    x.globalAlpha=1;
    x.fillStyle="#123";x.fillRect(0,BASE_H-3,W,3);
    x.fillStyle="#0a1526";x.fillRect(0,BASE_H,W,BASE_H*0.14);
    x.strokeStyle="#29c7ff";x.lineWidth=2;
    x.shadowColor="#29c7ff";x.shadowBlur=14;
    x.beginPath();x.moveTo(0,BASE_H);x.lineTo(W,BASE_H);x.stroke();
    x.shadowBlur=0;
    for(var j=0;j<blasts.length;j++){
      var bl=blasts[j],k=1-bl.r/bl.max;
      x.globalAlpha=k;x.strokeStyle="#29f0ff";x.lineWidth=3+6*k;
      x.shadowColor="#29f0ff";x.shadowBlur=20;
      x.beginPath();x.arc(bl.x,bl.y,bl.r,0,6.283);x.stroke();
      x.shadowBlur=0;
    }
    for(var p=0;p<ripples.length;p++){
      var rp=ripples[p],kr=1-rp.r/rp.max;
      x.globalAlpha=kr*.8;x.strokeStyle="#ff765f";x.lineWidth=3*kr+1;
      x.beginPath();x.arc(rp.x,rp.y,rp.r,0,6.283);x.stroke();
    }
    x.globalAlpha=1;
    for(var d=0;d<parts.length;d++){
      var o=parts[d],a=o.l/24;
      x.globalAlpha=a;x.fillStyle="#63f2ff";
      x.fillRect(o.x-o.s/2,o.y-o.s/2,o.s,o.s);
    }
    x.globalAlpha=1;
    if(flash>0){x.globalAlpha=flash*.5;x.fillStyle="#ffd9a8";x.fillRect(0,0,W,H);x.globalAlpha=1;}
  }

  function rock(m,r){
    x.beginPath();var n=12;
    for(var i=0;i<=n;i++){
      var a=(i/n)*6.283;
      var rr=r*(0.7+0.3*Math.abs(Math.sin(a*3+m.seed)));
      var px=Math.cos(a)*rr,py=Math.sin(a)*rr;
      if(i===0)x.moveTo(px,py);else x.lineTo(px,py);
    }
    x.closePath();x.fill();
  }

  function point(evt){
    var r=evt.touches&&evt.touches[0]?evt.touches[0]:evt;
    return {x:r.clientX,y:r.clientY};
  }
  function tap(evt){
    evt.preventDefault();
    if(state==="start"){round();return;}
    if(state==="over"){round();return;}
    if(state==="play"){var p=point(evt);blastAt(p.x,p.y);}
  }
  c.addEventListener("touchstart",tap,{passive:false});
  c.addEventListener("mousedown",tap);

  syncHud();
  bestEl.innerHTML="best "+best;
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
