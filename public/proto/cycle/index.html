<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<title>CYCLE</title>
<style>
html,body{margin:0;height:100%;background:#03040a;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;font-family:"DM Mono",ui-monospace,Menlo,Consolas,monospace}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#probe{position:fixed;top:0;left:0;width:0;height:env(safe-area-inset-top);pointer-events:none;visibility:hidden}
#hud{position:fixed;left:0;right:0;top:max(10px,env(safe-area-inset-top));height:56px;z-index:5;pointer-events:none;display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,env(safe-area-inset-left));transition:opacity .4s}
#hud.dim{opacity:0}
#hud .side{width:80px;font-size:11px;letter-spacing:2px}
#spd{color:#7fe8ff;text-shadow:0 0 10px rgba(1,205,250,.55)}
#best{text-align:right;color:#ffcf66;text-shadow:0 0 10px rgba(255,179,0,.55)}
#score{font-size:34px;font-weight:600;letter-spacing:3px;color:#effdff;text-shadow:0 0 12px rgba(1,205,250,.9),0 0 34px rgba(1,205,250,.45);font-variant-numeric:tabular-nums;will-change:transform}
#score.bump{animation:bump .32s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1.35);color:#fff3cf;text-shadow:0 0 16px rgba(255,179,0,1),0 0 40px rgba(255,179,0,.6)}100%{transform:scale(1)}}
#ov{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,rgba(3,4,10,.35) 0%,rgba(3,4,10,.9) 100%);transition:opacity .45s,background .45s}
#ov.hide{opacity:0;pointer-events:none}
#ov.over{background:radial-gradient(ellipse 70% 38% at center,rgba(3,4,10,.72) 0%,rgba(3,4,10,.28) 70%,rgba(3,4,10,.12) 100%)}
#ov h1{font-size:min(78px,19vw);font-weight:600;margin:0;letter-spacing:.28em;padding-left:.28em;color:#e2fdff;text-shadow:0 0 18px rgba(1,205,250,.9),0 0 60px rgba(1,205,250,.5),0 0 120px rgba(255,61,208,.25)}
#ov .lbl{font-size:11px;letter-spacing:5px;color:#ff8be0;text-shadow:0 0 10px rgba(255,61,208,.7);margin-bottom:6px}
#ov .big{font-size:min(96px,24vw);font-weight:600;line-height:1;color:#fff;text-shadow:0 0 16px rgba(1,205,250,.95),0 0 50px rgba(1,205,250,.5)}
#ov .how{margin:18px 30px 0;font-size:13px;line-height:1.7;letter-spacing:.5px;color:#9be9ff;text-shadow:0 0 8px rgba(1,205,250,.35)}
#ov .bst{margin-top:14px;font-size:12px;letter-spacing:4px;color:#ffcf66;text-shadow:0 0 10px rgba(255,179,0,.6)}
#ov .bst.new{color:#fff3cf;text-shadow:0 0 12px rgba(255,179,0,1),0 0 30px rgba(255,179,0,.6);animation:pu 1s infinite}
#ov .go{margin-top:38px;font-size:11px;letter-spacing:5px;color:#ffe0a0;text-shadow:0 0 12px rgba(255,179,0,.9);animation:pu 1.6s infinite}
#ov .in{animation:rise .6s cubic-bezier(.2,.9,.3,1) both}
#ov .in2{animation:rise .6s .08s cubic-bezier(.2,.9,.3,1) both}
#ov .in3{animation:rise .6s .16s cubic-bezier(.2,.9,.3,1) both}
@keyframes rise{0%{opacity:0;transform:translateY(14px);filter:blur(4px)}100%{opacity:1;transform:none;filter:none}}
@keyframes pu{0%,100%{opacity:.35}55%{opacity:1}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="probe"></div>
<div id="hud" class="dim"><div class="side" id="spd">1.00X</div><div id="score">0</div><div class="side" id="best"></div></div>
<div id="ov"></div>
<script>
'use strict';
const cv=document.getElementById('c'),g=cv.getContext('2d');
const ov=document.getElementById('ov'),hud=document.getElementById('hud');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),spdEl=document.getElementById('spd');
const probe=document.getElementById('probe');
const TWO=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

// palette
const CYAN=[64,240,255],MAG=[255,61,208],AMB=[255,179,0],WHITE=[255,255,255];
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const rgb=(c,a)=>a===undefined?`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`:`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

// tuning
const COLS=15,START_LEN=12,SEG=5,BASE_SPEED=6.2,SPEED_STEP=0.04;
const CRASH_T=0.42,GRACE_T=0.25,EAT_T=0.5;
const DX=[0,1,0,-1],DY=[-1,0,1,0];

// layout
let W=0,H=0,DPR=1,ROWS=0,CELL=24,OX=0,OY=0;
const bg=document.createElement('canvas'),bgx=bg.getContext('2d');
const bA=document.createElement('canvas'),bAx=bA.getContext('2d');
const bB=document.createElement('canvas'),bBx=bB.getContext('2d');
const bC=document.createElement('canvas'),bCx=bC.getContext('2d');

function layout(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  cv.width=W*DPR|0;cv.height=H*DPR|0;cv.style.width=W+'px';cv.style.height=H+'px';
  const safe=probe.getBoundingClientRect().height||0;
  const top=Math.max(10,safe)+64,bot=22,availH=H-top-bot;
  if(!ROWS){
    const effW=Math.min(W,availH*.5+28);
    ROWS=clamp(Math.floor(availH/((effW-28)/COLS)),18,34);
  }
  CELL=Math.floor(Math.min((W-28)/COLS,availH/ROWS));
  OX=Math.round((W-COLS*CELL)/2);
  OY=Math.round(top+(availH-ROWS*CELL)/2);
  bA.width=Math.ceil(W/4);bA.height=Math.ceil(H/4);
  bB.width=Math.ceil(W/8);bB.height=Math.ceil(H/8);
  bC.width=Math.ceil(W/16);bC.height=Math.ceil(H/16);
  buildBg();
}

function buildBg(){
  bg.width=W*DPR|0;bg.height=H*DPR|0;
  const b=bgx;b.setTransform(DPR,0,0,DPR,0,0);
  b.fillStyle='#03040a';b.fillRect(0,0,W,H);
  const aw=COLS*CELL,ah=ROWS*CELL,mx=OX+aw/2,my=OY+ah/2;
  // floor
  let gr=b.createRadialGradient(mx,my,0,mx,my,Math.max(aw,ah)*.75);
  gr.addColorStop(0,'#0a1224');gr.addColorStop(1,'#05070f');
  b.fillStyle=gr;b.fillRect(OX,OY,aw,ah);
  // grid
  b.lineWidth=1;
  for(let i=1;i<COLS;i++){
    b.strokeStyle=i%5===0?'rgba(64,200,255,.13)':'rgba(64,200,255,.055)';
    b.beginPath();b.moveTo(OX+i*CELL+.5,OY);b.lineTo(OX+i*CELL+.5,OY+ah);b.stroke();
  }
  for(let j=1;j<ROWS;j++){
    b.strokeStyle=j%5===0?'rgba(64,200,255,.13)':'rgba(64,200,255,.055)';
    b.beginPath();b.moveTo(OX,OY+j*CELL+.5);b.lineTo(OX+aw,OY+j*CELL+.5);b.stroke();
  }
  // grid intersections
  b.fillStyle='rgba(120,230,255,.18)';
  for(let i=0;i<=COLS;i+=5)for(let j=0;j<=ROWS;j+=5)b.fillRect(OX+i*CELL-1,OY+j*CELL-1,3,3);
  // border glow
  b.save();
  b.shadowColor='rgba(64,220,255,.9)';b.shadowBlur=18;
  b.strokeStyle='rgba(64,230,255,.85)';b.lineWidth=2;
  b.strokeRect(OX-1,OY-1,aw+2,ah+2);
  b.shadowBlur=0;
  b.strokeStyle='rgba(210,250,255,.7)';b.lineWidth=.75;
  b.strokeRect(OX-1,OY-1,aw+2,ah+2);
  b.strokeStyle='rgba(64,230,255,.18)';b.lineWidth=1;
  b.strokeRect(OX-6.5,OY-6.5,aw+13,ah+13);
  b.restore();
  // corner brackets
  b.strokeStyle='rgba(255,61,208,.75)';b.lineWidth=2;
  const k=14;
  for(const [x,y,sx,sy] of [[OX-6,OY-6,1,1],[OX+aw+6,OY-6,-1,1],[OX-6,OY+ah+6,1,-1],[OX+aw+6,OY+ah+6,-1,-1]]){
    b.beginPath();b.moveTo(x,y+sy*k);b.lineTo(x,y);b.lineTo(x+sx*k,y);b.stroke();
  }
  // vignette
  gr=b.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.55)');
  b.fillStyle=gr;b.fillRect(0,0,W,H);
}

const px=i=>OX+(i+.5)*CELL, py=j=>OY+(j+.5)*CELL;

// state
let mode='demo'; // demo | play | dead
let trail=[],occ=null,dir=0,tgt={x:0,y:0},t=0,queue=0,graced=false;
let maxLen=START_LEN,grow=0,eaten=0,score=0,orb=null,visAng=0,deadAt=0,crashP=null;
let best=+(localStorage.getItem('cycle-best')||0);
let parts=[],rings=[],texts=[],pulses=[],ghost=null;
let headOff=[0,0],shake=0,flash=0,now=0,lastPulse=0,demoResetAt=0,overlayShown=false;

const speed=()=>BASE_SPEED*(1+SPEED_STEP*eaten);
const idx=(x,y)=>y*COLS+x;
const inB=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
const angOf=d=>d*Math.PI/2-Math.PI/2;

function blocked(x,y){
  if(!inB(x,y))return true;
  if(!occ[idx(x,y)])return false;
  const tl=trail[0];
  // the tail slides away as we arrive, so its cell is fair game when not growing
  return !(trail.length>1&&tl.x===x&&tl.y===y&&trail.length>=maxLen&&occ[idx(x,y)]===1);
}

function reset(m){
  if(trail.length>1)makeGhost();
  mode=m;
  occ=new Uint16Array(COLS*ROWS);
  const s={x:COLS>>1,y:ROWS-5};
  trail=[s];occ[idx(s.x,s.y)]=1;
  dir=0;visAng=angOf(0);tgt={x:s.x,y:s.y-1};t=0;queue=0;graced=false;
  maxLen=START_LEN;grow=0;eaten=0;headOff=[0,0];score=0;pulses=[];crashP=null;
  orb=null;spawnOrb();
  scoreEl.textContent='0';updateHud();
}

function makeGhost(){
  ghost={pts:trailPoints(),cols:trailColors(),born:now};
  // derez sparks along the old trail
  for(let i=0;i<46;i++){
    const k=Math.random()*(ghost.pts.length-1),a=ghost.pts[k|0],b=ghost.pts[Math.min(ghost.pts.length-1,(k|0)+1)],f=k-(k|0);
    const c=ghost.cols[Math.min(ghost.cols.length-1,k|0)];
    parts.push({x:lerp(a[0],b[0],f),y:lerp(a[1],b[1],f),vx:rand(-20,20),vy:rand(-50,-10),life:0,max:rand(.4,.9),c,s:rand(1,2.2)});
  }
}

function spawnOrb(){
  const h=trail[trail.length-1];
  const seen=new Uint8Array(COLS*ROWS),q=[];
  const start=inB(tgt.x,tgt.y)&&!occ[idx(tgt.x,tgt.y)]?tgt:h;
  q.push(start);seen[idx(start.x,start.y)]=1;
  const cand=[],any=[];
  for(let qi=0;qi<q.length;qi++){
    const c=q[qi];
    for(let d=0;d<4;d++){
      const nx=c.x+DX[d],ny=c.y+DY[d];
      if(!inB(nx,ny)||seen[idx(nx,ny)]||occ[idx(nx,ny)])continue;
      seen[idx(nx,ny)]=1;q.push({x:nx,y:ny});
    }
  }
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(occ[idx(x,y)]||(x===tgt.x&&y===tgt.y))continue;
    const far=Math.abs(x-h.x)+Math.abs(y-h.y)>=3;
    if(!far)continue;
    any.push({x,y});
    if(seen[idx(x,y)])cand.push({x,y});
  }
  const pool=cand.length?cand:any;
  if(!pool.length){orb=null;return;}
  const p=pool[Math.random()*pool.length|0];
  let n=0;
  for(let d=0;d<4;d++){const nx=p.x+DX[d],ny=p.y+DY[d];if(!inB(nx,ny)||occ[idx(nx,ny)])n++;}
  orb={x:p.x,y:p.y,v:Math.min(3,1+n),born:now,ph:Math.random()*TWO};
  rings.push({x:px(p.x),y:py(p.y),r0:CELL*2.4,r1:CELL*.3,life:0,max:.38,c:orbCol(orb.v),w:1.5});
}

const orbCol=v=>v===3?[255,214,120]:v===2?[255,190,40]:AMB;

// ---------- simulation ----------
function tap(){
  if(mode!=='play')return;
  if(queue===0&&!graced&&t<GRACE_T){
    // early tap: take the turn at the cell we just left, it feels like it landed on time
    const before=headPoint();
    dir=(dir+1)%4;graced=true;
    const h=trail[trail.length-1];tgt={x:h.x+DX[dir],y:h.y+DY[dir]};
    const after=headPoint();
    headOff=[headOff[0]+before[0]-after[0],headOff[1]+before[1]-after[1]];
  }else if(queue<3)queue++;
}

function arrive(){
  trail.push({x:tgt.x,y:tgt.y});occ[idx(tgt.x,tgt.y)]++;
  while(trail.length>maxLen){const o=trail.shift();occ[idx(o.x,o.y)]--;}
  // growth starts on a cell boundary so the receding tail never jumps
  maxLen+=grow;grow=0;
  if(mode==='demo')botSteer();
  else if(queue>0){queue--;dir=(dir+1)%4;}
  const h=trail[trail.length-1];
  tgt={x:h.x+DX[dir],y:h.y+DY[dir]};graced=false;
}

function room(sx,sy,lim){
  if(blocked(sx,sy))return 0;
  const seen=new Set([idx(sx,sy)]),q=[[sx,sy]];
  for(let i=0;i<q.length&&q.length<lim;i++){
    for(let d=0;d<4;d++){
      const nx=q[i][0]+DX[d],ny=q[i][1]+DY[d];
      if(!inB(nx,ny)||occ[idx(nx,ny)]||seen.has(idx(nx,ny)))continue;
      seen.add(idx(nx,ny));q.push([nx,ny]);
    }
  }
  return q.length;
}
function botSteer(){
  const h=trail[trail.length-1];let bestK=0,bestS=-1e9;
  for(let k=0;k<2;k++){
    const d=(dir+k)%4,nx=h.x+DX[d],ny=h.y+DY[d];
    const r=room(nx,ny,60);
    let s=r<1?-1e9:Math.min(r,40)*2;
    if(orb)s-=(Math.abs(nx-orb.x)+Math.abs(ny-orb.y))*1.2;
    s+=Math.random()*6-(k?1.5:0);
    if(s>bestS){bestS=s;bestK=k;}
  }
  dir=(dir+bestK)%4;
}

function step(dt){
  let adv=speed()*dt;
  while(adv>1e-9&&(mode==='play'||mode==='demo')){
    const st=Math.min(adv,1-t);
    if(t<CRASH_T&&t+st>=CRASH_T&&blocked(tgt.x,tgt.y)){t=CRASH_T;die();return;}
    if(orb&&t<EAT_T&&t+st>=EAT_T&&tgt.x===orb.x&&tgt.y===orb.y)collect();
    t+=st;adv-=st;
    if(t>=1-1e-9){t=0;arrive();}
  }
}

function collect(){
  const v=orb.v,x=px(orb.x),y=py(orb.y),c=orbCol(v);
  eaten++;grow+=SEG;
  if(mode==='play'){
    score+=v;scoreEl.textContent=score;
    scoreEl.classList.remove('bump');void scoreEl.offsetWidth;scoreEl.classList.add('bump');
    texts.push({x,y,s:'+'+v,life:0,max:.9,c,v});
    if(navigator.vibrate)try{navigator.vibrate(v===3?14:8)}catch(e){}
  }
  for(let i=0;i<14+v*8;i++){
    const a=Math.random()*TWO,sp=rand(40,150)*(1+v*.25);
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:rand(.35,.8),c:Math.random()<.35?WHITE:c,s:rand(1.2,2.6)});
  }
  rings.push({x,y,r0:CELL*.3,r1:CELL*(1.8+v*.5),life:0,max:.5,c,w:2.5});
  if(v===3)rings.push({x,y,r0:CELL*.2,r1:CELL*3.6,life:-.06,max:.65,c:MAG,w:1.5});
  pulses.push({d:0,a:.6+v*.15,sp:34});
  if(v===3)shake=Math.max(shake,2.5);
  orb=null;spawnOrb();updateHud();
}

function die(){
  const h=headPoint();crashP=h;deadAt=now;
  shake=mode==='play'?11:5;flash=mode==='play'?.5:.2;
  for(let i=0;i<60;i++){
    const a=Math.random()*TWO,sp=rand(30,260);
    parts.push({x:h[0],y:h[1],vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:rand(.5,1.3),c:[WHITE,CYAN,MAG,AMB][Math.random()*4|0],s:rand(1.2,3)});
  }
  rings.push({x:h[0],y:h[1],r0:4,r1:CELL*4,life:0,max:.6,c:WHITE,w:3});
  rings.push({x:h[0],y:h[1],r0:4,r1:CELL*7,life:-.08,max:.9,c:MAG,w:1.5});
  pulses.push({d:0,a:1,sp:48});
  if(mode==='demo'){mode='demoDead';demoResetAt=now+1.4;return;}
  mode='dead';lastPulse=now;
  if(navigator.vibrate)try{navigator.vibrate([30,40,60])}catch(e){}
  const nb=score>best;
  if(nb){best=score;localStorage.setItem('cycle-best',best);}
  setTimeout(()=>showOver(nb),900);
}

function updateHud(){
  spdEl.textContent=(1+SPEED_STEP*eaten).toFixed(2)+'X';
  bestEl.textContent=best?'BEST '+best:'';
}

// ---------- overlays ----------
function showStart(){
  ov.className='';
  ov.innerHTML='<h1 class="in">CYCLE</h1><div class="how in2">Tap to turn right. Orbs in tight spots pay more.</div>'+
    (best?'<div class="bst in3">BEST '+best+'</div>':'')+'<div class="go">TAP TO START</div>';
  overlayShown=true;hud.classList.add('dim');
}
function showOver(nb){
  ov.className='over';
  ov.innerHTML='<div class="lbl in">DEREZZED</div><div class="big in2">'+score+'</div>'+
    '<div class="bst in3'+(nb?' new':'')+'">'+(nb?'NEW BEST':'BEST '+best)+'</div><div class="go">TAP TO RIDE AGAIN</div>';
  overlayShown=true;hud.classList.add('dim');
}
function hideOv(){ov.classList.add('hide');overlayShown=false;hud.classList.remove('dim');}

function press(e){
  if(e&&e.cancelable)e.preventDefault();
  if(mode==='play'){tap();return;}
  if(mode==='dead'){
    if(!overlayShown||now-deadAt<1.2)return;
    reset('play');hideOv();return;
  }
  if(mode==='demo'||mode==='demoDead'){reset('play');hideOv();}
}
window.addEventListener('pointerdown',press,{passive:false});
window.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='ArrowRight'||e.code==='Enter'||e.code==='KeyD')press(e);
});
window.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('resize',layout);

// ---------- geometry ----------
function headPoint(){
  const h=trail[trail.length-1];
  return [lerp(px(h.x),px(tgt.x),t),lerp(py(h.y),py(tgt.y),t)];
}
function visHead(){const p=headPoint();return [p[0]+headOff[0],p[1]+headOff[1]];}
function trailPoints(){
  const n=trail.length,pts=[];
  const recede=n>1&&n>=maxLen;
  for(let i=0;i<n;i++){
    if(i===0&&recede)pts.push([lerp(px(trail[0].x),px(trail[1].x),t),lerp(py(trail[0].y),py(trail[1].y),t)]);
    else pts.push([px(trail[i].x),py(trail[i].y)]);
  }
  pts.push(crashP||visHead());
  return pts;
}
function trailColors(){
  const m=trail.length,out=[];
  for(let k=0;k<m;k++){
    const f=m<2?1:k/(m-1);
    out.push(mix(MAG,CYAN,Math.pow(f,.65)));
  }
  return out;
}
function pulseBoost(distFromHead){
  let b=0;
  for(const p of pulses){const d=distFromHead-p.d;b+=Math.exp(-d*d/5)*p.a;}
  return Math.min(1,b);
}

// ---------- render ----------
function drawTrail(c,pts,cols,wMul,alpha,bloom){
  const n=pts.length-1;if(n<1)return;
  c.lineCap='round';c.lineJoin='round';
  for(let k=0;k<n;k++){
    const dist=n-1-k;
    const b=pulses.length?pulseBoost(dist):0;
    let col=cols[k];
    const fade=Math.min(1,(k+1)/3.5);
    if(b>0)col=mix(col,WHITE,b*.85);
    c.globalAlpha=alpha*fade;
    c.strokeStyle=rgb(col);
    c.lineWidth=CELL*wMul*(1+b*.7);
    c.beginPath();c.moveTo(pts[k][0],pts[k][1]);c.lineTo(pts[k+1][0],pts[k+1][1]);c.stroke();
  }
  if(!bloom){
    // hot white filament
    c.globalAlpha=alpha*.55;c.strokeStyle='#f2ffff';c.lineWidth=Math.max(1,CELL*.055);
    c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
    for(let k=1;k<=n;k++)c.lineTo(pts[k][0],pts[k][1]);
    c.stroke();
    const s=Math.max(0,n-7);
    c.globalAlpha=alpha*.45;c.lineWidth=Math.max(1.2,CELL*.09);
    c.beginPath();c.moveTo(pts[s][0],pts[s][1]);
    for(let k=s+1;k<=n;k++)c.lineTo(pts[k][0],pts[k][1]);
    c.stroke();
  }
  c.globalAlpha=1;
}

function drawOrb(c,bloom){
  if(!orb)return;
  const x=px(orb.x),y=py(orb.y),col=orbCol(orb.v);
  const age=now-orb.born;
  const u=Math.min(1,age/.42),s=Math.max(0,u<1?1+2.7*Math.pow(u-1,3)+1.7*Math.pow(u-1,2):1); // ease out back
  const beat=1+.09*Math.sin(now*6+orb.ph)+(orb.v===3 ? .06*Math.sin(now*13) : 0);
  const r=CELL*.2*s*beat;
  if(bloom){
    c.fillStyle=rgb(col);c.beginPath();c.arc(x,y,r*2.1,0,TWO);c.fill();
    return;
  }
  const hg=c.createRadialGradient(x,y,0,x,y,CELL*.95*s);
  hg.addColorStop(0,rgb(col,.32));hg.addColorStop(1,rgb(col,0));
  c.fillStyle=hg;c.beginPath();c.arc(x,y,CELL*.95*s,0,TWO);c.fill();
  const cg=c.createRadialGradient(x,y,0,x,y,r);
  cg.addColorStop(0,'#fff');cg.addColorStop(.45,'#fff4d6');cg.addColorStop(1,rgb(col));
  c.fillStyle=cg;c.beginPath();c.arc(x,y,r,0,TWO);c.fill();
  // orbit ring with value pips
  const rr=CELL*.4*s,rot=now*(1.4+orb.v*.5)+orb.ph;
  c.strokeStyle=rgb(orb.v===3?MAG:col,.55);c.lineWidth=1.2;
  c.setLineDash([CELL*.12,CELL*.1]);c.lineDashOffset=-now*14;
  c.beginPath();c.arc(x,y,rr,0,TWO);c.stroke();c.setLineDash([]);
  c.fillStyle='#fff';
  for(let i=0;i<orb.v;i++){
    const a=rot+i*TWO/orb.v;
    c.beginPath();c.arc(x+Math.cos(a)*rr,y+Math.sin(a)*rr,Math.max(1.4,CELL*.07),0,TWO);c.fill();
  }
}

function drawBike(c,bloom){
  const dead=mode==='dead'||mode==='demoDead';
  const [x,y]=crashP||visHead();
  if(bloom){
    c.fillStyle=dead?rgb(AMB):'#e8ffff';
    c.beginPath();c.arc(x,y,CELL*(dead?.7:.55),0,TWO);c.fill();
    return;
  }
  if(dead){
    // scorch star where it ended
    const k=Math.min(1,(now-deadAt)/.4),r=CELL*(.5+.15*Math.sin(now*4));
    c.save();c.translate(x,y);c.rotate(now*.6);
    c.globalCompositeOperation='lighter';
    c.fillStyle=rgb(AMB,.9*k);
    for(let i=0;i<4;i++){c.rotate(Math.PI/4);c.beginPath();c.moveTo(0,-r*1.5);c.lineTo(r*.14,0);c.lineTo(0,r*1.5);c.lineTo(-r*.14,0);c.fill();}
    c.globalCompositeOperation='source-over';
    c.fillStyle='#fff';c.beginPath();c.arc(0,0,CELL*.12,0,TWO);c.fill();
    c.restore();
    return;
  }
  c.save();c.translate(x,y);c.rotate(visAng+Math.PI/2);
  // headlight wash
  c.globalCompositeOperation='lighter';
  const lg=c.createLinearGradient(0,0,0,-CELL*2.4);
  lg.addColorStop(0,'rgba(64,240,255,.22)');lg.addColorStop(1,'rgba(64,240,255,0)');
  c.fillStyle=lg;c.beginPath();c.moveTo(-CELL*.15,-CELL*.2);c.lineTo(-CELL*.55,-CELL*2.4);c.lineTo(CELL*.55,-CELL*2.4);c.lineTo(CELL*.15,-CELL*.2);c.fill();
  const hg=c.createRadialGradient(0,0,0,0,0,CELL*.9);
  hg.addColorStop(0,'rgba(180,250,255,.5)');hg.addColorStop(1,'rgba(64,240,255,0)');
  c.fillStyle=hg;c.beginPath();c.arc(0,0,CELL*.9,0,TWO);c.fill();
  c.globalCompositeOperation='source-over';
  // body: a sleek capsule
  const L=CELL*.42,Wd=CELL*.17;
  c.fillStyle='#0b1a2a';c.strokeStyle='#7ff4ff';c.lineWidth=1.5;
  c.beginPath();
  c.moveTo(-Wd,L*.5);c.lineTo(-Wd,-L*.3);c.quadraticCurveTo(-Wd,-L,0,-L*1.05);c.quadraticCurveTo(Wd,-L,Wd,-L*.3);c.lineTo(Wd,L*.5);
  c.quadraticCurveTo(Wd,L*.8,0,L*.8);c.quadraticCurveTo(-Wd,L*.8,-Wd,L*.5);c.closePath();
  c.fill();c.stroke();
  c.fillStyle='#eaffff';
  c.beginPath();c.ellipse(0,-L*.35,Wd*.45,L*.38,0,0,TWO);c.fill();
  c.fillStyle='#fff';c.beginPath();c.arc(0,-L*.95,Math.max(1.3,CELL*.05),0,TWO);c.fill();
  c.restore();
}

function drawFx(c,bloom){
  for(const p of parts){
    const k=1-p.life/p.max;if(k<=0)continue;
    c.globalAlpha=k;c.fillStyle=rgb(p.c);
    const s=p.s*(bloom?2.2:1)*(.4+.6*k);
    c.fillRect(p.x-s/2,p.y-s/2,s,s);
  }
  c.globalAlpha=1;
  for(const r of rings){
    if(r.life<0)continue;
    const u=r.life/r.max,e=1-Math.pow(1-u,3);
    c.globalAlpha=(1-u)*(bloom?.8:.9);c.strokeStyle=rgb(r.c);c.lineWidth=r.w*(bloom?2.5:1)*(1-u*.6);
    c.beginPath();c.arc(r.x,r.y,Math.max(.1,lerp(r.r0,r.r1,e)),0,TWO);c.stroke();
  }
  c.globalAlpha=1;
}

function render(){
  g.setTransform(DPR,0,0,DPR,0,0);
  g.globalCompositeOperation='source-over';
  g.drawImage(bg,0,0,W,H);
  let sx=0,sy=0;
  if(shake>.05){sx=rand(-shake,shake);sy=rand(-shake,shake);}
  g.translate(sx,sy);

  const pts=trailPoints(),cols=trailColors();
  const deadish=mode==='dead'||mode==='demoDead';
  const breathe=deadish?.82+.18*Math.sin(now*2.2):1;
  let gAlpha=0,gp=null;
  if(ghost){gAlpha=1-(now-ghost.born)/.55;if(gAlpha<=0)ghost=null;else gp=ghost;}

  // crisp pass
  if(gp)drawTrail(g,gp.pts,gp.cols,.2*(.4+.6*gAlpha),gAlpha*.8,false);
  drawTrail(g,pts,cols,.2,breathe,false);
  drawOrb(g,false);
  drawBike(g,false);
  drawFx(g,false);
  for(const tx of texts){
    const u=tx.life/tx.max;
    g.globalAlpha=1-u*u;
    g.font=`600 ${Math.round(CELL*(.7+tx.v*.12)*(1+.3*Math.max(0,1-u*6)))}px "DM Mono",ui-monospace,Menlo,monospace`;
    g.textAlign='center';g.textBaseline='middle';
    g.shadowColor=rgb(tx.c);g.shadowBlur=12;g.fillStyle='#fff';
    g.fillText(tx.s,tx.x,tx.y-CELL*.9-u*CELL*1.4);
    g.shadowBlur=0;
  }
  g.globalAlpha=1;

  // bloom: draw emissive shapes at quarter res, then blur by repeated downsampling
  const a=bAx;
  a.setTransform(1,0,0,1,0,0);a.clearRect(0,0,bA.width,bA.height);
  a.setTransform(.25,0,0,.25,sx*.25,sy*.25);
  if(gp)drawTrail(a,gp.pts,gp.cols,.55,gAlpha,true);
  drawTrail(a,pts,cols,.5,breathe,true);
  drawOrb(a,true);drawBike(a,true);drawFx(a,true);
  bBx.clearRect(0,0,bB.width,bB.height);bBx.drawImage(bA,0,0,bB.width,bB.height);
  bCx.clearRect(0,0,bC.width,bC.height);bCx.drawImage(bB,0,0,bC.width,bC.height);
  g.setTransform(DPR,0,0,DPR,0,0);
  g.globalCompositeOperation='lighter';
  g.imageSmoothingEnabled=true;
  g.globalAlpha=.35;g.drawImage(bA,0,0,bA.width*4,bA.height*4);
  g.globalAlpha=.45;g.drawImage(bB,0,0,bB.width*8,bB.height*8);
  g.globalAlpha=.55;g.drawImage(bC,0,0,bC.width*16,bC.height*16);
  g.globalAlpha=1;g.globalCompositeOperation='source-over';

  if(flash>.01){g.fillStyle=`rgba(230,250,255,${flash})`;g.fillRect(0,0,W,H);}
}

// ---------- loop ----------
let last=performance.now();
function frame(ts){
  let dt=(ts-last)/1000;last=ts;
  if(!(dt>0))dt=0;dt=Math.min(dt,1/20);
  now+=dt;

  if(mode==='play'||mode==='demo'){
    step(dt);
    // smooth steering: always clockwise, so rotate toward target the short way
    let target=angOf(dir),d=target-visAng;
    while(d>Math.PI)d-=TWO;while(d<-Math.PI)d+=TWO;
    visAng+=d*(1-Math.exp(-dt*32));
    // exhaust sparks
    if(Math.random()<dt*28){
      const [hx,hy]=visHead(),ba=visAng+Math.PI;
      parts.push({x:hx+Math.cos(ba)*CELL*.3,y:hy+Math.sin(ba)*CELL*.3,vx:Math.cos(ba+rand(-.5,.5))*rand(20,60),vy:Math.sin(ba+rand(-.5,.5))*rand(20,60),life:0,max:rand(.2,.45),c:Math.random()<.5?WHITE:CYAN,s:rand(1,1.8)});
    }
  }
  if(mode==='demoDead'&&now>=demoResetAt)reset('demo');
  if(mode==='dead'&&now-lastPulse>2.6){lastPulse=now;pulses.push({d:0,a:.55,sp:26});}

  for(const p of parts){p.life+=dt;const dr=Math.exp(-dt*3.2);p.vx*=dr;p.vy*=dr;p.x+=p.vx*dt;p.y+=p.vy*dt;}
  parts=parts.filter(p=>p.life<p.max);
  if(parts.length>600)parts.splice(0,parts.length-600);
  for(const r of rings)r.life+=dt;rings=rings.filter(r=>r.life<r.max);
  for(const x of texts)x.life+=dt;texts=texts.filter(x=>x.life<x.max);
  const tl=trail.length+2;
  for(const p of pulses){p.d+=p.sp*dt;p.a*=Math.exp(-dt*.25);}
  pulses=pulses.filter(p=>p.d<tl+4&&p.a>.03);
  shake*=Math.exp(-dt*9);flash*=Math.exp(-dt*7);
  const ho=Math.exp(-dt*22);headOff[0]*=ho;headOff[1]*=ho;

  render();
  requestAnimationFrame(frame);
}

layout();
reset('demo');
showStart();
requestAnimationFrame(t0=>{last=t0;frame(t0);});
</script>
</body>
