<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305070f'/%3E%3Ccircle cx='16' cy='18' r='8' fill='none' stroke='%2301cdfe' stroke-width='2'/%3E%3Ccircle cx='16' cy='18' r='2' fill='%2301cdfe'/%3E%3Cpath d='M9 30 L15 19 M23 30 L17 19' stroke='%2301cdfe' stroke-width='1.5' opacity='.55'/%3E%3C/svg%3E" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070f" />
  <title>Pin - thread the spinning core</title>
  <link rel="stylesheet" href="/shared/arcade.css" />
  <style>
    canvas { touch-action: none; }
    .pin .score-wrap { display: none; }
  </style>
</head>
<body class="game pin">
  <main class="game" id="game">
    <canvas id="canvas" tabindex="0" aria-label="Throw pins into the spinning core. Tap to fire a pin at the open gaps."></canvas>
    <div class="hud hud-center" aria-live="polite">
      <div class="score-wrap">
        <span class="score" id="score"></span>
      </div>
    </div>
    <div class="hint">Tap to throw</div>

    <section class="overlay" id="overlay" aria-modal="true" role="dialog" aria-labelledby="title">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 120 68" aria-hidden="true"><circle cx="60" cy="34" r="24" fill="none" stroke="currentColor" stroke-width="4" opacity=".4"/><circle cx="60" cy="34" r="3.5" fill="currentColor"/><path d="M30 58 L56 26 M90 58 L64 26" stroke="currentColor" stroke-width="3" stroke-linecap="round" opacity=".55"/><path d="M60 18 L60 6" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
    </section>
  </main>

  <script>
    window.ARCADE = {
      game: 'pin',
      title: 'Pin.',
      tagline: 'Tap to throw a pin. Land it in the open gaps of the spinning core.',
      startLabel: 'Start throwing',
      restartLabel: 'Run it back',
      resultLabel: 'Run complete',
      boardHeading: 'Pin · Global leaders'
    };
  </script>
  <script src="/shared/arcade.js"></script>

  <script>
    'use strict';
    const cv=document.getElementById('canvas'),cx=cv.getContext('2d');
    const gameEl=Arcade.gameEl,scoreEl=document.getElementById('score');
    const tone=Arcade.tone,colors=Arcade.colors;
    const TWO=Math.PI*2;
    const rand=Arcade.rand;
    function rgb(c){const h=c.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)].join(',');}
    let W=0,H=0,CX=0,CY=0,R=50,L=80,HR=7,LY=0;
    function resize(){
      const d=Math.min(window.devicePixelRatio||1,2);
      W=innerWidth;H=innerHeight;
      cv.width=W*d;cv.height=H*d;
      cx.setTransform(d,0,0,d,0,0);
      R=Math.max(38,Math.min(70,Math.min(W,H)*.12));L=R*1.55;HR=Math.max(6,R*.13);
      CX=W/2;CY=H*.36;LY=Math.min(H*.86,CY+R+L+Math.max(140,H*.3));
    }
    addEventListener('resize',resize);
    // state
    let pins=[],rot=0,el=0,score=0;
    let fly=null,load=1,running=false,over=false,hitstop=0,dead=null,deadT=0;
    let pulse=0,shake=0,flash=0,near=0,waves=[];
    const PIN_CAP=12,ODEJ=.38,REV_DUR=1.15;
    let spinDir=1,revT=rand(6,9),revD=0,revFlash=0;
    function reset(){
      pins=[];rot=0;el=0;score=0;fly=null;load=1;hitstop=0;dead=null;deadT=0;pulse=0;shake=0;flash=0;near=0;waves=[];
      spinDir=1;revT=rand(6,9);revD=0;revFlash=0;
      const b=rand(0,TWO);
      for(let i=0;i<4;i++)pins.push({a:b+i*TWO/4+rand(-.35,.35),glow:0,bad:0});
    }
    function speed(){return Math.min(1.25+el*.028,4.2)*(.86+.14*Math.sin(el*.9));}
    function thr(){return 2*Math.asin(Math.min(1,(HR+1.5)/(R+L)));}
    function angDiff(a,b){let d=((a-b)%TWO+TWO)%TWO;return d>Math.PI?TWO-d:d;}
    function checkPhase(){
      Arcade.setPhase(Math.min(5,1+Math.floor(score/12)));
    }
    function setScore(){scoreEl.textContent=String(score);checkPhase();}
    function fire(){
      if(!running||fly||hitstop>0||dead||load<1)return;
      fly={y:LY};load=0;tone(520,.05,'triangle',.035,0);
    }
    function stick(){
      const a=Math.PI/2-rot;
      let min=9,who=null;
      for(const p of pins){const d=angDiff(a,p.a);if(d<min){min=d;who=p;}}
      const t=thr();
      if(who&&min<t){
        who.bad=1;dead={a,x:CX,y:CY+R,vx:rand(-240,240)||120,vy:-rand(220,320),r:0,vr:rand(-12,12)};
        hitstop=.32;shake=12;flash=1;tone(140,.35,'sawtooth',.07,0);
        return;
      }
      pins.push({a,glow:1,bad:0});score++;pulse=1;
      if(pins.length>PIN_CAP){const old=pins[0];old.dieT=ODEJ;waves.push({r:R*.45,a:.55});}
      waves.push({r:R,a:1});
      if(min<t*2.1){near=1;shake=4;tone(1180,.09,'square',.03,0);}
      else tone(880,.07,'triangle',.05,0);
      setScore();
    }
    function end(){
      running=false;over=true;gameEl.classList.remove('playing');
      Arcade.gameOver({
        score:score,
        title:String(score),
        instruction:score===0?'The core caught your pin. Aim for open space.':(score<12?'Nice throws. The core is picking up speed.':'Sharp aim. Keep threading the gaps.'),
        restartLabel:'Run it back'
      });
    }
    function startGame(){
      Arcade.startFlow();Arcade.resetPhase();reset();running=true;over=false;gameEl.classList.add('playing');
      setScore();
      tone(440,.12,'sine',.04,0);
      cv.focus({preventScroll:true});
    }
    ARCADE.onStart=startGame;
    ARCADE.onVisibility=function(){last=performance.now();};
    function update(dt){
      if(!running)return;
      if(hitstop>0){hitstop-=dt;return;}
      el+=dt;
      if(!dead){
        rot+=spinDir*speed()*dt;
        if(Arcade.phase()>=3){
          if(revD>0){revD-=dt;if(revD<=0){spinDir=-spinDir;revT=rand(6,9);}}
          else{revT-=dt;if(revT<=0){spinDir=-spinDir;revD=REV_DUR;revFlash=1;}}
        }
      }
      if(load<1)load=Math.min(1,load+dt*7);
      if(fly){
        fly.y-=2300*dt;
        if(fly.y<=CY+R){fly=null;stick();}
      }
      if(dead){
        deadT+=dt;dead.vy+=1400*dt;dead.x+=dead.vx*dt;dead.y+=dead.vy*dt;dead.r+=dead.vr*dt;
        if(deadT>.75)end();
      }
      for(const p of pins)p.glow=Math.max(0,p.glow-dt*3);
      for(const p of pins){if(p.dieT!==undefined)p.dieT-=dt;}
      pins=pins.filter(p=>p.dieT===undefined||p.dieT>0);
      for(const w of waves){w.r+=260*dt;w.a-=dt*2.4;}
      waves=waves.filter(w=>w.a>0);
    }
    function pinPath(x0,y0,x1,y1,col,glow,a){
      const al=a===undefined?1:a;
      cx.strokeStyle=col;cx.lineCap='round';
      cx.globalAlpha=.25*al;cx.lineWidth=7;cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();
      cx.globalAlpha=al;cx.lineWidth=2.2;cx.beginPath();cx.moveTo(x0,y0);cx.lineTo(x1,y1);cx.stroke();
      cx.shadowColor=col;cx.shadowBlur=12+glow*20;
      cx.fillStyle=glow>0?mix(col,glow):col;cx.beginPath();cx.arc(x1,y1,HR,0,TWO);cx.fill();
      cx.shadowBlur=0;cx.globalAlpha=1;
    }
    function mix(col,t){return t>.5?'#ffffff':col;}
    function draw(){
      const fx=flash;flash=Math.max(0,flash-.04);
      const revF=revFlash;revFlash=Math.max(0,revFlash-.06);
      const sx=shake?rand(-shake,shake):0,sy=shake?rand(-shake,shake):0;shake=Math.max(0,shake*.86-.1);
      cx.fillStyle='#05070f';cx.fillRect(0,0,W,H);
      const g=cx.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.7);
      g.addColorStop(0,near>0?'rgba('+rgb(colors.lime)+','+(.1*near)+')':'rgba(1,120,160,.16)');g.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=g;cx.fillRect(0,0,W,H);near=Math.max(0,near-.03);
      cx.save();cx.translate(sx,sy);
      // aim guide
      cx.strokeStyle='rgba('+rgb(colors.cyan)+',.08)';cx.lineWidth=1;cx.setLineDash([3,7]);
      cx.beginPath();cx.moveTo(CX,CY+R+4);cx.lineTo(CX,LY);cx.stroke();cx.setLineDash([]);
      // stuck pins
      for(const p of pins){
        const a=p.a+rot,c=Math.cos(a),s=Math.sin(a);
        pinPath(CX+c*R,CY+s*R,CX+c*(R+L),CY+s*(R+L),p.bad&&(hitstop>0||dead)?colors.coral:colors.cyan,p.glow,p.dieT!==undefined?Math.max(0,p.dieT/ODEJ):1);
      }
      // waves
      for(const w of waves){cx.globalAlpha=w.a*.6;cx.strokeStyle=colors.cyan;cx.lineWidth=2;cx.beginPath();cx.arc(CX,CY,w.r,0,TWO);cx.stroke();}
      cx.globalAlpha=1;
      // core
      pulse=Math.max(0,pulse-.08);
      const cr=R*(1+pulse*.07),coreCol=revF>0?'#ffffff':(fx>0?colors.coral:colors.cyan);
      const cg=cx.createRadialGradient(CX,CY,0,CX,CY,cr*2.2);
      cg.addColorStop(0,fx>0?'rgba('+rgb(colors.coral)+',.35)':'rgba('+rgb(colors.cyan)+',.3)');cg.addColorStop(1,'rgba(0,0,0,0)');
      cx.fillStyle=cg;cx.beginPath();cx.arc(CX,CY,cr*2.2,0,TWO);cx.fill();
      cx.fillStyle='#071322';cx.beginPath();cx.arc(CX,CY,cr,0,TWO);cx.fill();
      cx.shadowColor=coreCol;cx.shadowBlur=revF>0?44:24;cx.strokeStyle=coreCol;cx.lineWidth=3;
      cx.beginPath();cx.arc(CX,CY,cr,0,TWO);cx.stroke();cx.shadowBlur=0;
      cx.strokeStyle='rgba('+rgb(colors.cyan)+',.35)';cx.lineWidth=1.5;
      for(let i=0;i<3;i++){const a=rot+i*TWO/3;cx.beginPath();cx.arc(CX,CY,cr*.72,a,a+.7);cx.stroke();}
      cx.font='700 '+Math.round(R*.62)+'px "DM Mono",ui-monospace,Menlo,monospace';cx.textAlign='center';cx.textBaseline='middle';
      cx.fillStyle='#e6fbff';cx.shadowColor=colors.cyan;cx.shadowBlur=14;cx.fillText(score,CX,CY+1);cx.shadowBlur=0;
      // flying / loaded pin
      if(fly)pinPath(CX,fly.y,CX,fly.y+L,colors.lime,0);
      else if(running&&!dead){const y=LY+(1-load)*60;cx.globalAlpha=load;pinPath(CX,y,CX,y+L,colors.lime,0);cx.globalAlpha=1;}
      if(dead){
        cx.save();cx.translate(dead.x,dead.y);cx.rotate(dead.r);pinPath(0,0,0,L,colors.coral,0);cx.restore();
      }
      cx.restore();
      if(fx>0){cx.fillStyle='rgba('+rgb(colors.coral)+','+(fx*.18)+')';cx.fillRect(0,0,W,H);}
    }
    let last=performance.now();
    function frame(t){
      const dt=Math.min((t-last)/1000,.05);last=t;
      update(dt);draw();
      requestAnimationFrame(frame);
    }
    cv.addEventListener('touchstart',e=>{e.preventDefault();fire();},{passive:false});
    cv.addEventListener('mousedown',e=>{e.preventDefault();fire();});
    cv.addEventListener('contextmenu',e=>e.preventDefault());
    resize();reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
